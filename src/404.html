<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page not found | Atlas of Fundamental Concepts</title>
  <meta name="description" content="The page you requested does not exist. You'll be redirected to the Atlas home page shortly.">
  <meta http-equiv="refresh" content="10;url=https://atlas.madvay.com/">
  <meta name="theme-color" content="#f6f7f9">
  <script>
    (() => {
      let preference = 'system';
      try {
        const value = JSON.parse(window.localStorage.getItem('human-knowledge-atlas:preferences:v1') || 'null');
        if (value?.version === 1 && (value.theme === 'light' || value.theme === 'dark' || value.theme === 'system')) preference = value.theme;
      } catch { /* use system */ }
      const query = window.matchMedia('(prefers-color-scheme: dark)');
      const apply = () => {
        const dark = preference === 'dark' || (preference === 'system' && query.matches);
        const resolved = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = resolved;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? '#0b1020' : '#f6f7f9';
      };
      apply();
      if (preference === 'system') query.addEventListener?.('change', apply);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #334155;
      --note: #475569;
      --panel: rgba(255, 255, 255, 0.92);
      --line: rgba(15, 23, 42, 0.08);
      --link: #1e40af;
      --shadow: 0 36px 80px rgba(15, 23, 42, 0.12);
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1020;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --note: #94a3b8;
      --panel: rgba(17, 24, 39, 0.94);
      --line: rgba(148, 163, 184, 0.22);
      --link: #93c5fd;
      --shadow: 0 36px 80px rgba(0, 0, 0, 0.48);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 32%),
                  radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.16), transparent 30%),
                  var(--bg);
      color: var(--text);
    }
    .panel {
      max-width: 42rem;
      width: 100%;
      padding: 2.25rem;
      border-radius: 1.5rem;
      box-shadow: var(--shadow);
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .brand {
      font-size: 0.9rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--link);
      font-weight: 700;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(3rem, 5vw, 4.5rem);
      line-height: 0.95;
    }
    p {
      margin: 1rem 0;
      font-size: 1rem;
      color: var(--muted);
    }
    .actions {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .button,
    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 1.35rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
    }
    .button {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.22);
    }
    .link {
      color: var(--link);
      background: rgba(59, 130, 246, 0.10);
    }
    .note {
      margin: 1rem 0 0;
      color: var(--note);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="brand">Atlas of Fundamental Concepts</div>
    <h1>404</h1>
    <p>The page you are looking for does not exist or has moved. You will be redirected to the atlas home page in 10 seconds.</p>
    <div class="actions">
      <a class="button" href="https://atlas.madvay.com/">Go to home</a>
      <a class="link" href="https://atlas.madvay.com/">Return to atlas</a>
    </div>
    <p class="note">If your browser does not redirect automatically, click one of the links above.</p>
  </div>
</body>
</html>
