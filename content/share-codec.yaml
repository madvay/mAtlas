# mAtlas compact filter-token codec registry.
#
# CRITICAL COMPATIBILITY RULES — THIS FILE IS APPEND-ONLY:
#   1. Never reorder slots. Their array indexes are permanent wire identifiers.
#   2. Never delete a slot and never reuse a retired slot for another identifier.
#   3. Add new fields, domains, and edge types only at the END of the
#      corresponding sequence. Display settings are versioned in software.
#   4. To retire an identifier, replace `id: old-id` with `retired: old-id` in
#      the SAME slot. A retired slot remains forever so old links keep meaning
#      the same thing. Do not move it to the end.
#   5. Display order belongs in concepts/index.yaml, not here. This registry is
#      serialization history, not presentation metadata.
#
# The binary format records the number of slots present when a link is made.
# That lets later append-only versions decode old links exactly, while older
# clients can safely ignore appended slots they do not understand.
