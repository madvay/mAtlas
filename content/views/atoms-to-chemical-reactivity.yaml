id: atoms-to-chemical-reactivity
title: From atomic identity to chemical reactivity
summary: Trace how proton number and electronic organization become periodic patterns, bonds, molecular structures, mechanisms, and catalysis.
narrative: Chemistry does not replace atomic physics with a separate inventory of particles. It reuses physical atoms, ions, electrons, orbitals, and bonds, then adds composition, comparative periodic concepts, molecular representations, and reaction evidence. The route shows where simple trends help, where bonding models are alternatives rather than literal pictures, and how structure becomes a constrained reaction pathway.
