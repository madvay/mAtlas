id: quantum-revolution
title: The quantum revolution
summary: Move from the empirical crises of classical physics through quantum mechanics, quantum fields, and precision tests.
narrative: Follow quantum theory from the failures of classical radiation and atomic models through wave–particle evidence, state-space structure, measurement, spin, relativistic quantum mechanics, quantum fields, entanglement, and modern experimental tests.
