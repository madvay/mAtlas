id: foundations-and-logic
title: Foundations and logic
summary: Survey the concepts used to formalize mathematical objects, proof, models, and foundational systems.
narrative: Follow syntax, theories, structures, models, formal proof systems, effective computation, and incompleteness. The Story separates semantic satisfaction from syntactic derivability and treats Gödel’s results with their actual hypotheses.
