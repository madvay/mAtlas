id: equilibrium-solutions-electrochemistry
title: Equilibrium becomes measurable voltage
summary: Connect chemical potential and Gibbs energy to activities, acid–base and solubility equilibria, electrodes, the Nernst relation, and working cells.
narrative: Equilibrium constants are not bare concentration ratios. They depend on a defined reaction, standard states, and activities. That same thermodynamic structure governs phase and acid–base equilibria and appears electrically when redox partners exchange charge through an external circuit. Real batteries and electrolysers then add interfaces, kinetics, transport, and materials beyond the reversible limit.
