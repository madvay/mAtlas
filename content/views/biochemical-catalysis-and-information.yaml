id: biochemical-catalysis-and-information
title: Chemical dynamics in living systems
summary: Link molecular structure, enzyme kinetics, metabolic networks, membrane electrochemistry, and chemical information in nucleic acids.
narrative: Living chemistry uses the same thermodynamic, kinetic, acid–base, redox, and structural constraints as nonliving systems, but organizes them through macromolecular selectivity, compartments, regulation, and driven networks. This path joins molecular interactions to enzyme-rate reductions, pathway dynamics, energy conversion, and experimentally constrained DNA structure and replication.
