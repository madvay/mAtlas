id: evidence-that-shaped-chemistry
title: Evidence that shaped chemistry
summary: Follow experiments that motivated chemical concepts and later measurements that tested their predictions, scope, and limits.
narrative: Historical motivation is not logical derivation, and experimental verification is not timeless proof. This view keeps each experiment in its substantive domain while collecting it through a secondary evidence membership. Motivating experiments sit below the concepts they helped organize; verifying experiments sit above the claims they tested. Qualifications record shared credit, revised interpretations, and the limits of canonical textbook stories.
