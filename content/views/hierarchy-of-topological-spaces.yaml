id: hierarchy-of-topological-spaces
title: The hierarchy of topological properties
summary: Explore separation, countability, metric, compactness, local, connectedness, and zero-dimensionality properties as a branching implication lattice.
narrative: Topological properties do not form one linear ladder. Separation axioms strengthen along one axis; countability conditions along another; metrics, completeness, and separability produce Polish spaces; compactness interacts strongly with Hausdorff and metric assumptions; local compactness and connectedness form additional branches. The selected theorem edges show valid implications without suggesting false converses.
