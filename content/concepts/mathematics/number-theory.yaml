nodes:
  - id: peano_system
    label: Peano system
    primaryDomain: number-theory
    domains:
      - number-theory
      - logic
    level: 3
    kind: structure
    summary: A set with zero and successor satisfying the second-order Peano axioms.
    carriers:
      - set $N$
    data:
      - distinguished $0$
      - successor map
    axioms:
      - successor is injective
      - $0$ is not a successor
      - induction
    induces: []
    notes: ''
    citations:
      - wp-peano
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
    conceptType: Axiomatic number system
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: natural_numbers
    label: Natural numbers $\mathbb N$
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
      - order
      - set-theory
    level: 7
    conceptType: Number system
    summary: The standard Peano system, realized here on the carrier $\omega$ with zero, successor, addition, multiplication, and order.
    carriers:
      - set $\omega$
    data:
      - $0$
      - $S(n)=n\cup\{n\}$
      - addition and multiplication by recursion
      - usual well-order
    axioms:
      - Peano axioms
    induces:
      - commutative semiring structure
    notes: The atlas distinguishes the abstract Peano structure from its selected von Neumann carrier $\omega$.
    citations:
      - nlab-natural-number
      - wp-natural-number
      - wp-peano
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: integer_difference_pairs
    label: Difference pairs of natural numbers
    primaryDomain: number-theory
    domains:
      - number-theory
      - set-theory
      - algebra
    level: 8
    conceptType: Quotient presentation
    summary: Pairs $(a,b)\in\mathbb N^2$ representing formal differences $a-b$.
    carriers:
      - set $\mathbb N\times\mathbb N$
    data:
      - equivalence relation $(a,b)\sim(c,d)$ iff $a+d=b+c$
    axioms: []
    induces:
      - quotient abelian group
    notes: This is the Grothendieck group completion of the additive commutative monoid $\mathbb N$.
    citations:
      - wp-construction-integers
      - nlab-integer
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: integers
    label: Integers $\mathbb Z$
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
      - order
      - set-theory
    level: 10
    conceptType: Number system
    summary: The ordered commutative ring obtained from formal differences of natural numbers.
    carriers:
      - quotient $(\mathbb N\times\mathbb N)/\sim$
    data:
      - addition
      - multiplication
      - total order
    axioms:
      - integral-domain laws
    induces:
      - Euclidean-domain structure
    notes: The map $n\mapsto[(n,0)]$ canonically embeds $\mathbb N$ into $\mathbb Z$; it need not be literal subset inclusion in the quotient realization.
    citations:
      - wp-construction-integers
      - nlab-integer
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: rational_fraction_pairs
    label: Integer fraction pairs
    primaryDomain: number-theory
    domains:
      - number-theory
      - set-theory
      - algebra
    level: 11
    conceptType: Quotient presentation
    summary: Pairs $(a,b)\in\mathbb Z\times(\mathbb Z\setminus\{0\})$ representing fractions $a/b$.
    carriers:
      - set $\mathbb Z\times(\mathbb Z\setminus\{0\})$
    data:
      - equivalence relation $(a,b)\sim(c,d)$ iff $ad=bc$
    axioms: []
    induces:
      - field-of-fractions quotient
    notes: ''
    citations:
      - wp-rational-number
      - nlab-rational-number
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: rational_numbers
    label: Rational numbers $\mathbb Q$
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
      - order
      - set-theory
    level: 13
    conceptType: Number system
    summary: The ordered field of fractions of $\mathbb Z$.
    carriers:
      - quotient of integer fraction pairs
    data:
      - field operations
      - usual total order
    axioms:
      - ordered-field laws
    induces:
      - countable dense linear order without endpoints
    notes: The map $z\mapsto[(z,1)]$ canonically embeds $\mathbb Z$ into $\mathbb Q$.
    citations:
      - wp-rational-number
      - nlab-rational-number
  - id: integral_domain
    label: Integral domain
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
      - algebraic-geometry
    level: 9
    kind: structure
    summary: A nonzero commutative ring with no zero divisors.
    carriers:
      - set $R$
    data:
      - commutative ring structure
    axioms:
      - $1\ne 0$
      - $ab=0$ implies $a=0$ or $b=0$
    induces: []
    notes: ''
    citations:
      - wp-integral-domain
      - nlab-integral-domain
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: dedekind_domain
    label: Dedekind domain
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
    level: 10
    kind: structure
    summary: A Noetherian, integrally closed integral domain of Krull dimension one.
    carriers:
      - integral domain $R$
    data:
      - ideal structure
    axioms:
      - Noetherian
      - integrally closed
      - dimension one
    induces: []
    notes: This atlas uses the dimension-one convention, excluding fields; some references allow dimension at most one and hence include fields.
    citations:
      - wp-dedekind-domain
      - nlab-dedekind-domain
      - stacks-dedekind
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: gcd_domain
    label: GCD domain
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
    level: 10
    kind: structure
    summary: An integral domain in which any two nonzero elements have a greatest common divisor.
    carriers:
      - integral domain $R$
    data:
      - divisibility relation
    axioms:
      - greatest common divisors exist up to units
    induces: []
    notes: ''
    citations:
      - wp-gcd-domain
      - nlab-gcd-domain
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: valuation_ring
    label: Valuation ring
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebraic-geometry
      - algebra
    level: 10
    kind: structure
    summary: An integral domain whose ideals are totally ordered by inclusion, equivalently a valuation subring of its fraction field.
    carriers:
      - integral domain $V$
    data: []
    axioms:
      - for every fraction $x$, either $x$ or $x^{-1}$ lies in $V$
    induces:
      - local ring
    notes: ''
    citations:
      - stacks-valuation-ring
      - wp-valuation-ring
      - nlab-valuation-ring
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: finite_field
    label: Finite field
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
    level: 11
    kind: structure
    summary: A field with finitely many elements.
    carriers:
      - finite set $F$
    data:
      - field operations
    axioms:
      - finite carrier
    induces: []
    notes: ''
    citations:
      - wp-finite-field
      - nlab-finite-field
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: number_field
    label: Number field
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
    level: 11
    kind: structure
    summary: A finite field extension of the rational numbers.
    carriers:
      - field $K$
    data:
      - embedding of $\mathbb Q$ into $K$
    axioms:
      - $K$ is finite-dimensional as a vector space over $\mathbb Q$
    induces: []
    notes: ''
    citations:
      - wp-number-field
      - nlab-number-field
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: unique_factorization_domain
    label: Unique factorization domain
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
    level: 11
    kind: structure
    summary: An integral domain in which nonzero nonunits factor uniquely into irreducibles up to units and order.
    carriers:
      - integral domain $R$
    data:
      - multiplication and divisibility
    axioms:
      - existence and uniqueness of irreducible factorization
    induces: []
    notes: ''
    citations:
      - wp-ufd
      - nlab-unique-factorization-domain
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: valued_field
    label: Valued field
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
      - topology
    level: 11
    kind: structure
    summary: A field equipped with a Krull valuation or an absolute value.
    carriers:
      - field $K$
    data:
      - valuation into an ordered value group or absolute value
    axioms:
      - multiplicativity and ultrametric/triangle inequality in the chosen formulation
    induces:
      - a topology and uniformity
    notes: A general Krull valuation takes values in an ordered abelian group and canonically induces a topology/uniformity. A real-valued metric is available for absolute values and rank-one valuations, not for every value group without additional choices.
    citations:
      - wp-valued-field
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: global_field
    label: Global field
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebraic-geometry
    level: 12
    kind: structure
    summary: A finite extension of $\mathbb Q$, or a finite extension of the one-variable rational function field $\mathbb F_q(t)$.
    carriers:
      - field $K$
    data: []
    axioms:
      - number field or global function field
    induces: []
    notes: ''
    citations:
      - wp-global-field
      - nlab-global-field
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: principal_ideal_domain
    label: Principal ideal domain
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
    level: 12
    kind: structure
    summary: An integral domain in which every ideal is generated by one element.
    carriers:
      - integral domain $R$
    data:
      - ideal structure inherited from $R$
    axioms:
      - every ideal is principal
    induces: []
    notes: ''
    citations:
      - wp-pid
      - nlab-principal-ideal-domain
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: real_closed_field
    label: Real closed field
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
      - logic
      - order
    level: 13
    kind: structure
    summary: An ordered field with no proper algebraic ordered extension, equivalently whose algebraic closure is obtained by adjoining $\sqrt{-1}$.
    carriers:
      - ordered field $R$
    data: []
    axioms:
      - positive elements are squares
      - odd-degree polynomials have roots
    induces: []
    notes: 'A real-closed field has a unique compatible ordering: its positive elements are exactly the nonzero squares.'
    citations:
      - wp-real-closed
      - nlab-real-closed
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: ring_of_integers
    label: Ring of integers
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
    level: 12
    kind: structure
    summary: The integral closure of $\mathbb{Z}$ inside a number field.
    carriers:
      - subset $\mathcal O_K$ of a number field $K$
    data:
      - inherited addition and multiplication
    axioms:
      - elements satisfy a monic polynomial over $\mathbb{Z}$
    induces:
      - Dedekind-domain structure
    notes: For a number field $K$, $\mathcal O_K$ is the integral closure of $\mathbb Z$ in $K$ and is a Dedekind domain.
    citations:
      - wp-ring-integers
      - nlab-dedekind-domain
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: complete_valued_field
    label: Complete valued field
    primaryDomain: number-theory
    domains:
      - number-theory
      - analysis
      - topology
    level: 13
    kind: structure
    summary: A field complete for the uniformity induced by its valuation; in the absolute-value/rank-one case, complete for the associated metric.
    carriers:
      - valued field $K$
    data: []
    axioms:
      - Cauchy completeness for the valuation uniformity
    induces: []
    notes: The metric wording is restricted to absolute values or rank-one valuations. General valued fields are naturally uniform spaces.
    citations:
      - wp-complete-valued
      - nlab-complete-field
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: discrete_valuation_ring
    label: Discrete valuation ring
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
    level: 13
    kind: structure
    summary: A nonfield local principal ideal domain, equivalently a Noetherian local domain of Krull dimension one whose maximal ideal is principal.
    carriers:
      - integral domain $R$
    data: []
    axioms:
      - local PID
      - not a field
      - unique nonzero prime ideal (the maximal ideal)
    induces:
      - a normalized discrete valuation on its fraction field
    notes: The explicit nonfield condition avoids collapsing the notion to a field under conventions that allow fields as PIDs.
    citations:
      - wp-dvr
      - nlab-discrete-valuation-ring
      - stacks-dvr-regular
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: euclidean_domain
    label: Euclidean domain
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
    level: 13
    kind: structure
    summary: An integral domain that admits a Euclidean function supporting division with strictly smaller remainder.
    carriers:
      - integral domain $R$
    data: []
    axioms:
      - there exists a Euclidean function on nonzero elements satisfying the division-with-remainder condition
    induces: []
    notes: The Euclidean function is treated as an existence property, not as chosen structure; not every principal ideal domain is Euclidean.
    citations:
      - wp-euclidean-domain
      - nlab-euclidean-domain
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: local_field
    label: Local field
    primaryDomain: number-theory
    domains:
      - number-theory
      - topology
      - algebra
      - analysis
    level: 13
    kind: structure
    summary: A nondiscrete locally compact Hausdorff topological field.
    carriers:
      - field $K$
    data:
      - field operations
      - topology
    axioms:
      - continuous operations
      - locally compact
      - Hausdorff
      - nondiscrete
    induces: []
    notes: Under this broad definition, $\mathbb{R}$ and $\mathbb{C}$ are archimedean local fields. “Non-archimedean local field” excludes them and is often the intended arithmetic convention.
    citations:
      - wp-local-field
      - nlab-local-field
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: p_adic_field
    label: $p$-adic field
    primaryDomain: number-theory
    domains:
      - number-theory
      - analysis
      - topology
    level: 14
    kind: structure
    summary: A finite extension of the $p$-adic numbers $\mathbb Q_p$.
    carriers:
      - complete valued field $K$
    data: []
    axioms:
      - finite extension of $\mathbb Q_p$
    induces: []
    notes: ''
    citations:
      - wp-p-adic-field
      - nlab-p-adic-field
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: valuation
    label: Valuation
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
    level: 10
    kind: structure
    summary: A map $v$ from a field or integral domain to an ordered abelian group with $\infty$ satisfying $v(xy)=v(x)+v(y)$ and $v(x+y)\ge\min(v(x),v(y))$.
    carriers:
      - field or integral domain
    data:
      - ordered value group
      - valuation map
    axioms:
      - $v(0)=\infty$
      - $v(xy)=v(x)+v(y)$
      - $v(x+y)\ge\min(v(x),v(y))$
    induces:
      - A valuation ring and topology
    notes: Equivalent multiplicative conventions use a non-Archimedean absolute value; Archimedean absolute values are treated separately when discussing places of number fields.
    citations:
      - wp-valuation
      - nlab-valuation
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: completion_at_valuation
    label: Completion at a valuation
    primaryDomain: number-theory
    domains:
      - number-theory
      - analysis
      - topology
    level: 12
    kind: structure
    summary: The complete valued field obtained by completing a field in the metric or uniformity induced by a valuation or absolute value.
    carriers:
      - valued field
    data:
      - Cauchy-equivalence classes
    axioms:
      - completeness
    induces:
      - A local field in the locally compact cases
    notes: ''
    citations:
      - wp-completion-at-valuation
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: residue_field
    label: Residue field
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebraic-geometry
      - algebra
    level: 11
    kind: structure
    summary: For a local ring $(R,\mathfrak m)$, the quotient field $R/\mathfrak m$.
    carriers:
      - local ring $(R,\mathfrak m)$
    data:
      - quotient $R/\mathfrak m$
    axioms: []
    induces:
      - Reduction modulo the maximal ideal
    notes: ''
    citations:
      - wp-residue-field
      - nlab-residue-field
      - stacks-algebra-text
    primaryField: mathematics
    fields:
      - mathematics
  - id: place_of_number_field
    label: Place of a number field
    primaryDomain: number-theory
    domains:
      - number-theory
    level: 12
    kind: structure
    summary: An equivalence class of absolute values on a number field, including Archimedean places and non-Archimedean places associated with prime ideals.
    carriers:
      - number field $K$
    data:
      - equivalence class of absolute values
    axioms: []
    induces:
      - A completion $K_v$
    notes: ''
    citations:
      - wp-place-of-number-field
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: local_point
    label: Local point
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebraic-geometry
    level: 16
    kind: structure
    summary: For a variety $X$ over a global field $K$ and a place $v$, a local point is a $K_v$-rational point of the base change $X_{K_v}$.
    carriers:
      - variety over a global field
      - place $v$
    data:
      - $K_v$-valued point
    axioms: []
    induces:
      - A local solvability condition
    notes: ''
    citations:
      - wp-local-point
      - milne-algebraic-number-theory
      - poonen-rational-points-varieties
    primaryField: mathematics
    fields:
      - mathematics
  - id: adele_ring
    label: Adele ring
    primaryDomain: number-theory
    domains:
      - number-theory
      - topology
      - analysis
    level: 15
    kind: structure
    summary: The restricted product of all completions of a global field with respect to their valuation rings at almost all non-Archimedean places.
    carriers:
      - global field and its places
    data:
      - restricted product of local fields
    axioms: []
    induces:
      - A single topological ring encoding all places
    notes: ''
    citations:
      - wp-adele-ring
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: everywhere_locally_soluble_variety
    label: Everywhere locally soluble variety
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebraic-geometry
    level: 16
    kind: structure
    summary: A variety $X$ over a global field $K$ such that $X(K_v)$ is nonempty for every place $v$ of $K$.
    carriers:
      - variety over a global field
    data:
      - a local point over every completion
    axioms:
      - $X(K_v)\ne\varnothing$ for every place $v$
    induces:
      - The local-solubility premise in a Hasse-principle question
    notes: Everywhere local solubility does not in general imply a global rational point.
    citations:
      - wp-local-point
      - poonen-rational-points-varieties
      - milne-algebraic-number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: local_global_principle
    label: Local–global principle
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebraic-geometry
    level: 16
    kind: structure
    summary: A principle asserting, for a specified class of arithmetic objects, that a global solution exists exactly when solutions exist over every completion of the global field.
    carriers:
      - global field
      - family of local completions
    data:
      - local solvability data
    axioms: []
    induces:
      - A global solvability criterion
    notes: 'This is a pattern, not a universal theorem: it holds for some classes and fails for others.'
    citations:
      - wp-local-global-principle
      - nlab-local-global-principle
      - milne-algebraic-number-theory
      - poonen-rational-points-varieties
    primaryField: mathematics
    fields:
      - mathematics
  - id: hasse_minkowski_theorem
    label: Hasse–Minkowski theorem
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
    level: 17
    kind: structure
    summary: A quadratic form over a number field represents zero nontrivially exactly when it does so over every completion of the field.
    carriers:
      - quadratic form over a number field
    data:
      - local isotropy conditions
    axioms: []
    induces:
      - A valid local–global principle for quadratic forms
    notes: ''
    citations:
      - wp-hasse-minkowski-theorem
      - milne-algebraic-number-theory
      - poonen-rational-points-varieties
    primaryField: mathematics
    fields:
      - mathematics
  - id: failure_hasse_principle
    label: Variety violating the Hasse principle
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebraic-geometry
    level: 17
    kind: structure
    summary: A variety over a global field that has a point over every completion but has no rational point over the global field.
    carriers:
      - variety over a global field
    data:
      - points over all completions
    axioms:
      - absence of a global rational point
    induces:
      - An obstruction to naive local–global inference
    notes: ''
    citations:
      - wp-local-point
      - milne-algebraic-number-theory
      - poonen-rational-points-varieties
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_local_point
    label: variety + completion + chosen local solution
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebraic-geometry
    level: 15
    kind: junction
    summary: Compatibility construction producing a local point.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: The variety must be defined over the global field whose place supplies the completion.
    citations:
      - wp-local-point
      - milne-algebraic-number-theory
      - stacks-schemes-text
    combination:
      inputs:
        - algebraic_variety
        - completion_at_valuation
      compatibility: Base-change the variety $X/K$ to the completion $K_v$ and choose a $K_v$-valued point of $X_{K_v}$.
      output: local_point
    primaryField: mathematics
    fields:
      - mathematics
  - id: successor_structure
    label: Successor structure
    primaryDomain: number-theory
    domains:
      - logic
      - number-theory
    level: 2
    kind: structure
    summary: A set equipped with a distinguished zero and a unary successor operation.
    carriers:
      - set $N$
    data:
      - distinguished element $0$
      - 'successor map $S: N\to N$'
    axioms: []
    induces: []
    notes: The second-order Peano axioms are categorical under full second-order semantics. First-order Peano arithmetic is not categorical by the compactness and Löwenheim–Skolem theorems.
    citations:
      - wp-peano
      - openlogic-set-theory
    primaryField: mathematics
    fields:
      - mathematics
    conceptType: Foundational structure
  - id: prime_ideal
    label: Prime ideal
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: number-theory
    domains:
      - number-theory
      - algebra
      - algebraic-geometry
    level: 10
    kind: structure
    conceptType: Prime ring ideal
    summary: A proper ideal $P$ of a commutative ring such that $ab\in P$ implies $a\in P$ or $b\in P$; equivalently, the quotient $R/P$ is an integral domain.
    citations:
      - milne-algebraic-number-theory
      - stacks-algebra-text
edges:
  - id: number_prime_ideal_to_prime_spectrum
    source: prime_ideal
    target: prime_spectrum
    type: canonical-construction
    label: supply points of $\operatorname{Spec}(R)$
    detail: The prime spectrum of a commutative ring is formed from its prime ideals, equipped with the Zariski topology and its canonical structure sheaf.
