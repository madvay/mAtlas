    target: model_of_theory
    type: combine-compatible
    label: apply Gödel completeness
    detail: Gödel’s completeness theorem guarantees a model for the consistent first-order theory represented by the junction.
    citations:
      - wp-godel-completeness-theorem
      - nlab-completeness-theorem
      - openlogic-model-theory
  - id: completeness_theorem_to_compactness
    source: first_order_completeness_theorem
    target: compactness_theorem
    type: theorem-implication
    label: finite proofs yield compactness
    detail: If an unsatisfiable theory entailed a contradiction, completeness would give a finite formal proof using only finitely many premises; contraposition yields compactness.
    citations:
      - wp-compactness-theorem
      - nlab-compactness-theorem
      - openlogic-model-theory
