nodes:
  - id: first_order_signature
    label: First-order signature
    primaryDomain: logic
    domains:
      - logic
      - universal-algebra
    level: 1
    kind: structure
    summary: A vocabulary of function, relation, and constant symbols together with their arities.
    carriers:
      - sets of symbols
    data:
      - arity assignments
    axioms: []
    induces: []
    notes: ''
    citations:
      - wp-signature-logic
      - openlogic-model-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: first_order_theory
    label: First-order theory
    primaryDomain: logic
    domains:
      - logic
    level: 2
    kind: structure
    summary: A set of first-order sentences in a fixed signature.
    carriers:
      - first-order signature $L$
    data:
      - set $T$ of $L$-sentences
    axioms: []
    induces:
      - class of models $\operatorname{Mod}(T)$
    notes: A theory need not be deductively closed unless that convention is stated explicitly.
    citations:
      - wp-model-theory
      - nlab-first-order-theory
      - openlogic-model-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: modal_kripke_model
    label: Modal Kripke model
    primaryDomain: logic
    domains:
      - logic
      - order
    level: 2
    kind: structure
    summary: A binary-relation frame together with a valuation of propositional variables at worlds.
    carriers:
      - set of worlds $W$
    data:
      - accessibility relation $R$
      - valuation $V$
    axioms: []
    induces: []
    notes: The recursive forcing clauses define the semantics; they are not an additional frame axiom. Frame conditions such as reflexivity or transitivity correspond to particular modal logics.
    citations:
      - wp-kripke-semantics
      - openlogic-model-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_first_order_structure
    label: signature + carrier
    primaryDomain: logic
    domains:
      - logic
      - algebra
    level: 2
    kind: junction
    summary: Interpret a first-order signature on a nonempty carrier set.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'Construction junction: it is a visual device, not a separate standard mathematical structure.'
    citations:
      - wp-structure-logic
      - openlogic-model-theory
    combination:
      inputs:
        - first_order_signature
        - set
      compatibility: Each symbol is assigned an operation, relation, or distinguished element of the specified arity on the carrier.
      output: first_order_structure
    primaryField: mathematics
    fields:
      - mathematics
  - id: first_order_structure
    label: First-order structure
    primaryDomain: logic
    domains:
      - logic
      - algebra
      - universal-algebra
    level: 3
    kind: structure
    summary: A nonempty carrier together with interpretations of every symbol in a first-order signature.
    carriers:
      - nonempty set $M$
    data:
      - interpretations of constants, functions, and relations
    axioms:
      - arities match the signature
    induces: []
    notes: The signature and carrier are separate inputs; interpretations are additional data on that pair.
    citations:
      - wp-structure-logic
      - openlogic-model-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: intuitionistic_kripke_model
    label: Propositional intuitionistic Kripke model
    primaryDomain: logic
    domains:
      - logic
      - order
    level: 3
    kind: structure
    summary: A preorder of information states with a persistent valuation of propositional atoms.
    carriers:
      - preordered set $W$
    data:
      - monotone valuation of atomic propositions
    axioms:
      - truth persists upward along the preorder
    induces: []
    notes: The displayed data define the propositional semantics. First-order intuitionistic Kripke models additionally require domains and interpretations varying monotonically with worlds.
    citations:
      - wp-kripke-semantics
      - openlogic-model-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_model_of_theory
    label: theory + structure satisfying it
    primaryDomain: logic
    domains:
      - logic
    level: 4
    kind: junction
    summary: Combine a first-order theory with a structure in the same signature and impose satisfaction.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: All incoming branches are jointly required.
    citations:
      - wp-model-theory
      - openlogic-model-theory
    combination:
      inputs:
        - first_order_theory
        - first_order_structure
      compatibility: The theory and structure use the same signature $L$, and the structure satisfies every sentence in $T$.
      output: model_of_theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: model_of_theory
    label: Model of a theory
    primaryDomain: logic
    domains:
      - logic
    level: 7
    kind: structure
    summary: A first-order structure satisfying every sentence of a specified theory.
    carriers:
      - first-order theory $T$ in signature $L$
      - $L$-structure $M$
    data: []
    axioms:
      - $M$ satisfies every sentence of $T$
    induces: []
    notes: The theory and structure are independent inputs that must use the same signature.
    citations:
      - wp-model-theory
      - nlab-model-of-theory
      - openlogic-model-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: modal_algebra
    label: Normal modal algebra
    primaryDomain: logic
    domains:
      - logic
      - order
      - algebra
    level: 11
    kind: structure
    summary: A Boolean algebra with a normal modal necessity operator.
    carriers:
      - Boolean algebra $B$
    data:
      - unary modal operator $\square$
    axioms:
      - $\square 1=1$
      - $\square (a\wedge b)=\square a\wedge \square b$
    induces: []
    notes: Equivalently, the dual possibility operator preserves 0 and finite joins. Additional modal logics impose further equations.
    citations:
      - wp-modal-algebra
      - openlogic-model-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: formal_proof_system
    label: Formal proof system
    primaryDomain: logic
    domains:
      - logic
      - computability-theory
    level: 4
    kind: structure
    summary: A finitary, syntactically specified collection of formulas, axioms, and inference rules defining formal derivability.
    carriers:
      - formal language
    data:
      - axioms
      - inference rules
    axioms:
      - proofs are finite; in the effective systems used for computability and incompleteness, proof checking is mechanical
    induces:
      - A theorem set
    notes: ''
    citations:
      - wp-formal-proof-system
      - openlogic-incompleteness
    primaryField: mathematics
    fields:
      - mathematics
  - id: consistent_theory
    label: Consistent formal theory
    primaryDomain: logic
    domains:
      - logic
      - computability-theory
    level: 5
    kind: structure
    summary: A formal theory that does not derive a contradiction.
    carriers:
      - formal theory
    data: []
    axioms:
      - no sentence and its negation are both derivable
    induces:
      - Nontrivial deductive consequence
    notes: ''
    citations:
      - wp-consistent-theory
      - openlogic-incompleteness
    primaryField: mathematics
    fields:
      - mathematics
  - id: syntactically_complete_theory
    label: Syntactically complete formal theory
    primaryDomain: logic
    domains:
      - logic
      - computability-theory
    level: 5
    kind: structure
    summary: A formal theory that proves either each sentence or its negation.
    carriers:
      - formal theory
    data: []
    axioms:
      - for every sentence $\varphi$, either $T\vdash\varphi$ or $T\vdash\neg\varphi$
    induces:
      - No undecided sentence in the language
    notes: ''
    citations:
      - wp-syntactically-complete-theory
      - openlogic-incompleteness
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_first_incompleteness
    label: consistent effective theory + arithmetic coding
    primaryDomain: logic
    domains:
      - logic
      - computability-theory
      - number-theory
    level: 9
    kind: junction
    summary: Compatibility construction collecting the hypotheses of Gödel’s first incompleteness theorem.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: Consistency, effective axiomatization, sufficient arithmetic strength, and arithmetized syntax must concern the same theory.
    citations:
      - wp-j-first-incompleteness
      - openlogic-incompleteness
      - godel-incompleteness-paper
    combination:
      inputs:
        - formal_proof_system
        - consistent_theory
        - natural_numbers
        - godel_numbering
      compatibility: Use one effectively axiomatized consistent formal theory that represents enough elementary arithmetic on the natural numbers and supports the chosen Gödel coding.
      output: first_incompleteness_theorem
    primaryField: mathematics
    fields:
      - mathematics
  - id: first_incompleteness_theorem
    label: Gödel’s first incompleteness theorem
    primaryDomain: logic
    domains:
      - logic
      - computability-theory
    level: 10
    kind: structure
    summary: Every consistent, effectively axiomatized formal theory strong enough to represent elementary arithmetic is syntactically incomplete.
    carriers:
      - effective formal theory containing sufficient arithmetic
    data: []
    axioms:
      - consistency or suitable soundness hypotheses, depending on formulation
    induces:
      - An undecidable sentence for the theory
    notes: ''
    citations:
      - wp-j-first-incompleteness
      - godel-incompleteness-paper
      - openlogic-incompleteness
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_second_incompleteness
    label: consistent effective theory + internal provability
    primaryDomain: logic
    domains:
      - logic
      - computability-theory
      - number-theory
    level: 9
    kind: junction
    summary: Compatibility construction collecting the hypotheses of Gödel’s second incompleteness theorem.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: The consistency statement and provability predicate must be the standard internal formalizations for the same sufficiently strong theory.
    citations:
      - wp-j-first-incompleteness
      - openlogic-incompleteness
      - godel-incompleteness-paper
    combination:
      inputs:
        - formal_proof_system
        - consistent_theory
        - natural_numbers
        - godel_numbering
      compatibility: Use one consistent effectively axiomatized theory strong enough for the standard arithmetization and derivability conditions, with its own proof predicate and consistency sentence.
      output: second_incompleteness_theorem
    primaryField: mathematics
    fields:
      - mathematics
  - id: second_incompleteness_theorem
    label: Gödel’s second incompleteness theorem
    primaryDomain: logic
    domains:
      - logic
      - computability-theory
    level: 10
    kind: structure
    summary: A consistent, effectively axiomatized theory strong enough for the incompleteness machinery cannot prove its own suitably formalized consistency.
    carriers:
      - effective sufficiently strong formal theory
    data: []
    axioms:
      - standard derivability conditions
    induces:
      - Unprovability of the internal consistency statement
    notes: ''
    citations:
      - wp-j-first-incompleteness
      - godel-incompleteness-paper
      - openlogic-incompleteness
    primaryField: mathematics
    fields:
      - mathematics
  - id: hilbert_program
    label: Hilbert’s program
    primaryDomain: logic
    domains:
      - logic
      - computability-theory
    level: 3
    kind: structure
    summary: The program of formalizing broad parts of mathematics and proving their consistency by secure finitary methods.
    carriers:
      - formalized mathematics
    data:
      - finitary metamathematical methods
    axioms: []
    induces:
      - Consistency and completeness goals
    notes: The incompleteness theorems constrain the original program; they do not eliminate formal axiomatic or proof-theoretic research.
    citations:
      - wp-hilbert-program
      - nlab-hilbert-program
      - openlogic-incompleteness
    primaryField: mathematics
    fields:
      - mathematics
  - id: semantic_consequence
    label: Semantic consequence
    primaryDomain: logic
    domains:
      - logic
    level: 4
    kind: structure
    conceptType: Semantic relation
    summary: A sentence $\varphi$ is a semantic consequence of a theory $T$ when every structure satisfying $T$ also satisfies $\varphi$.
    carriers:
      - first-order language
      - theory $T$ and sentence $\varphi$
    data:
      - satisfaction relation over structures
    axioms:
      - $T\models\varphi$ iff every model of $T$ is a model of $\varphi$
    induces:
      - semantic closure of a theory
    notes: Semantic consequence is distinct from syntactic derivability until a soundness or completeness theorem relates them for a specified proof calculus.
    citations:
      - wp-logical-consequence
      - nlab-sequent
      - openlogic-model-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: first_order_completeness_theorem
    label: Gödel completeness theorem
    primaryDomain: logic
    domains:
      - logic
    level: 6
    kind: structure
    conceptType: Metatheorem
    summary: For standard first-order logic, every semantically valid consequence is derivable in a sound and complete proof calculus.
    carriers:
      - first-order theory $T$
      - sentence $\varphi$
    data: []
    axioms:
      - standard first-order semantics and a specified complete proof calculus
    induces:
      - $T\models\varphi$ iff $T\vdash\varphi$
      - every syntactically consistent first-order theory has a model
    notes: This is Gödel’s completeness theorem for first-order logic, not either of Gödel’s incompleteness theorems and not semantic completeness of a particular theory.
    citations:
      - wp-godel-completeness-theorem
      - nlab-completeness-theorem
      - openlogic-model-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: compactness_theorem
    label: Compactness theorem
    primaryDomain: logic
    domains:
      - logic
    level: 7
    kind: structure
    conceptType: Metatheorem
    summary: A set of first-order sentences has a model whenever every finite subset has a model.
    carriers:
      - set $T$ of first-order sentences
    data: []
    axioms:
      - every finite subset of $T$ is satisfiable
    induces:
      - satisfiability of $T$
    notes: The statement is specific to first-order compactness; stronger logics can fail compactness.
    citations:
      - wp-compactness-theorem
      - nlab-compactness-theorem
      - openlogic-model-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_consistent_first_order_theory
    label: consistent first-order theory
    primaryDomain: logic
    domains:
      - logic
    level: 6
    kind: junction
    summary: Identify a first-order theory with a syntactically consistent formal proof system so that Gödel’s completeness theorem applies.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: Consistency and first-order syntax must refer to the same theory and to a sound standard proof calculus.
    citations:
      - wp-godel-completeness-theorem
      - nlab-completeness-theorem
      - openlogic-model-theory
    combination:
      inputs:
        - first_order_theory
        - consistent_theory
      compatibility: Use one first-order theory with its specified proof calculus and require that no contradiction is derivable.
      output: model_of_theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: satisfaction_relation
    label: Satisfaction relation
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: logic
    domains:
      - logic
    level: 4
    kind: structure
    conceptType: Semantic relation
    summary: The relation $M\models\varphi$ stating that a structure $M$ makes a formula or sentence $\varphi$ true under a specified variable assignment when one is needed.
    citations:
      - openlogic-model-theory
edges:
  - id: logic_structure_to_satisfaction_relation
    source: first_order_structure
    target: satisfaction_relation
    type: add-data
    label: interpret a formula
    detail: The recursively defined satisfaction relation evaluates terms and formulas in a first-order structure after an interpretation of the nonlogical symbols and, for open formulas, a variable assignment are fixed.
    citations:
      - openlogic-model-theory
  - id: logic_satisfaction_relation_to_semantic_consequence
    source: satisfaction_relation
    target: semantic_consequence
    type: theory-component
    label: supplies model-by-model truth
    detail: 'Semantic consequence is defined by universal satisfaction: $\Gamma\models\varphi$ when every structure satisfying all sentences in $\Gamma$ also satisfies $\varphi$.'
    citations:
      - openlogic-model-theory
