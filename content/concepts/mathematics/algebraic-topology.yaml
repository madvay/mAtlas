  - id: topological_pair
    label: Topological pair
    primaryDomain: algebraic-topology
    domains:
      - algebraic-topology
      - topology
    level: 3
    kind: structure
    summary: A topological space $X$ with a specified subspace $A\subseteq X$.
    carriers:
      - topological space $X$
    data:
      - distinguished subspace $A$
    axioms: []
    induces: []
    notes: ''
    citations:
      - wp-topological-pair
      - hatcher-algebraic-topology
