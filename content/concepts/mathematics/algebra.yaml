      - differential-geometry
    level: 16
    kind: structure
    conceptType: Associative algebra
    summary: An associative algebra generated by a quadratic space with $v^2=Q(v)1$.
    citations:
      - wp-clifford_algebra
      - nlab-clifford_algebra
    carriers:
