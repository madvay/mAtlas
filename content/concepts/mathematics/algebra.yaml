  - id: semiring
    label: Semiring
    level: 6
    kind: structure
    summary: A ring-like structure without requiring additive inverses.
    carriers:
      - set $R$
    data:
      - addition +
      - multiplication $\cdot$
      - '0'
      - '1'
    axioms:
      - $(R,+,0)$ is a commutative monoid
      - $(R,\cdot,1)$ monoid
      - distributivity
      - 0 absorbing
    induces: []
    notes: 'Convention: semirings here are unital and have an absorbing zero. Some literature drops one or both requirements.'
    citations:
      - wp-semiring
      - nlab-semiring
      - stacks-algebra-text
    primaryDomain: algebra
    domains:
