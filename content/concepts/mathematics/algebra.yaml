    kind: structure
    conceptType: Bilinear structure
    summary: A vector space with a nondegenerate alternating bilinear form.
    citations:
      - wp-symplectic_vector_space
      - nlab-symplectic_vector_space
    carriers:
      - vector space $V$
    data:
      - bilinear form $\omega:V\times V\to F$
    axioms:
      - $\omega$ is alternating
      - $\omega$ is nondegenerate
    induces:
      - canonical identification $V\to V^*$ via $v\mapsto\omega(v,-)$
    notes: Finite-dimensional symplectic vector spaces have even dimension.
