    level: 17
    kind: structure
    conceptType: Clifford representation
    summary: Matrices or endomorphisms satisfying the Clifford relation $\{\gamma^\mu,\gamma^\nu\}=2g^{\mu\nu}I$, used to realize spinor representations.
    citations:
      - wp-gamma_matrices
      - nlab-clifford_algebra
      - tong-qft
    carriers:
      - spinor vector space $S$
    data:
      - endomorphisms $\gamma^\mu$ of $S$
      - metric coefficients $g^{\mu\nu}$
    axioms:
      - $\gamma^\mu\gamma^\nu+\gamma^\nu\gamma^\mu=2g^{\mu\nu}I$
    induces:
      - representation of the relevant Clifford algebra
      - Dirac operator after coupling to derivatives
    notes: Matrix size, reality conditions, and sign conventions depend on dimension, signature, and representation.
