    notes: For infinite-dimensional topological vector spaces, the continuous dual depends on the topology and can differ from the algebraic dual.
  - id: lie_algebra
    label: Lie algebra
    primaryDomain: algebra
    domains:
      - algebra
      - differential-geometry
      - representation-theory
    level: 13
    kind: structure
    summary: A vector space with an alternating bilinear bracket satisfying the Jacobi identity.
    carriers:
      - vector space $\mathfrak{g}$
    data:
      - bilinear bracket $[-,-]$
    axioms:
      - 'alternating bracket: $[x,x]=0$ for every $x$'
      - Jacobi identity
    induces: []
    notes: The alternating axiom implies antisymmetry over every field. The converse needs characteristic different from 2, so antisymmetry is not used as an unrestricted substitute.
    citations:
      - wp-lie-algebra
      - nlab-lie-algebra
      - sage-lie-algebra
    primaryField: mathematics
    fields:
      - mathematics
