  - id: affine_space
    label: Affine space
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: algebra
    domains:
      - algebra
    level: 13
    kind: structure
    conceptType: Geometric algebraic structure
    summary: A set with a free transitive action of a vector space, retaining displacement vectors without a preferred origin.
    citations:
      - wp-affine_space
      - nlab-affine_space
      - tong-relativity
    carriers:
      - set $A$
      - translation vector space $V$
    data:
      - free transitive action $A\times V\to A$
    axioms:
      - for every $a,b\in A$ there is a unique $v\in V$ with $a+v=b$
    induces:
      - difference vectors $b-a$
      - translations
    notes: No origin is distinguished; choosing one identifies $A$ noncanonically with $V$.
