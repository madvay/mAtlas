    induces:
      - multilinear constructions
      - tensor products of linear maps
    notes: The construction is canonical up to unique isomorphism, not equality of a particular concrete realization.
  - id: coalgebra
    label: Coalgebra
    primaryDomain: algebra
    domains:
      - algebra
      - category-theory
    level: 15
    kind: structure
    summary: Over a fixed commutative base ring $k$, a $k$-module with coassociative comultiplication and counit.
    carriers:
      - commutative base ring $k$
      - $k$-module $C$
    data:
      - $k$-linear comultiplication $C\to C\otimes _{k}C$
      - $k$-linear counit $C\to k$
    axioms:
      - coassociativity
      - counit laws
    induces: []
    notes: ''
    citations:
      - wp-coalgebra
      - nlab-coalgebra
      - stacks-algebra-text
    primaryField: mathematics
    fields:
      - mathematics
  - id: exterior_algebra
    label: Exterior algebra
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: algebra
    domains:
      - algebra
      - differential-geometry
    level: 15
    kind: structure
    conceptType: Graded algebra
    summary: The graded algebra $\Lambda V$ generated by a vector space $V$ subject to the alternating relations $v\wedge v=0$.
    citations:
      - wp-exterior_algebra
      - nlab-exterior_algebra
    carriers:
      - vector space $V$
    data:
      - graded algebra $\Lambda V$
      - canonical map $V\to\Lambda^1V$
    axioms:
      - $v\wedge v=0$ for every $v$
      - universal property for alternating algebra maps
    induces:
      - exterior powers $\Lambda^kV$
      - wedge product
    notes: In characteristic not equal to 2, the alternating relation implies graded anticommutativity for degree-one generators; the alternating formulation is characteristic-independent.
  - id: unital_associative_algebra
    label: Unital associative algebra
    primaryDomain: algebra
    domains:
      - algebra
      - universal-algebra
    level: 16
    kind: structure
    summary: An associative algebra with a multiplicative identity compatible with the base scalar action.
    carriers:
      - associative algebra $A$
    data:
      - unit 1
    axioms:
      - two-sided identity
    induces: []
    notes: A multiplicative identity, if it exists, is unique; unitality is an existence condition on the associative multiplication.
    citations:
      - wp-associative-algebra
      - nlab-associative-algebra
      - stacks-algebra-text
    primaryField: mathematics
    fields:
