  - id: star_algebra
    label: '*-algebra'
    primaryDomain: algebra
    domains:
      - algebra
      - analysis
    level: 16
    kind: structure
    summary: A complex associative algebra equipped with a conjugate-linear involutive anti-automorphism.
    carriers:
      - complex associative algebra $A$
    data:
      - map $a\mapsto a^*$
    axioms:
      - $(a+b)^*=a^*+b^*$
      - $(\lambda a)^*=\overline{\lambda}a^*$
      - $(ab)^*=b^*a^*$
      - $(a^*)^*=a$
    induces: []
    notes: The scalar involution here is complex conjugation.
    citations:
      - wp-star-algebra
      - nlab-star-algebra
      - mathlib-star-module
    primaryField: mathematics
    fields:
      - mathematics
