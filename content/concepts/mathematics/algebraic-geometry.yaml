  - id: story_local_ring_to_residue_field_quotient_construction
    source: local_ring
    target: residue_field
    type: quotient-construction
    label: quotient by the maximal ideal
    detail: For a local ring $(R,\mathfrak m)$, take representatives $r\in R$ and identify $r\sim s$ exactly when $r-s\in\mathfrak m$; the quotient $R/\mathfrak m$ is the residue field.
