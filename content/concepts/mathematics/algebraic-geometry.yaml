    kind: structure
    summary: A scheme whose structure morphism $X\to \operatorname{Spec}(\mathbb{Z})$ is separated.
    carriers:
      - scheme $X$
    data: []
    axioms:
      - relative diagonal $\Delta_{X/\operatorname{Spec}(\mathbb{Z})}\colon X\to X\times_{\operatorname{Spec}(\mathbb{Z})}X$ is a closed immersion
    induces: []
    notes: For an $S$-scheme $X\to S$, relative separatedness uses $\Delta_{X/S}\colon X\to X\times_S X$.
    citations:
