  - id: story_ring_localization_to_sheaf_stalk_representation_equivalence
    source: ring_localization
    target: sheaf_stalk
    type: representation-equivalence
    label: is canonically the corresponding affine stalk
    detail: For a prime $\mathfrak p\subset R$, the stalk of the structure sheaf on $\operatorname{Spec}(R)$ at $\mathfrak p$ is canonically isomorphic to the localization $R_{\mathfrak p}$.
