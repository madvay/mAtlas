    summary: A locally Noetherian scheme whose local rings are regular local rings.
    carriers:
      - scheme $X$
    data: []
    axioms:
      - locally Noetherian
      - every local ring $O_{X,x}$ is regular
    induces: []
    notes: Regularity is local Noetherianity plus regularity of every local ring. It does not imply quasi-compactness, so a regular scheme need not be a Noetherian scheme.
