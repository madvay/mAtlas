  - id: algebraic_space
    label: Algebraic space
    primaryDomain: algebraic-geometry
    domains:
      - algebraic-geometry
      - category-theory
    level: 12
    kind: structure
    summary: A sheaf of sets on the big fppf site over $S$ with representable diagonal and an étale surjective cover by a scheme.
    carriers:
      - base scheme $S$
      - presheaf $F\colon(\mathrm{Sch}/S)_{\mathrm{fppf}}^{\mathrm{op}}\to\mathbf{Set}$
    data: []
    axioms:
      - $F$ is a sheaf for the fppf topology
      - the diagonal $F\to F\times F$ is representable by schemes
      - there exists a scheme $U$ and a surjective étale morphism $h_U\to F$
    induces: []
    notes: The existence of an étale cover is a property; no atlas is selected as part of the algebraic-space structure. Equivalent étale-site formulations are standard.
    citations:
      - wp-algebraic-space
      - nlab-algebraic-space
      - stacks-algebraic-space
    primaryField: mathematics
    fields:
      - mathematics
