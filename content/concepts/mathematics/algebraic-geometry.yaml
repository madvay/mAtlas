  - id: smooth_projective_quadric
    label: Smooth projective quadric
    primaryDomain: algebraic-geometry
    domains:
      - algebraic-geometry
      - number-theory
      - algebra
    level: 15
    kind: structure
    summary: For a nondegenerate quadratic form $q$ of dimension at least three over a field of characteristic not two, the projective zero locus $q=0$ is a smooth projective quadric and a geometrically integral variety.
    carriers:
      - vector space over a field
      - nondegenerate quadratic form
    data:
      - projective hypersurface $q=0$
    axioms:
      - dimension at least three
      - characteristic not two
      - nondegeneracy
    induces:
      - A rational-point problem equivalent to isotropy of $q$
    notes: The dimension and nondegeneracy conditions avoid reducible or nonintegral low-dimensional zero loci. Over number fields the characteristic condition is automatic.
    citations:
      - wp-smooth-projective-quadric
      - poonen-rational-points-varieties
      - milne-algebraic-number-theory
      - stacks-varieties
    primaryField: mathematics
    fields:
      - mathematics
