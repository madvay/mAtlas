      - algebraic-geometry
      - topology
      - category-theory
    level: 7
    kind: structure
    summary: The filtered colimit of sections over neighborhoods of a point, identifying sections that agree on some smaller neighborhood.
    carriers:
      - sheaf $\mathcal F$ on a space
      - point $x$
    data:
      - germs of local sections at $x$
    axioms: []
    induces:
