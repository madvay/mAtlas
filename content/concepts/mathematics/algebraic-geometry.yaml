  - id: story_smooth_projective_quadric_to_hasse_minkowski_theorem_theorem_implication
    source: smooth_projective_quadric
    target: hasse_minkowski_theorem
    type: theorem-implication
    label: has a rational point exactly when it has all local points
    detail: Over a number field, the Hasse–Minkowski theorem says that a smooth projective quadric has a rational point if and only if it has a point over every completion; this is the geometric form of local–global isotropy for the defining quadratic form.
