  - id: story_sheaf_of_rings_to_sheaf_stalk_canonical_construction
    source: sheaf_of_rings
    target: sheaf_stalk
    type: canonical-construction
    label: take the ring of germs at a point
    detail: At each chosen point, the stalk of a sheaf of rings is canonically a ring obtained from germs of local sections.
