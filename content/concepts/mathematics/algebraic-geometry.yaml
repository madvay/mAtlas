  - id: algebraic_variety
    label: Algebraic variety
    primaryDomain: algebraic-geometry
    domains:
      - algebraic-geometry
    level: 14
    kind: structure
    summary: Under the adopted Stacks Project convention, an integral separated scheme of finite type over a field.
    carriers:
      - field $k$
      - scheme $X$ with structure morphism $X\to \operatorname{Spec}(k)$
    data:
      - $k$-scheme structure
    axioms:
      - $X$ is integral
      - $X\to \operatorname{Spec}(k)$ is separated
      - $X\to \operatorname{Spec}(k)$ is of finite type
    induces: []
    notes: Terminology varies across authors; this atlas fixes the Stacks Project convention rather than mixing reduced, irreducible, or nonseparated variants.
    citations:
