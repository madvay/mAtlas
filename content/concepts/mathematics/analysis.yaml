nodes:
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: dedekind_cut_reals
    label: Dedekind-cut real line
    primaryDomain: analysis
    domains:
      - analysis
      - order
      - set-theory
      - number-theory
    level: 14
    conceptType: Set-theoretic realization
    summary: The ordered field whose elements are proper downward-closed subsets of $\mathbb Q$ with no greatest element.
    carriers:
      - set of Dedekind cuts in $\mathbb Q$
    data:
      - order by inclusion
      - cut addition and multiplication
    axioms:
      - cut conditions
    induces:
      - Dedekind-complete ordered field
    notes: This realization emphasizes order completeness and is canonically isomorphic to the Cauchy-sequence realization.
    citations:
      - wp-construction-reals
      - nlab-real-number
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: rational_cauchy_sequences
    label: Cauchy sequences of rationals
    primaryDomain: analysis
    domains:
      - analysis
      - topology
      - set-theory
      - number-theory
    level: 14
    conceptType: Quotient presentation
    summary: Rational Cauchy sequences, with two sequences identified when their difference converges to zero.
    carriers:
      - set of Cauchy sequences in $\mathbb Q$
    data:
      - equivalence relation $(a_n)\sim(b_n)$ iff $a_n-b_n\to0$
    axioms: []
    induces:
      - metric completion of $\mathbb Q$
    notes: The definition of convergence here uses the rational absolute-value metric, not a prior construction of the real numbers.
    citations:
      - wp-construction-reals
      - nlab-real-number
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: real_numbers
    label: Real numbers $\mathbb R$
    primaryDomain: analysis
    domains:
      - analysis
      - order
      - algebra
      - topology
      - number-theory
    level: 15
    conceptType: Number system
    summary: The complete Archimedean ordered field, unique up to unique order-preserving field isomorphism.
    carriers:
      - set $\mathbb R$
    data:
      - field operations
      - total order
      - order topology and metric
    axioms:
      - ordered-field laws
      - least-upper-bound property
    induces:
      - real line and continuum
    notes: Dedekind cuts and Cauchy sequences give different set-theoretic realizations of the same abstract ordered field.
    citations:
      - wp-construction-reals
      - nlab-real-number
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: complex_pair_realization
    label: Ordered-pair complex field
    primaryDomain: analysis
    domains:
      - analysis
      - algebra
      - set-theory
      - number-theory
    level: 16
    conceptType: Set-theoretic realization
    summary: The field on $\mathbb R^2$ with $(a,b)(c,d)=(ac-bd,ad+bc)$.
    carriers:
      - set $\mathbb R^2$
    data:
      - componentwise addition
      - complex multiplication
    axioms: []
    induces:
      - element $i=(0,1)$ with $i^2=-1$
    notes: ''
    citations:
      - wp-complex-number
      - nlab-complex-number
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: complex_polynomial_quotient
    label: Polynomial-quotient complex field
    primaryDomain: analysis
    domains:
      - analysis
      - algebra
      - set-theory
      - number-theory
    level: 16
    conceptType: Quotient realization
    summary: The quotient ring $\mathbb R[x]/(x^2+1)$, which is a field isomorphic to $\mathbb C$.
    carriers:
      - quotient of $\mathbb R[x]$
    data:
      - residue class $i=[x]$
    axioms:
      - $i^2=-1$
    induces: []
    notes: Because $x^2+1$ is irreducible over $\mathbb R$, the quotient is a field.
    citations:
      - wp-complex-number
      - nlab-complex-number
  - kind: structure
    primaryField: mathematics
    fields:
      - mathematics
    id: complex_numbers
    label: Complex numbers $\mathbb C$
    primaryDomain: analysis
    domains:
      - analysis
      - algebra
      - topology
      - number-theory
    level: 17
    conceptType: Number system
    summary: The algebraically closed topological field obtained from $\mathbb R$ by adjoining a square root $i$ of $-1$.
    carriers:
      - set $\mathbb C$
    data:
      - field operations
      - Euclidean topology
      - complex conjugation
    axioms:
      - $i^2=-1$
    induces:
      - two-dimensional real vector-space structure
    notes: $\mathbb C$ cannot be ordered as an ordered field. The pair and polynomial-quotient constructions are equivalent presentations, not simultaneous literal definitions.
    citations:
      - wp-complex-number
      - nlab-complex-number
  - id: j_tvs
    label: linear + topological compatibility
    level: 13
    kind: junction
    summary: Combine vector-space, topological-space, and topological-field structures.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'Construction junction: it is a visual device, not a separate standard mathematical structure.'
    citations:
      - wp-top-vector
      - nlab-top-vector
      - princeton-functional-analysis
    combination:
      inputs:
        - vector_space
        - topological_space
        - topological_field
      compatibility: Vector addition $V\times V\to V$ and scalar multiplication $F\times V\to V$ are continuous, using the same scalar field.
      output: topological_vector_space
    primaryDomain: analysis
    domains:
      - analysis
      - algebra
      - topology
      - number-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: linear_operator
    label: Linear operator
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
      - algebra
    level: 14
    kind: structure
    conceptType: Linear map
    summary: A linear map from a vector space to itself, or more generally between vector spaces.
    citations:
      - wp-linear_operator
      - nlab-linear_operator
    carriers:
      - vector space $V$ (or specified domain and codomain)
    data:
      - linear map $A$
    axioms:
      - $A(ax+by)=aA(x)+bA(y)$
    induces:
      - kernel
      - image
      - invariant subspaces
    notes: In analysis, “operator” often carries additional domain, topology, or boundedness data.
  - id: seminormed_vector_space
    label: Seminormed vector space
    level: 14
    kind: structure
    summary: A vector space equipped with a seminorm.
    carriers:
      - vector space $V$ over a field $K$ with a specified real-valued absolute value $|\cdot |$
    data:
      - seminorm $p\colon V\to[0,\infty)$
    axioms:
      - $p(x+y)\le p(x)+p(y)$
      - $p(\lambda x)=|\lambda |p(x)$
    induces:
      - Pseudometric $d(x,y)=p(x-y)$
      - topology
    notes: More general value-group-valued norms require a different codomain and axioms; this node records the real-valued analytic notion.
    citations:
      - wp-seminormed-vector-space
      - mathlib-seminorm
      - mathlib-normed-module
    primaryDomain: analysis
    domains:
      - analysis
      - topology
      - algebra
    primaryField: mathematics
    fields:
      - mathematics
  - id: topological_vector_space
    label: Topological vector space
    level: 14
    kind: structure
    summary: A vector space with a compatible topology.
    carriers:
      - topological field $F$
      - set $V$
    data:
      - vector-space structure
      - topology on $V$
    axioms:
      - Hausdorff topology
      - continuous vector addition
      - continuous scalar multiplication
    induces: []
    notes: This atlas adopts the common Hausdorff convention.
    citations:
      - wp-top-vector
      - nlab-top-vector
      - princeton-functional-analysis
    primaryDomain: analysis
    domains:
      - analysis
      - topology
      - algebra
    primaryField: mathematics
    fields:
      - mathematics
  - id: normed_vector_space
    label: Normed vector space
    level: 15
    kind: structure
    summary: A seminormed vector space whose seminorm separates points.
    carriers:
      - seminormed vector space $V$ over a field with a specified real-valued absolute value
    data:
      - norm $\lVert \cdot \rVert$
    axioms:
      - seminorm axioms
      - $\lVert x \rVert =0 \Rightarrow x=0$
    induces:
      - Metric $d(x,y)=\lVert x-y \rVert$
      - topological vector space
    notes: Its norm canonically induces a metric, uniformity, topology, and topological-vector-space structure.
    citations:
      - wp-normed
      - mathlib-seminorm
      - mathlib-normed-module
    primaryDomain: analysis
    domains:
      - analysis
      - topology
      - algebra
    primaryField: mathematics
    fields:
      - mathematics
  - id: inner_product_space
    label: Inner-product space
    level: 16
    kind: structure
    summary: A vector space with a positive-definite inner product.
    carriers:
      - real or complex vector space $V$
    data:
      - inner product $\langle \cdot,\cdot \rangle$
    axioms:
      - linearity/sesquilinearity
      - conjugate symmetry
      - positive definiteness
    induces:
      - norm $\lVert x\rVert=\sqrt{\langle x,x\rangle}$
      - metric and topology
    notes: The inner product canonically induces a norm. The complex convention is Hermitian sesquilinear.
    citations:
      - wp-inner-product
      - nlab-inner-product-space
      - princeton-functional-analysis
    primaryDomain: analysis
    domains:
      - analysis
      - algebra
    primaryField: mathematics
    fields:
      - mathematics
  - id: locally_convex_space
    label: Locally convex space
    level: 16
    kind: structure
    summary: A real or complex topological vector space whose origin has a base of convex neighborhoods.
    carriers:
      - topological vector space $V$ over $\mathbb{R}$ or $\mathbb{C}$
    data:
      - existing vector topology; equivalently often a family of seminorms
    axioms:
      - local convexity
    induces: []
    notes: ''
    citations:
      - wp-locally-convex-space
      - eom-locally-convex
    primaryDomain: analysis
    domains:
      - analysis
      - topology
      - algebra
    primaryField: mathematics
    fields:
      - mathematics
  - id: partial_differential_equation
    label: Partial differential equation
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 18
    kind: structure
    conceptType: Equation class
    summary: An equation involving a multivariable function and its partial derivatives.
    citations:
      - wp-partial_differential_equation
      - nlab-partial_differential_equation
      - tong-qft
      - tong-gr
    carriers:
      - domain in a space with several independent variables
      - unknown function or section
    data:
      - equation involving partial derivatives
    axioms:
      - specified order and solution notion
    induces:
      - solution spaces after boundary or initial conditions
    notes: A PDE may be linear or nonlinear; regularity and boundary data are separate essential issues.
  - id: bounded_linear_operator
    label: Bounded linear operator
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 17
    kind: structure
    conceptType: Continuous linear map
    summary: A linear operator between normed spaces whose operator norm is finite.
    citations:
      - wp-bounded_linear_operator
      - nlab-bounded_linear_operator
    carriers:
      - normed spaces $X,Y$
    data:
      - linear map $A:X\to Y$
    axioms:
      - finite operator norm
      - equivalently continuity
    induces:
      - operator norm
      - Banach algebra structure when $X=Y$ is Banach
    notes: ''
  - id: differential_operator
    label: Differential operator
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 17
    kind: structure
    conceptType: Operator class
    summary: A linear or nonlinear operator built locally from derivatives and multiplication by coefficient functions.
    citations:
      - wp-differential_operator
      - nlab-differential_operator
      - tong-qft
    carriers:
      - spaces of functions or sections
    data:
      - local rule built from derivatives and coefficient functions
    axioms:
      - finite order in the ordinary differential-operator sense
    induces:
      - principal symbol for linear operators
    notes: Differential operators may be linear or nonlinear.
  - id: frechet_space
    label: Fréchet space
    level: 17
    kind: structure
    summary: A complete metrizable locally convex topological vector space.
    carriers:
      - real or complex locally convex space $V$
    data:
      - locally convex vector topology
    axioms:
      - Hausdorff
      - metrizable
      - complete for the induced uniformity
    induces: []
    notes: A Fréchet space is defined by its locally convex topology; no particular compatible complete metric is selected. It need not be normable. Every real or complex Banach space is Fréchet via its norm topology.
    citations:
      - wp-frechet-space
      - nlab-frechet-space
      - eom-frechet-space
    primaryDomain: analysis
    domains:
      - analysis
      - topology
      - algebra
    primaryField: mathematics
    fields:
      - mathematics
  - id: banach_space
    label: Banach space
    level: 18
    kind: structure
    summary: A complete normed vector space.
    carriers:
      - normed vector space $V$
    data:
      - existing norm
    axioms:
      - completeness for the induced metric
    induces: []
    notes: ''
    citations:
      - wp-banach
      - nlab-banach
      - princeton-functional-analysis
    primaryDomain: analysis
    domains:
      - analysis
      - topology
      - algebra
    primaryField: mathematics
    fields:
      - mathematics
  - id: calculus_of_variations
    label: Calculus of variations
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 18
    kind: structure
    conceptType: Analytic theory
    summary: The study of extrema and stationary points of functionals under variations of functions, curves, or fields.
    citations:
      - wp-calculus_of_variations
      - nlab-calculus_of_variations
      - cambridge-classical-dynamics
      - tong-qft
    carriers:
      - space of admissible functions, curves, or fields
    data:
      - functional $S$
      - allowed variations
    axioms:
      - regularity and boundary conditions sufficient for variations
    induces:
      - Euler–Lagrange equations
      - first and higher variations
    notes: Stationary points need not be minima.
  - id: densely_defined_operator
    label: Densely defined operator
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 18
    kind: structure
    conceptType: Possibly unbounded operator
    summary: A linear operator defined on a dense linear subspace of a topological vector space, commonly a Hilbert space.
    citations:
      - wp-densely_defined_operator
      - nlab-densely_defined_operator
    carriers:
      - Hilbert or Banach space $H$
      - dense linear domain $D(A)\subset H$
    data:
      - linear map $A:D(A)\to H$
    axioms:
      - linearity on its domain
    induces:
      - adjoint when the setting is Hilbertian
      - closure if closable
    notes: An unbounded operator cannot be defined and bounded on all of a Banach space; its domain is part of the operator.
  - id: fourier_transform
    label: Fourier transform
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 18
    kind: structure
    conceptType: Integral transform
    summary: A transformation between position or time variables and conjugate frequency or momentum variables.
    citations:
      - wp-fourier_transform
      - nlab-fourier_transform
    carriers:
      - specified function or distribution space on an Abelian group or Euclidean space
    data:
      - integral or duality transform to frequency variables
    axioms:
      - normalization and domain conditions
    induces:
      - convolution–multiplication correspondence
      - Plancherel extension where applicable
    notes: Normalization conventions vary; not every arbitrary function has a classical Fourier integral.
  - id: laplace_operator
    label: Laplace operator
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 18
    kind: structure
    conceptType: Differential operator
    summary: The divergence of the gradient, or its geometric Laplace–Beltrami generalization.
    citations:
      - wp-laplace_operator
      - nlab-laplace_operator
      - tong-quantum
    carriers:
      - Riemannian manifold or Euclidean domain
    data:
      - second-order operator $\Delta$
    axioms:
      - defined from the metric/divergence-gradient convention
    induces:
      - harmonic functions
      - spectral decomposition under suitable boundary conditions
    notes: The overall sign convention varies.
  - id: adjoint_operator
    label: Adjoint operator
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 19
    kind: structure
    conceptType: Operator construction
    summary: For a densely defined operator between Hilbert spaces, the operator determined on its natural domain by $\langle Ax,y\rangle=\langle x,A^*y\rangle$.
    citations:
      - wp-adjoint_operator
      - nlab-adjoint_operator
    carriers:
      - Hilbert spaces
      - densely defined operator $A$
    data:
      - operator $A^*$ on its natural domain
    axioms:
      - $\langle Ax,y\rangle=\langle x,A^*y\rangle$
    induces:
      - symmetric and self-adjoint operator notions
    notes: For unbounded operators, equality of domains is essential and the adjoint is always closed.
  - id: j_banach_algebra
    label: complete normed algebra
    level: 19
    kind: junction
    summary: Combine an associative algebra with a Banach-space norm on the same carrier.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'Construction junction: it is a visual device, not a separate standard mathematical structure.'
    citations:
      - wp-j-banach-algebra
      - mathlib-normed-algebra
      - mathlib-normed-ring
    combination:
      inputs:
        - associative_algebra
        - banach_space
      compatibility: Both structures use the same normed field $K$, carrier, addition, and scalar action, and the norm satisfies $\lVert ab \rVert \le \lVert a \rVert \lVert b \rVert$.
      output: banach_algebra
    primaryDomain: analysis
    domains:
      - analysis
      - algebra
      - topology
    primaryField: mathematics
    fields:
      - mathematics
  - id: functional_derivative
    label: Functional derivative
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 19
    kind: structure
    conceptType: Differential construction
    summary: A derivative of a functional with respect to a function or field, defined through its first variation.
    citations:
      - wp-functional_derivative
      - nlab-functional_derivative
      - tong-qft
    carriers:
      - space of functions or fields
      - functional $F$
    data:
      - distribution or function representing the first variation when it exists
    axioms:
      - $\delta F=\int (\delta F/\delta\phi)\,\delta\phi$ in the chosen pairing
    induces:
      - Euler–Lagrange derivative
    notes: Existence and representation depend on the function space, topology, measure, and boundary conditions.
  - id: schwartz_space
    label: Schwartz space
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 19
    kind: structure
    conceptType: Test-function space
    summary: The Fréchet space of smooth functions whose derivatives decay faster than every inverse polynomial.
    citations:
      - wp-schwartz_space
      - nlab-schwartz_space
    carriers:
      - smooth functions on $\mathbb R^n$
    data:
      - seminorms $\sup_x|x^\alpha\partial^\beta f(x)|$
    axioms:
      - all such seminorms finite
    induces:
      - Fréchet topology
      - Fourier-transform automorphism
      - tempered-distribution dual
    notes: ''
  - id: banach_algebra
    label: Banach algebra
    level: 20
    kind: structure
    summary: An associative algebra over a normed field that is complete under a submultiplicative norm.
    carriers:
      - associative algebra $A$ over a normed field $K$
      - Banach-space structure on the same $K$-vector space
    data:
      - norm $\lVert \cdot \rVert$
    axioms:
      - $\lVert ab \rVert \le \lVert a \rVert \lVert b \rVert$
      - complete in the norm metric
    induces: []
    notes: ''
    citations:
      - wp-j-banach-algebra
      - nlab-banach-algebra
      - mathlib-normed-algebra
      - mathlib-normed-ring
    primaryDomain: analysis
    domains:
      - analysis
      - topology
      - algebra
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_cstar
    label: Banach algebra + involution
    primaryDomain: analysis
    domains:
      - analysis
      - algebra
    level: 21
    kind: junction
    summary: Compatibility construction producing a $C^*$-algebra.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: All incoming branches are jointly required.
    citations:
      - wp-cstar-algebra
      - mathlib-cstar-classes
    combination:
      inputs:
        - banach_algebra
        - star_algebra
      compatibility: Use the same complex algebra structure and norm; star is conjugate-linear and antimultiplicative, and $\lVert a^*a\rVert=\lVert a\rVert^2$.
      output: c_star_algebra
    primaryField: mathematics
    fields:
      - mathematics
  - id: greens_function
    label: Green function
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 20
    kind: structure
    conceptType: Operator kernel
    summary: A kernel representing an inverse or fundamental solution of a linear differential operator under specified boundary conditions.
    citations:
      - wp-greens_function
      - nlab-greens_function
    carriers:
      - differential operator with domain/boundary prescription
    data:
      - distributional kernel $G$ when it exists
    axioms:
      - $LG=\delta$ with the specified conditions
    induces:
      - integral solution operator
    notes: Green functions are not guaranteed to exist and are not unique until boundary, causal, or other conditions are fixed.
  - id: hilbert_space
    label: Hilbert space
    level: 20
    kind: structure
    summary: A complete inner-product space.
    carriers:
      - real or complex vector space $H$
    data:
      - inner product
    axioms:
      - inner-product axioms
      - completeness in the induced norm
    induces: []
    notes: A Hilbert space is an inner-product space complete in the induced norm. The Banach-space structure is then canonical and is not an independent input.
    citations:
      - wp-hilbert
      - nlab-hilbert
      - princeton-functional-analysis
    primaryDomain: analysis
    domains:
      - analysis
      - topology
      - algebra
    primaryField: mathematics
    fields:
      - mathematics
  - id: projection_operator
    label: Projection operator
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 20
    kind: structure
    conceptType: Operator class
    summary: An idempotent linear operator; an orthogonal projection is also self-adjoint.
    citations:
      - wp-projection_operator
      - nlab-projection_operator
    carriers:
      - vector space or Hilbert space
    data:
      - linear operator $P$
    axioms:
      - $P^2=P$
    induces:
      - decomposition into image and kernel
    notes: An orthogonal projection additionally satisfies $P=P^*$; a general projection need not.
  - id: self_adjoint_operator
    label: Self-adjoint operator
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 20
    kind: structure
    conceptType: Operator class
    summary: A densely defined operator equal to its adjoint, including equality of domains.
    citations:
      - wp-self_adjoint_operator
      - nlab-self_adjoint_operator
    carriers:
      - Hilbert space $H$
      - dense domain $D(A)$
    data:
      - operator $A:D(A)\to H$
    axioms:
      - $A=A^*$ including equality of domains
    induces:
      - real spectrum
      - spectral measure
      - unitary evolution via functional calculus
    notes: Symmetric is weaker than self-adjoint for unbounded operators.
  - id: sobolev_space
    label: Sobolev space
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 20
    kind: structure
    conceptType: Function space
    summary: A Banach or Hilbert space controlling weak derivatives in $L^p$.
    citations:
      - wp-sobolev_space
      - nlab-sobolev_space
    carriers:
      - domain $\Omega$
      - functions or distributions with weak derivatives
    data:
      - norm controlling derivatives through order $k$ in $L^p$
    axioms:
      - weak derivatives belong to the specified $L^p$ spaces
    induces:
      - Banach structure; Hilbert structure when $p=2$
    notes: Boundary conditions define important closed subspaces such as $W_0^{k,p}$.
  - id: distribution_space
    label: Space of distributions
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
      - measure
    level: 20
    kind: structure
    conceptType: Continuous dual space
    summary: The continuous dual of a test-function space, generalizing ordinary functions and measures.
    citations:
      - wp-distribution_space
      - nlab-distribution_space
    carriers:
      - test-function space $\mathcal D$ or $\mathcal S$
    data:
      - continuous linear functionals on the test space
    axioms:
      - linearity
      - continuity in the test-function topology
    induces:
      - distributional derivatives
      - Fourier transform for tempered distributions
    notes: The term “distribution” depends on the test-function space; tempered distributions are dual to Schwartz space.
  - id: spherical_harmonic
    label: Spherical harmonic
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: analysis
    domains:
      - analysis
    level: 20
    kind: structure
    conceptType: Special-function basis
    summary: A simultaneous eigenfunction of the spherical Laplace–Beltrami operator (equivalently $\mathbf L^2$) and a chosen component $L_z$; the $Y_{\ell m}$ form an orthonormal basis of $L^2(S^2)$.
    citations:
      - wp-spherical_harmonic
      - pdg-2026-mathematical-tools
      - nist-atomic-spectroscopy
