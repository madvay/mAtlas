nodes:
  - id: measurable_space
    label: Measurable space
    level: 1
    kind: structure
    summary: A set equipped with a $\sigma$-algebra of measurable subsets.
    carriers:
      - set $X$
    data:
      - $\sigma$-algebra $\Sigma\subseteq\mathcal P(X)$
    axioms:
      - contains $X$
      - closed under complements
      - closed under countable unions
    induces: []
    notes: ''
    citations:
      - wp-measurable
      - nlab-measurable-space
      - tao-measure-theory
    primaryDomain: measure
    domains:
      - measure
      - probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: measure_space
    label: Measure space
    level: 2
    kind: structure
    summary: A measurable space equipped with a countably additive measure.
    carriers:
      - set $X$
      - $\sigma$-algebra $\Sigma$
    data:
      - measure $\mu\colon\Sigma\to[0,\infty]$
    axioms:
      - $\mu (\varnothing)=0$
      - countable additivity
    induces: []
    notes: ''
    citations:
      - wp-measure-space
      - nlab-measure-space
      - tao-measure-theory
    primaryDomain: measure
    domains:
      - measure
      - probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_measurable_function
    label: function + measurable domain/codomain
    primaryDomain: measure
    domains:
      - measure
    level: 3
    kind: junction
    summary: Combine a function with measurable structures on its domain and codomain, then impose measurability.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: The measurable-space input is instantiated for both domain and codomain.
    citations:
      - wp-measurable-function
      - tao-measure-theory
    combination:
      inputs:
        - function
        - measurable_space
      compatibility: The function domain and codomain carry the supplied $\sigma$-algebras, and inverse images of codomain-measurable sets are domain-measurable.
      output: measurable_function
    primaryField: mathematics
    fields:
      - mathematics
  - id: borel_measurable_space
    label: Borel measurable space
    level: 3
    kind: structure
    summary: A topological space equipped with the $\sigma$-algebra generated by its open sets.
    carriers:
      - topological space $X$
    data:
      - Borel $\sigma$-algebra $\mathcal B(X)$
    axioms:
      - $\mathcal B(X)$ is generated by the open subsets of $X$
    induces: []
    notes: The Borel $\sigma$-algebra is canonically determined by the topology.
    citations:
      - wp-borel
      - tao-measure-theory
    primaryDomain: measure
    domains:
      - measure
      - topology
    primaryField: mathematics
    fields:
      - mathematics
  - id: measurable_function
    label: Measurable function
    primaryDomain: measure
    domains:
      - measure
    level: 4
    kind: structure
    summary: A function whose inverse images of measurable sets are measurable.
    carriers:
      - measurable spaces $(X,\Sigma)$ and $(Y,\mathcal T)$
    data:
      - function $f\colon X\to Y$
    axioms:
      - $f^{-1}(B)\in\Sigma$ for every $B\in\mathcal T$
    induces: []
    notes: Both domain and codomain measurable structures are part of the specification; measurability is not a property of a bare function alone.
    citations:
      - wp-measurable-function
      - nlab-measurable-function
      - tao-measure-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: probability_space
    label: Probability space
    level: 3
    kind: structure
    summary: A measure space $(\Omega,\mathcal F,\mathbb P)$ with total mass one.
    carriers:
      - set $\Omega$
      - $\sigma$-algebra $\mathcal F$
    data:
      - probability measure $\mathbb P$ on $(\Omega,\mathcal F)$
    axioms:
      - measure axioms
      - $\mathbb P(\Omega)=1$
    induces: []
    notes: ''
    citations:
      - wp-probability
      - nlab-probability-space
      - tao-measure-theory
    primaryDomain: measure
    domains:
      - measure
      - probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: sigma_finite_measure_space
    label: $\sigma$-finite measure space
    level: 3
    kind: structure
    summary: A measure space covered by countably many sets of finite measure.
    carriers:
      - measure space $(X,\Sigma,\mu)$
    data:
      - existing measure
    axioms:
      - $\sigma$-finiteness
    induces: []
    notes: ''
    citations:
      - wp-sigma-finite
      - tao-measure-theory
    primaryDomain: measure
    domains:
      - measure
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_radon
    label: regular measure on LCH space
    level: 7
    kind: junction
    summary: Combine a locally compact Hausdorff topology with a measure.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'Construction junction: it is a visual device, not a separate standard mathematical structure.'
    citations:
      - wp-radon
      - tao-measure-theory
    combination:
      inputs:
        - locally_compact_hausdorff_space
        - measure_space
      compatibility: Use the Borel $\sigma$-algebra (or a specified completion containing it) on the locally compact Hausdorff space and require local finiteness plus inner/outer regularity under the stated convention.
      output: radon_measure_space
    primaryDomain: measure
    domains:
      - measure
      - topology
      - analysis
    primaryField: mathematics
    fields:
      - mathematics
  - id: radon_measure_space
    label: Radon measure space
    level: 8
    kind: structure
    summary: A topological measure space with a regular, locally finite Borel measure under standard conventions.
    carriers:
      - locally compact Hausdorff space $X$
    data:
      - Borel measure $\mu$
    axioms:
      - local finiteness
      - inner regularity; convention-dependent details
    induces: []
    notes: Definitions vary slightly across texts and levels of generality.
    citations:
      - wp-radon
      - tao-measure-theory
    primaryDomain: measure
    domains:
      - measure
      - topology
      - analysis
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_haar_measure
    label: topological group + local compactness
    primaryDomain: measure
    domains:
      - measure
      - topology
      - analysis
    level: 9
    kind: junction
    summary: Combine a topological-group structure with local compactness and Hausdorff separation on the same underlying topology; the Haar existence theorem then supplies invariant measure.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'The local compactness and Hausdorff hypotheses are essential here: an arbitrary topological group need not carry a Haar measure.'
    citations:
      - wp-haar_measure
      - nlab-haar_measure
      - mathlib-haar-measure
    combination:
      inputs:
        - topological_group
        - locally_compact_hausdorff_space
      compatibility: Both inputs use the same carrier $G$ and the same topology.
      output: haar_measure
    primaryField: mathematics
    fields:
      - mathematics
  - id: haar_measure
    label: Haar measure
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: measure
    domains:
      - measure
      - topology
    level: 10
    kind: structure
    conceptType: Invariant measure
    summary: A nonzero left-invariant regular Borel measure on a locally compact Hausdorff group, unique up to positive scale; right Haar measure is analogous, and a left Haar measure is also right-invariant precisely for unimodular groups.
    citations:
      - wp-haar_measure
      - nlab-haar_measure
      - mathlib-haar-measure
    carriers:
      - locally compact Hausdorff group $G$
      - Borel $\sigma$-algebra
    data:
      - nonzero regular Borel measure $\mu$
    axioms:
      - left invariance
      - finite measure on compact sets
    induces:
      - integration invariant under left translation
    notes: Left Haar measure is unique up to positive scale. Right Haar measure is analogous; a left Haar measure is also right-invariant precisely when the group is unimodular.
  - id: positive_operator_valued_measure
    label: Positive-operator-valued measure
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: measure
    domains:
      - measure
    level: 23
    kind: structure
    conceptType: Operator-valued measure
    summary: A weakly countably additive map $E$ from a measurable outcome space to positive operators on a Hilbert space, normalized by $E(\Omega)=I$.
    citations:
      - wp-positive_operator_valued_measure
      - nlab-positive_operator_valued_measure
      - nist-quantum-theory
      - tong-quantum
    carriers:
      - measurable outcome space $(\Omega,\Sigma)$
      - Hilbert space $H$
    data:
      - map $E\colon\Sigma\to\{\text{positive operators on }H\}$
    axioms:
      - weak countable additivity
      - $E(\Omega)=I$
    induces:
      - probability measures $p_\rho(B)=\operatorname{Tr}(\rho E(B))$
    notes: A PVM is the special case in which every effect is an orthogonal projection.
edges:
  - id: borel_to_measurable
    source: borel_measurable_space
    target: measurable_space
    type: induced-forgotten
    label: forget the topology
    detail: Retain only the Borel $\sigma$-algebra as a measurable-space structure.
    citations:
      - wp-borel
      - wp-measurable
      - tao-measure-theory
  - id: haar_to_gauge
    source: haar_measure
    target: gauge_field_theory
    type: mathematical-formulation
    label: group integration
    detail: Invariant integration over compact groups underlies group averaging, lattice gauge theory, and representation orthogonality.
    citations:
      - wp-physics-gauge_field_theory
      - nlab-physics-gauge_field_theory
      - wp-haar_measure
      - nlab-haar_measure
    overview: true
  - id: j_measurable_function__out
    source: j_measurable_function
    target: measurable_function
    type: combine-compatible
    label: impose measurability
    detail: Require inverse images of measurable codomain sets to be measurable in the domain.
    citations:
      - wp-measurable-function
      - tao-measure-theory
  - id: e_jradon_radon
    source: j_radon
    target: radon_measure_space
    type: combine-compatible
    label: + Borel regularity
    detail: Require the measure to be Borel, locally finite, and regular under the chosen convention.
    citations:
      - wp-radon
      - tao-measure-theory
  - id: j_random_variable__map
    source: measurable_function
    target: j_random_variable
    type: combine-compatible
    label: measurable value map
    detail: Supply a measurable map from the same underlying measurable domain.
    citations:
      - wp-random-variable
      - durrett-probability
  - id: j_filtration__measurable
    source: measurable_space
    target: j_filtration
    type: combine-compatible
    label: ambient $\sigma$-algebra
    detail: Supply the measurable space whose sub-$\sigma$-algebras form the filtration.
    citations:
      - wp-filtration-probability
      - durrett-probability
  - id: j_measurable_function__spaces
    source: measurable_space
    target: j_measurable_function
    type: combine-compatible
    label: domain and codomain $\sigma$-algebras
    detail: Instantiate measurable-space structure on both domain and codomain.
    citations:
      - wp-measurable-function
      - tao-measure-theory
  - id: e_meas_measure
    source: measurable_space
    target: measure_space
    type: add-data
    label: + measure $\mu$
    detail: Choose a countably additive measure.
    citations:
      - wp-measure-space
      - tao-measure-theory
  - id: e_measure_jradon
    source: measure_space
    target: j_radon
    type: combine-compatible
    label: measure
    detail: Supply the measure.
    citations:
      - wp-radon
      - tao-measure-theory
  - id: e_measure_prob
    source: measure_space
    target: probability_space
    type: impose-axiom
    label: require total mass one
    detail: Restrict to measures $\mu$ with $\mu (X)=1$; this is a property, not an instruction to rescale an arbitrary measure.
    citations:
      - wp-probability
      - tao-measure-theory
  - id: e_measure_sigmafinite
    source: measure_space
    target: sigma_finite_measure_space
    type: impose-axiom
    label: + $\sigma$-finiteness
    detail: Require a countable cover by finite-measure sets.
    citations:
      - wp-sigma-finite
      - tao-measure-theory
  - id: povm_from_positive
    source: measurable_space
    target: positive_operator_valued_measure
    type: add-data
    label: positive-operator-valued measure
    detail: A POVM adds a normalized, weakly countably additive assignment of a positive operator to each measurable outcome set.
    citations:
      - wp-positive_operator
      - nlab-positive_operator
      - tong-quantum
      - wp-positive_operator_valued_measure
      - nlab-positive_operator_valued_measure
      - nist-quantum-theory
  - id: povm_to_measurement
    source: positive_operator_valued_measure
    target: quantum_measurement
    type: mathematical-formulation
    label: generalized measurement outcomes
    detail: POVMs assign outcome probabilities through the Born rule.
    citations:
      - wp-positive_operator_valued_measure
      - nlab-positive_operator_valued_measure
      - nist-quantum-theory
      - tong-quantum
      - wp-physics-quantum_measurement
      - nlab-physics-quantum_measurement
  - id: j_filtered_probability__probability_space
    source: probability_space
    target: j_filtered_probability
    type: combine-compatible
    label: probability measure
    detail: Supply the Probability space structure as one jointly required input.
    citations:
      - wp-filtered-probability
      - durrett-probability
  - id: j_random_variable__probability
    source: probability_space
    target: j_random_variable
    type: combine-compatible
    label: probability domain
    detail: Supply the probability measure and its underlying measurable space.
    citations:
      - wp-random-variable
      - durrett-probability
  - id: e_probability_standard
    source: probability_space
    target: standard_probability_space
    type: impose-axiom
    label: + standard Borel form
    detail: Require a standard Borel realization modulo null sets.
    citations:
      - wp-standard-probability
      - durrett-probability
  - id: math_topological_group_to_haar_measure
    source: j_haar_measure
    target: haar_measure
    type: combine-compatible
    label: outputs Haar measure
    detail: Every locally compact Hausdorff topological group admits a nonzero left Haar measure, unique up to multiplication by a positive scalar.
    citations:
      - wp-haar_measure
      - nlab-haar_measure
      - mathlib-haar-measure
  - id: probability_space_to_conditional_probability
    source: probability_space
    target: conditional_probability
    type: canonical-construction
    label: normalize on a positive-probability event
    detail: For an event $B$ with $\mathbb P(B)>0$, restricting $\mathbb P$ to intersections with $B$ and dividing by $\mathbb P(B)$ gives the conditional probability measure.
    citations:
      - wp-conditional-probability
      - nlab-probability-theory
      - durrett-probability
