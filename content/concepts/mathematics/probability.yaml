nodes:
  - id: j_filtration
    label: ordered family + ambient measurable space
    primaryDomain: probability
    domains:
      - probability
      - measure
      - order
    level: 4
    kind: junction
    summary: Combine an ordered indexed family with one ambient measurable space to form nested sub-$\sigma$-algebras.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: The index order and common ambient $\sigma$-algebra are essential parts of the definition.
    citations:
      - wp-filtration-probability
      - durrett-probability
    combination:
      inputs:
        - indexed_family
        - measurable_space
      compatibility: Index by a preorder (usually time), make every family member a sub-$\sigma$-algebra of the same ambient $\sigma$-algebra, and require $\mathcal F_s\subseteq\mathcal F_t$ whenever $s\le t$.
      output: filtration
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_random_variable
    label: probability domain + measurable map
    primaryDomain: probability
    domains:
      - probability
      - measure
    level: 4
    kind: junction
    summary: Combine a probability space with a measurable map having that space as domain.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: All incoming branches are jointly required.
    citations:
      - wp-random-variable
      - durrett-probability
    combination:
      inputs:
        - probability_space
        - measurable_function
      compatibility: The measurable-function domain is the measurable space underlying the probability space; its codomain is the value space.
      output: random_variable
    primaryField: mathematics
    fields:
      - mathematics
  - id: filtration
    label: Filtration
    primaryDomain: probability
    domains:
      - probability
      - measure
      - order
    level: 4
    kind: structure
    summary: An increasing indexed family of $\sigma$-algebras representing information over time.
    carriers:
      - measurable space $(\Omega,\mathcal F)$
      - ordered index set $T$
    data:
      - $\sigma$-algebras $\mathcal F_t\subseteq\mathcal F$
    axioms:
      - $s\le t$ implies $\mathcal F_s\subseteq\mathcal F_t$
    induces: []
    notes: A filtration is a monotone family of sub-$\sigma$-algebras of one ambient measurable space, indexed by an ordered set.
    citations:
      - wp-filtration-probability
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: random_variable
    label: Random variable
    primaryDomain: probability
    domains:
      - probability
      - measure
      - analysis
    level: 4
    kind: structure
    summary: A measurable function from a probability space to a measurable value space.
    carriers:
      - probability space $(\Omega,\mathcal F,\mathbb P)$
      - measurable space $(S,\Sigma)$
    data:
      - measurable map $X\colon(\Omega,\mathcal F)\to(S,\Sigma)$
    axioms: []
    induces: []
    notes: The probability space and value-space $\sigma$-algebra are part of the data. Traditionally the codomain is $\mathbb R$ or $\mathbb R^n$; for a general measurable codomain, “random element” is also common.
    citations:
      - wp-random-variable
      - nlab-random-variable
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: filtered_probability_space
    label: Filtered probability space
    primaryDomain: probability
    domains:
      - probability
      - measure
    level: 5
    kind: structure
    summary: A probability space equipped with a filtration of sub-$\sigma$-algebras.
    carriers:
      - probability space $(\Omega,\mathcal F,\mathbb P)$
    data:
      - filtration $(\mathcal F_t)_{t\in T}$
    axioms:
      - $\mathcal F_t\subseteq\mathcal F$ for every $t\in T$
    induces: []
    notes: ''
    citations:
      - wp-filtered-probability
      - nlab-filtered-probability-space
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_filtered_probability
    label: probability + filtration
    primaryDomain: probability
    domains:
      - probability
      - measure
    level: 5
    kind: junction
    summary: Compatibility construction producing Filtered probability space.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: All incoming branches are jointly required.
    citations:
      - wp-filtered-probability
      - durrett-probability
    combination:
      inputs:
        - probability_space
        - filtration
      compatibility: Use a filtration of sub-$\sigma$-algebras of the probability space.
      output: filtered_probability_space
    primaryField: mathematics
    fields:
      - mathematics
  - id: standard_probability_space
    label: Standard probability space
    primaryDomain: probability
    domains:
      - probability
      - measure
      - topology
    level: 5
    kind: structure
    summary: A probability space isomorphic modulo null sets to a standard Borel probability space.
    carriers:
      - probability space
    data: []
    axioms:
      - standard Borel structure modulo completion
    induces: []
    notes: 'Convention-sensitive: common formulations classify completed probability spaces modulo null sets as a standard nonatomic part plus at most countably many atoms. A standard Borel probability space before completion is a related but distinct notion.'
    citations:
      - wp-standard-probability
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_stochastic_process
    label: probability + indexed random variables
    primaryDomain: probability
    domains:
      - probability
      - measure
    level: 6
    kind: junction
    summary: Combine an index set/family with random variables sharing one probability space.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: All incoming branches are jointly required.
    citations:
      - wp-stochastic-process
      - durrett-probability
    combination:
      inputs:
        - indexed_family
        - random_variable
      compatibility: All random variables have the same probability-space domain and a common state space (or a specified family of state spaces), and the indexed family enumerates them.
      output: stochastic_process
    primaryField: mathematics
    fields:
      - mathematics
  - id: stochastic_process
    label: Stochastic process
    primaryDomain: probability
    domains:
      - probability
      - measure
      - analysis
    level: 6
    kind: structure
    summary: An indexed family of random variables defined on a common probability space.
    carriers:
      - probability space $(\Omega,\mathcal F,\mathbb P)$
      - index set $T$
      - state space $S$
    data:
      - family $(X_t)_{t\in T}$ of random variables
    axioms: []
    induces: []
    notes: All component random variables share a probability-space domain; state spaces may be common or indexed depending on convention.
    citations:
      - wp-stochastic-process
      - nlab-stochastic-process
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: markov_chain
    label: Markov chain
    primaryDomain: probability
    domains:
      - probability
      - combinatorics
      - analysis
    level: 7
    kind: structure
    summary: A discrete-time stochastic process with the Markov conditional-independence property.
    carriers:
      - stochastic process $(X_{n})$
    data: []
    axioms:
      - future conditional law depends on the present state, not the full past
    induces: []
    notes: ''
    citations:
      - wp-markov-chain
      - nlab-markov-chain
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: probability_distribution
    label: Probability distribution
    primaryDomain: probability
    domains:
      - probability
      - measure
    level: 5
    kind: structure
    summary: A probability measure on a measurable value space, including the pushforward law of a random variable.
    carriers:
      - measurable space $(S,\Sigma)$
    data:
      - probability measure $\mu$ on $(S,\Sigma)$
    axioms:
      - $\mu(S)=1$
    induces:
      - probabilities of measurable value sets
    notes: A distribution need not possess a density; discrete, continuous, singular, and mixed probability laws are all included.
    citations:
      - wp-probability-distribution
      - nlab-probability-distribution
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: expectation
    label: Expected value
    primaryDomain: probability
    domains:
      - probability
      - measure
      - analysis
    level: 6
    kind: structure
    summary: The integral of an integrable real-valued random variable, equivalently its first moment with respect to its distribution.
    carriers:
      - probability space $(\Omega,\mathcal F,\mathbb P)$
      - integrable random variable $X$
    data:
      - integral $\mathbb E[X]=\int_\Omega X\,d\mathbb P$
    axioms:
      - $\int_\Omega |X|\,d\mathbb P<\infty$
    induces:
      - first moment of the probability distribution
    notes: Extended expectations can be defined for nonnegative random variables; the finite real-valued expectation here requires integrability.
    citations:
      - wp-expected-value
      - nlab-physics-expectation-value
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: independent_random_variables
    label: Independent random variables
    primaryDomain: probability
    domains:
      - probability
      - measure
    level: 6
    kind: structure
    summary: A family of random variables whose finite subfamilies have joint probabilities that factor into their marginal probabilities.
    carriers:
      - common probability space
      - indexed family $(X_i)_{i\in I}$ of random variables
    data: []
    axioms:
      - for every finite $J\subseteq I$, $\mathbb P(\bigcap_{j\in J}\{X_j\in A_j\})=\prod_{j\in J}\mathbb P(X_j\in A_j)$ for measurable $A_j$
    induces:
      - product finite-dimensional distributions
    notes: Pairwise independence is weaker than mutual independence and is not substituted here.
    citations:
      - wp-independent-random-variables
      - nlab-iid-random-variables
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: conditional_probability
    label: Conditional probability
    primaryDomain: probability
    domains:
      - probability
      - measure
    level: 6
    kind: structure
    summary: For events $A$ and $B$ with $\mathbb P(B)>0$, the normalized probability $\mathbb P(A\mid B)=\mathbb P(A\cap B)/\mathbb P(B)$.
    carriers:
      - probability space $(\Omega,\mathcal F,\mathbb P)$
      - events $A,B\in\mathcal F$
    data:
      - conditioned probability $\mathbb P(A\mid B)$
    axioms:
      - $\mathbb P(B)>0$
    induces:
      - a probability measure $A\mapsto\mathbb P(A\mid B)$ for fixed $B$
    notes: Conditioning on sigma-algebras or null events requires conditional expectation or regular conditional probabilities; the elementary event formula does not cover those cases.
    citations:
      - wp-conditional-probability
      - nlab-probability-theory
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: normal_distribution
    label: Normal distribution
    primaryDomain: probability
    domains:
      - probability
      - measure
      - analysis
    level: 7
    kind: structure
    summary: A Gaussian probability law on the real line, specified by a mean $\mu$ and variance $\sigma^2\ge0$.
    carriers:
      - real measurable space
    data:
      - parameters $\mu\in\mathbb R$ and $\sigma^2\ge0$
    axioms:
      - characteristic function $\exp(i\mu t-\sigma^2t^2/2)$
    induces:
      - Gaussian density when $\sigma^2>0$
    notes: Allowing $\sigma^2=0$ includes the degenerate point mass at $\mu$; some conventions reserve “normal distribution” for positive variance.
    citations:
      - wp-normal-distribution
      - nlab-gaussian-distribution
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: convergence_in_probability
    label: Convergence in probability
    primaryDomain: probability
    domains:
      - probability
      - measure
      - analysis
    level: 7
    kind: structure
    summary: A sequence $X_n$ converges in probability to $X$ when $\mathbb P(d(X_n,X)>\varepsilon)\to0$ for every $\varepsilon>0$.
    carriers:
      - random variables $X_n,X$ with values in a metric space
    data:
      - sequence $(X_n)$ and candidate limit $X$
    axioms:
      - $\mathbb P(d(X_n,X)>\varepsilon)\to0$ for every $\varepsilon>0$
    induces: []
    notes: Convergence in probability is weaker than almost-sure convergence and stronger than convergence in distribution.
    citations:
      - wp-convergence-random-variables
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: law_of_large_numbers
    label: Law of large numbers
    primaryDomain: probability
    domains:
      - probability
      - analysis
    level: 8
    kind: structure
    conceptType: Theorem family
    summary: Under standard independence and moment hypotheses, sample averages converge to the common expectation, in probability for the weak law and almost surely for the strong law.
    carriers:
      - sequence of random variables
    data:
      - normalized partial averages
    axioms:
      - hypotheses vary by theorem; the iid integrable case is canonical
    induces:
      - convergence of empirical averages
    notes: Independence alone is insufficient; the precise weak or strong law and its integrability or variance hypotheses must be stated.
    citations:
      - wp-law-large-numbers
      - nlab-law-large-numbers
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
  - id: central_limit_theorem
    label: Central limit theorem
    primaryDomain: probability
    domains:
      - probability
      - analysis
    level: 9
    kind: structure
    conceptType: Limit theorem
    summary: For iid real random variables with finite nonzero variance, centered and variance-normalized sums converge in distribution to the standard normal law.
    carriers:
      - iid sequence $(X_n)$ of real random variables
    data:
      - centered normalized sums
    axioms:
      - finite mean
      - finite nonzero variance
    induces:
      - asymptotic Gaussian distribution
    notes: This is the classical Lindeberg–Lévy form; triangular-array and dependent-variable central limit theorems require different hypotheses.
    citations:
      - wp-central-limit-theorem
      - nlab-central-limit-theorem
      - durrett-probability
    primaryField: mathematics
    fields:
      - mathematics
edges:
  - id: j_filtered_probability__filtration
    source: filtration
    target: j_filtered_probability
    type: combine-compatible
    label: information filtration
    detail: Supply the Filtration structure as one jointly required input.
    citations:
      - wp-filtered-probability
      - durrett-probability
  - id: j_filtered_probability__out
    source: j_filtered_probability
    target: filtered_probability_space
    type: combine-compatible
    label: impose compatibility
    detail: Use a filtration of sub-$\sigma$-algebras of the probability space.
    citations:
      - wp-filtered-probability
      - durrett-probability
  - id: j_filtration__out
    source: j_filtration
    target: filtration
    type: combine-compatible
    label: require nested sub-$\sigma$-algebras
    detail: Require monotonicity $\mathcal F_s\subseteq\mathcal F_t$ for $s\le t$ within one ambient $\sigma$-algebra.
    citations:
      - wp-filtration-probability
      - durrett-probability
  - id: j_random_variable__out
    source: j_random_variable
    target: random_variable
    type: combine-compatible
    label: identify the domain
    detail: Identify the map domain with the probability space and retain the measurable codomain as the value space.
    citations:
      - wp-random-variable
      - durrett-probability
  - id: j_stochastic_process__out
    source: j_stochastic_process
    target: stochastic_process
    type: combine-compatible
    label: impose compatibility
    detail: Require every member of the indexed family to be a measurable function on the same probability space.
    citations:
      - wp-stochastic-process
      - durrett-probability
  - id: j_stochastic_process__random_variable
    source: random_variable
    target: j_stochastic_process
    type: combine-compatible
    label: family members
    detail: Supply measurable random variables on one common probability space.
    citations:
      - wp-stochastic-process
      - wp-random-variable
      - durrett-probability
  - id: e_process_markov
    source: stochastic_process
    target: markov_chain
    type: impose-axiom
    label: + Markov property
    detail: Require discrete time (typically index set $\mathbb{N}$) and the Markov conditional-independence property.
    citations:
      - wp-markov-chain
      - durrett-probability
  - id: random_variable_to_distribution
    source: random_variable
    target: probability_distribution
    type: canonical-construction
    label: push forward the probability measure
    detail: The law of $X$ is the pushforward measure $\mathbb P\circ X^{-1}$ on its measurable value space.
    citations:
      - wp-probability-distribution
      - nlab-probability-distribution
      - durrett-probability
  - id: random_variable_to_expectation
    source: random_variable
    target: expectation
    type: canonical-construction
    label: integrate when integrable
    detail: A real-valued random variable with finite absolute first moment has expectation $\int X\,d\mathbb P$.
    citations:
      - wp-expected-value
      - nlab-physics-expectation-value
      - durrett-probability
  - id: random_variable_to_independent_family
    source: stochastic_process
    target: independent_random_variables
    type: impose-axiom
    label: + mutual independence
    detail: Require every finite subfamily of the indexed random variables to have joint probabilities that factor into their marginals.
    citations:
      - wp-independent-random-variables
      - nlab-iid-random-variables
      - durrett-probability
  - id: distribution_to_expectation
    source: probability_distribution
    target: expectation
    type: canonical-construction
    label: take the first moment
    detail: A real probability distribution with finite absolute first moment determines its mean by integrating the identity function.
    citations:
      - wp-expected-value
      - wp-probability-distribution
      - durrett-probability
  - id: distribution_to_normal
    source: probability_distribution
    target: normal_distribution
    type: classification
    label: Gaussian law
    detail: Normal distributions form the Gaussian location-scale subclass of probability distributions on the real line.
    citations:
      - wp-normal-distribution
      - nlab-gaussian-distribution
      - durrett-probability
  - id: independent_family_to_law_large_numbers
    source: independent_random_variables
    target: law_of_large_numbers
    type: theorem-implication
    label: sample-average convergence under stated hypotheses
    detail: In the iid integrable case, the strong law gives almost-sure convergence of sample averages to the common mean; weaker variants use their own explicit assumptions.
    citations:
      - wp-law-large-numbers
      - nlab-law-large-numbers
      - durrett-probability
  - id: independent_family_to_central_limit
    source: independent_random_variables
    target: central_limit_theorem
    type: theorem-implication
    label: Gaussian limit under iid finite-variance hypotheses
    detail: For iid real variables with finite nonzero variance, centered and normalized sums converge in distribution to a standard normal random variable.
    citations:
      - wp-central-limit-theorem
      - nlab-central-limit-theorem
      - durrett-probability
  - id: law_large_numbers_to_probability_convergence
    source: law_of_large_numbers
    target: convergence_in_probability
    type: theorem-implication
    label: weak-law convergence
    detail: The weak law asserts convergence in probability of sample averages to the relevant expectation under its stated hypotheses.
    citations:
      - wp-law-large-numbers
      - wp-convergence-random-variables
      - durrett-probability
  - id: central_limit_to_normal_distribution
    source: central_limit_theorem
    target: normal_distribution
    type: theorem-implication
    label: standard-normal limiting law
    detail: The classical normalized sums converge in distribution to the standard normal law, not generally in probability on their original probability space.
    citations:
      - wp-central-limit-theorem
      - wp-normal-distribution
      - nlab-central-limit-theorem
      - durrett-probability
  - id: probability_distribution_to_statistical_ensemble
    source: probability_distribution
    target: statistical_ensemble
    type: mathematical-formulation
    label: classical ensemble measure
    detail: A classical statistical ensemble is formulated as a probability measure on a specified microstate space. Quantum ensembles instead use density operators, so the probability-distribution formulation is not the whole target concept.
    citations:
      - wp-probability-distribution
      - wp-physics-statistical-ensemble
      - tong-statistical-physics
  - id: stochastic_process_to_nonequilibrium_statistical_mechanics
    source: stochastic_process
    target: nonequilibrium_statistical_mechanics
    type: mathematical-formulation
    label: random time-evolution model
    detail: Stochastic processes model fluctuating trajectories, transport, and effective open-system dynamics in nonequilibrium statistical mechanics. Deterministic kinetic and Hamiltonian descriptions are additional, non-equivalent formulations.
    citations:
      - wp-stochastic-process
      - wp-physics-nonequilibrium-thermodynamics
      - tong-kinetic-theory
