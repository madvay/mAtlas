    primaryField: mathematics
    fields:
      - mathematics
    conceptType: Foundational structure
  - id: pointed_set
    label: Pointed set
    level: 1
    kind: structure
    summary: A set with one distinguished element.
    carriers:
      - set $X$
    data:
      - basepoint $x_{0} \in X$
    axioms: []
    induces: []
    notes: ''
    citations:
      - wp-pointed
      - nlab-pointed-set
      - openlogic-set-theory
    primaryDomain: set-theory
    domains:
      - set-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: function
    label: Function
    primaryDomain: set-theory
    domains:
      - set-theory
      - logic
      - category-theory
    level: 2
    kind: structure
    summary: A total single-valued relation from a domain set to a codomain set.
    carriers:
      - domain $X$
      - codomain $Y$
    data:
      - subset $f \subseteq X\times Y$
    axioms:
