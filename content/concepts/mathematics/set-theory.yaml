    id: axiom_of_choice
    label: Axiom of choice (AC)
    primaryDomain: set-theory
    domains:
      - set-theory
      - logic
    level: 3
    conceptType: Axiom
    summary: The assertion that every set-indexed family of nonempty sets has a choice function.
    carriers:
      - set-theoretic statement
    data:
      - choice function selecting one element from each member of a family
    axioms: []
    induces:
      - well-ordering theorem and Zorn’s lemma over ZF
    notes: AC is independent of ZF, assuming ZF is consistent. Its standard equivalents are equivalent over ZF, not in arbitrary weak background theories.
