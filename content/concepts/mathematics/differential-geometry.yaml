    level: 13
    kind: structure
    conceptType: Geometric lift
    summary: A lift of an oriented orthonormal frame bundle to the appropriate spin-group principal bundle, enabling globally defined spinor fields on an oriented Riemannian manifold (or on a suitably oriented pseudo-Riemannian manifold for the chosen signature).
