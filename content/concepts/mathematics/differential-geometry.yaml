    label: Contact manifold
    primaryDomain: differential-geometry
    domains:
      - differential-geometry
      - topology
    level: 9
    kind: structure
    summary: An odd-dimensional manifold with a maximally nonintegrable hyperplane distribution.
    carriers:
      - smooth manifold $M$
    data:
      - smooth hyperplane distribution $\xi\subset TM$
    axioms:
      - locally $\xi=\ker\alpha$ with $d\alpha|_\xi$ nondegenerate (equivalently $\alpha\wedge(d\alpha)^n$ nowhere zero)
    induces: []
    notes: A globally defined contact form is extra coorientation/trivialization data. The contact distribution is the intrinsic object.
    citations:
