  - id: hodge_star_operator
    label: Hodge star operator
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: differential-geometry
    domains:
      - differential-geometry
    level: 12
    kind: structure
    conceptType: Geometric operator
    summary: The metric- and orientation-dependent isomorphism between complementary-degree differential forms.
    citations:
      - wp-hodge_star_operator
      - nlab-hodge_star_operator
      - tong-em
      - tong-gr
    carriers:
      - oriented pseudo-Riemannian manifold $(M,g)$
    data:
      - linear maps $*\colon\Omega^k(M)\to\Omega^{n-k}(M)$
    axioms:
      - defined by $\alpha\wedge *\beta=\langle\alpha,\beta\rangle_g\,\mathrm{vol}_g$
    induces:
      - codifferential
      - Hodge Laplacian
