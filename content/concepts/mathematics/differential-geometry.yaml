    notes: Existence and uniqueness are consequences of the metric.
  - id: geodesic
    label: Geodesic
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: differential-geometry
    domains:
      - differential-geometry
    level: 13
    kind: structure
    conceptType: Geometric curve
