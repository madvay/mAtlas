  - id: continuous_map
    label: Continuous map
    primaryDomain: topology
    domains:
      - topology
      - set-theory
    level: 2
    kind: structure
    summary: A function between topological spaces whose inverse image of every open set is open.
    carriers:
      - topological spaces $X$ and $Y$
    data:
      - function $f\colon X\to Y$
    axioms:
      - $f^{-1}(V)$ is open in $X$ for every open $V\subseteq Y$
    induces: []
    notes: The inverse-image definition covers arbitrary topological spaces and is equivalent to the neighborhood formulation.
    citations:
      - wp-continuous-function
      - nlab-continuous-map
      - topology-without-tears
    primaryField: mathematics
    fields:
      - mathematics
  - id: homeomorphism
    label: Homeomorphism
    primaryDomain: topology
    domains:
      - topology
      - set-theory
    level: 3
    kind: structure
    summary: A bijective continuous map whose inverse is continuous, hence an isomorphism of topological spaces.
    carriers:
      - topological spaces $X$ and $Y$
    data:
      - bijection $f\colon X\to Y$
    axioms:
      - $f$ is continuous
      - $f^{-1}$ is continuous
    induces:
      - equality of topological invariants
    notes: A continuous bijection need not be a homeomorphism unless continuity of the inverse follows from additional hypotheses.
    citations:
      - wp-homeomorphism
      - nlab-homeomorphism
      - topology-without-tears
    primaryField: mathematics
    fields:
