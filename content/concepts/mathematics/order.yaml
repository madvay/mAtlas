nodes:
  - id: binary_relation
    label: Binary relation
    level: 1
    kind: structure
    summary: A relation from one set to another, represented by a subset of their Cartesian product.
    carriers:
      - source set $X$
      - target set $Y$
    data:
      - subset $R \subseteq X \times Y$
    axioms: []
    induces: []
    notes: Order, equivalence, accessibility, and well-foundedness use the endorelation specialization $X=Y$.
    citations:
      - wp-relation
      - gierz-order
    primaryDomain: order
    domains:
      - order
      - logic
      - set-theory
    primaryField: mathematics
    fields:
      - mathematics
  - id: equivalence_relation
    label: Equivalence relation
    level: 2
    kind: structure
    summary: A relation that partitions a set into equivalence classes.
    carriers:
      - set $X$
    data:
      - binary relation $\sim$
    axioms:
      - reflexive
      - symmetric
      - transitive
    induces:
      - quotient set $X/\sim$
    notes: ''
    citations:
      - wp-equivalence
      - nlab-equivalence-relation
      - gierz-order
    primaryDomain: order
    domains:
      - order
      - logic
    primaryField: mathematics
    fields:
      - mathematics
  - id: preorder
    label: Preorder
    level: 2
    kind: structure
    summary: A reflexive and transitive binary relation.
    carriers:
      - set $X$
    data:
      - binary relation $\le$
    axioms:
      - reflexive
      - transitive
    induces: []
    notes: ''
    citations:
      - wp-preorder
      - nlab-preorder
      - gierz-order
    primaryDomain: order
    domains:
      - order
    primaryField: mathematics
    fields:
      - mathematics
  - id: partial_order
    label: Partial order / poset
    level: 3
    kind: structure
    summary: A preorder in which mutual comparability forces equality.
    carriers:
      - set $X$
    data:
      - binary relation $\le$
    axioms:
      - reflexive
      - transitive
      - antisymmetric
    induces: []
    notes: ''
    citations:
      - wp-poset
      - nlab-partial-order
      - gierz-order
    primaryDomain: order
    domains:
      - order
      - combinatorics
    primaryField: mathematics
    fields:
      - mathematics
  - id: bounded_poset
    label: Bounded poset
    primaryDomain: order
    domains:
      - order
    level: 4
    kind: structure
    summary: A poset with a least element and a greatest element.
    carriers:
      - set $P$
    data:
      - partial order
      - bottom $\bot$
      - top $\top$
    axioms:
      - $\bot\le x\le\top$ for every $x$
    induces: []
    notes: Least and greatest elements, when they exist, are unique; boundedness is an existence property.
    citations:
      - wp-bounded-poset
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: directed_set
    label: Directed set
    primaryDomain: order
    domains:
      - order
      - topology
      - analysis
    level: 4
    kind: structure
    summary: A nonempty preorder in which every pair has a common upper bound.
    carriers:
      - set $D$
    data:
      - preorder
    axioms:
      - nonempty carrier
      - for any $x,y$ there is $z$ with $x\le z$ and $y\le z$
    induces: []
    notes: ''
    citations:
      - wp-directed-set
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: join_semilattice
    label: Join-semilattice
    primaryDomain: order
    domains:
      - order
      - algebra
    level: 4
    kind: structure
    summary: A poset in which every pair has a least upper bound.
    carriers:
      - set $L$
    data:
      - partial order; equivalently, a binary join operation
    axioms:
      - every pair has a join
    induces: []
    notes: ''
    citations:
      - wp-semilattice
      - nlab-join-semilattice
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: meet_semilattice
    label: Meet-semilattice
    primaryDomain: order
    domains:
      - order
      - algebra
    level: 4
    kind: structure
    summary: A poset in which every pair has a greatest lower bound.
    carriers:
      - set $L$
    data:
      - partial order; equivalently, a binary meet operation
    axioms:
      - every pair has a meet
    induces: []
    notes: ''
    citations:
      - wp-semilattice
      - nlab-meet-semilattice
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: total_order
    label: Total order
    level: 4
    kind: structure
    summary: A partial order in which every pair is comparable.
    carriers:
      - set $X$
    data:
      - binary relation $\le$
    axioms:
      - partial-order axioms
      - 'totality: $x \le y$ or $y \le x$'
    induces: []
    notes: ''
    citations:
      - wp-total-order
      - nlab-total-order
      - gierz-order
    primaryDomain: order
    domains:
      - order
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_ordered_group
    label: group + total order
    primaryDomain: order
    domains:
      - order
      - algebra
    level: 5
    kind: junction
    summary: Put a compatible total order on a group.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'Construction junction: it is a visual device, not a separate standard mathematical structure.'
    citations:
      - wp-ordered-group
      - nlab-ordered-group
      - gierz-order
    combination:
      inputs:
        - group
        - total_order
      compatibility: The order is invariant under translation by group elements.
      output: ordered_group
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_lattice
    label: meet + join
    primaryDomain: order
    domains:
      - order
      - algebra
    level: 5
    kind: junction
    summary: Combine compatible meet- and join-semilattice structure on one order.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'Construction junction: it is a visual device, not a separate standard mathematical structure.'
    citations:
      - wp-j-lattice
      - nlab-lattice
      - gierz-order
    combination:
      inputs:
        - meet_semilattice
        - join_semilattice
      compatibility: The meet and join are computed with respect to the same partial order.
      output: lattice
    primaryField: mathematics
    fields:
      - mathematics
  - id: well_order
    label: Well-order
    primaryDomain: order
    domains:
      - order
      - logic
      - number-theory
    level: 5
    kind: structure
    summary: A total order in which every nonempty subset has a least element.
    carriers:
      - set $W$
    data:
      - total order
    axioms:
      - well-ordering property
    induces: []
    notes: ''
    citations:
      - wp-well-order
      - nlab-well-order
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: dcpo
    label: Directed-complete partial order
    primaryDomain: order
    domains:
      - order
      - logic
    level: 6
    kind: structure
    summary: A poset in which every directed subset has a supremum.
    carriers:
      - poset $P$
    data: []
    axioms:
      - every directed subset has a least upper bound
    induces: []
    notes: ''
    citations:
      - wp-cpo
      - nlab-dcpo
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: lattice
    label: Lattice
    primaryDomain: order
    domains:
      - order
      - algebra
    level: 6
    kind: structure
    summary: A poset in which every pair has both a meet and a join.
    carriers:
      - set $L$
    data:
      - partial order; binary meet and join
    axioms:
      - meet and join are the greatest lower and least upper bounds
    induces: []
    notes: ''
    citations:
      - wp-j-lattice
      - nlab-lattice
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: ordered_group
    label: Totally ordered group
    primaryDomain: order
    domains:
      - order
      - algebra
    level: 6
    kind: structure
    summary: A group equipped with a translation-invariant total order.
    carriers:
      - set $G$
    data:
      - group structure
      - total order
    axioms:
      - $a\le b$ implies $xay\le xby$ for all $x,y$ (equivalently, left and right translations preserve order)
    induces: []
    notes: “Ordered group” can mean a partially ordered group in some literature. This node specifically means a totally ordered group.
    citations:
      - wp-ordered-group
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: bounded_lattice
    label: Bounded lattice
    primaryDomain: order
    domains:
      - order
      - algebra
    level: 7
    kind: structure
    summary: A lattice with a least and a greatest element.
    carriers:
      - set $L$
    data:
      - lattice structure
      - bottom $\bot$
      - top $\top$
    axioms:
      - $\bot$ and $\top$ bound every element
    induces: []
    notes: ''
    citations:
      - wp-bounded-lattice
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: distributive_lattice
    label: Distributive lattice
    primaryDomain: order
    domains:
      - order
      - algebra
    level: 7
    kind: structure
    summary: A lattice whose meet and join distribute over one another.
    carriers:
      - set $L$
    data:
      - lattice structure
    axioms:
      - both distributive laws
    induces: []
    notes: ''
    citations:
      - wp-distributive-lattice
      - nlab-distributive-lattice
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_lgroup
    label: group + lattice order
    primaryDomain: order
    domains:
      - order
      - algebra
    level: 7
    kind: junction
    summary: Compatibility construction producing Lattice-ordered group.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: All incoming branches are jointly required.
    citations:
      - wp-lattice-ordered-group
      - gierz-order
    combination:
      inputs:
        - group
        - lattice
      compatibility: Require left and right translations to preserve the lattice order.
      output: lattice_ordered_group
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_residuated
    label: lattice + monoid with residuals
    primaryDomain: order
    domains:
      - order
      - logic
      - algebra
    level: 7
    kind: junction
    summary: Compatibility construction producing Residuated lattice.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: All incoming branches are jointly required.
    citations:
      - wp-residuated-lattice
      - gierz-order
    combination:
      inputs:
        - lattice
        - monoid
      compatibility: Require monoid multiplication to be monotone and admit left and right residuals with respect to the order.
      output: residuated_lattice
    primaryField: mathematics
    fields:
      - mathematics
  - id: cpo
    label: Pointed CPO
    primaryDomain: order
    domains:
      - order
      - logic
    level: 7
    kind: structure
    summary: A directed-complete partial order with a least element.
    carriers:
      - dcpo $P$
    data:
      - least element $\bot$
    axioms:
      - $\bot\le x$ for every $x$
    induces: []
    notes: 'Terminology varies: some authors use CPO for a dcpo without requiring a least element; this atlas uses “pointed CPO”. The least element is unique if it exists.'
    citations:
      - wp-cpo
      - nlab-cpo
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_bounded_distributive
    label: bounded + distributive
    primaryDomain: order
    domains:
      - order
      - algebra
      - logic
    level: 8
    kind: junction
    summary: Combine bounds with distributive lattice laws.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'Construction junction: it is a visual device, not a separate standard mathematical structure.'
    citations:
      - wp-distributive-lattice
      - wp-bounded-lattice
      - gierz-order
    combination:
      inputs:
        - bounded_lattice
        - distributive_lattice
      compatibility: The bounds, meet, and join belong to the same lattice structure.
      output: bounded_distributive_lattice
    primaryField: mathematics
    fields:
      - mathematics
  - id: complete_lattice
    label: Complete lattice
    primaryDomain: order
    domains:
      - order
    level: 8
    kind: structure
    summary: A poset in which every subset has both a supremum and an infimum.
    carriers:
      - set $L$
    data:
      - partial order
    axioms:
      - all joins and meets exist
    induces: []
    notes: ''
    citations:
      - wp-complete-lattice
      - nlab-complete-lattice
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: lattice_ordered_group
    label: Lattice-ordered group
    primaryDomain: order
    domains:
      - order
      - algebra
    level: 8
    kind: structure
    summary: A group with a lattice order invariant under translations.
    carriers:
      - group $G$
      - lattice order $\le$
    data: []
    axioms:
      - multiplication preserves order
    induces: []
    notes: Every totally ordered group is lattice-ordered, but not conversely.
    citations:
      - wp-lattice-ordered-group
      - nlab-lattice-ordered-group
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: residuated_lattice
    label: Residuated lattice
    primaryDomain: order
    domains:
      - order
      - logic
      - algebra
    level: 8
    kind: structure
    summary: A lattice-ordered monoid whose multiplication has residuals.
    carriers:
      - lattice $L$
      - monoid structure
    data:
      - left and right residual operations
    axioms:
      - residuation equivalences
    induces: []
    notes: ''
    citations:
      - wp-residuated-lattice
      - nlab-residuated-lattice
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_ordered_ring
    label: ring + total order
    primaryDomain: order
    domains:
      - order
      - algebra
      - number-theory
    level: 8
    kind: junction
    summary: Put a compatible total order on a ring.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'Construction junction: it is a visual device, not a separate standard mathematical structure.'
    citations:
      - wp-ordered-ring
      - gierz-order
    combination:
      inputs:
        - ring
        - total_order
      compatibility: Addition preserves order and products of nonnegative elements are nonnegative.
      output: ordered_ring
    primaryField: mathematics
    fields:
      - mathematics
  - id: bounded_distributive_lattice
    label: Bounded distributive lattice
    primaryDomain: order
    domains:
      - order
      - algebra
      - logic
    level: 9
    kind: structure
    summary: A distributive lattice equipped with bottom and top.
    carriers:
      - set $L$
    data:
      - meet
      - join
      - bottom
      - top
    axioms:
      - bounded-lattice laws
      - distributive laws
    induces: []
    notes: ''
    citations:
      - wp-distributive-lattice
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: frame
    label: Frame / complete Heyting algebra
    primaryDomain: order
    domains:
      - order
      - logic
      - topology
      - category-theory
    level: 9
    kind: structure
    summary: A complete lattice in which finite meets distribute over arbitrary joins.
    carriers:
      - complete lattice $L$
    data: []
    axioms:
      - $a\wedge\bigvee S=\bigvee\{a\wedge s:s\in S\}$
    induces:
      - Heyting implication
    notes: ''
    citations:
      - wp-frame-order
      - nlab-frame
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: ordered_ring
    label: Ordered ring
    primaryDomain: order
    domains:
      - order
      - algebra
      - number-theory
    level: 9
    kind: structure
    summary: A ring whose total order is compatible with addition and multiplication.
    carriers:
      - set $R$
    data:
      - ring structure
      - total order
    axioms:
      - translation invariance
      - nonnegative products are nonnegative
    induces: []
    notes: ''
    citations:
      - wp-ordered-ring
      - nlab-ordered-ring
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: boolean_algebra
    label: Boolean algebra
    primaryDomain: order
    domains:
      - order
      - logic
      - algebra
    level: 10
    kind: structure
    summary: A bounded distributive lattice in which every element has a complement.
    carriers:
      - set $B$
    data:
      - meet
      - join
      - complement
      - '0'
      - '1'
    axioms:
      - bounded distributive laws
      - complement laws
    induces: []
    notes: ''
    citations:
      - wp-boolean-algebra
      - nlab-boolean-algebra
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: heyting_algebra
    label: Heyting algebra
    primaryDomain: order
    domains:
      - order
      - logic
      - algebra
    level: 10
    kind: structure
    summary: A bounded lattice with an implication operation right-adjoint to meet.
    carriers:
      - set $H$
    data:
      - meet
      - join
      - implication
      - '0'
      - '1'
    axioms:
      - $a\wedge b \le c$ exactly when $a \le (b\to c)$
    induces: []
    notes: ''
    citations:
      - wp-heyting-algebra
      - nlab-heyting-algebra
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: complete_boolean_algebra
    label: Complete Boolean algebra
    primaryDomain: order
    domains:
      - order
      - logic
      - algebra
    level: 11
    kind: structure
    summary: A Boolean algebra that is complete as a lattice.
    carriers:
      - set $B$
    data:
      - Boolean-algebra operations
    axioms:
      - arbitrary joins and meets exist
    induces: []
    notes: ''
    citations:
      - wp-boolean-algebra
      - wp-complete-lattice
      - nlab-complete-boolean-algebra
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_ordered_field
    label: field + total order
    primaryDomain: order
    domains:
      - order
      - algebra
      - number-theory
    level: 11
    kind: junction
    summary: Put a compatible total order on a field.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'Construction junction: it is a visual device, not a separate standard mathematical structure.'
    citations:
      - wp-ordered-field
      - gierz-order
    combination:
      inputs:
        - field
        - total_order
      compatibility: The field operations preserve the ordered-ring laws.
      output: ordered_field
    primaryField: mathematics
    fields:
      - mathematics
  - id: ordered_field
    label: Ordered field
    primaryDomain: order
    domains:
      - order
      - algebra
      - number-theory
    level: 12
    kind: structure
    summary: A field equipped with an order making it an ordered ring.
    carriers:
      - set $F$
    data:
      - field structure
      - total order
    axioms:
      - ordered-ring compatibility
    induces: []
    notes: ''
    citations:
      - wp-ordered-field
      - nlab-ordered-field
      - gierz-order
    primaryField: mathematics
    fields:
      - mathematics
  - id: monotone_map
    label: Monotone map
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: order
    domains:
      - order
      - category-theory
    level: 4
    kind: structure
    conceptType: Structure-preserving map
    summary: 'A function between partially ordered sets that preserves order: $x\le y$ implies $f(x)\le f(y)$.'
    citations:
      - gierz-order
      - riehl-category-context
  - id: galois_connection
    label: Galois connection
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: order
    domains:
      - order
      - category-theory
    level: 6
    kind: structure
    conceptType: Order adjunction
    summary: A pair of monotone maps $f:P\rightleftarrows Q:g$ for which $f(p)\le q$ exactly when $p\le g(q)$; each map determines a closure or interior operator by composition.
    citations:
      - gierz-order
      - riehl-category-context
edges:
  - id: order_poset_to_monotone_map
    source: partial_order
    target: monotone_map
    type: add-data
    label: choose ordered source and target
    detail: A map becomes monotone after specifying ordered domain and codomain and requiring that every order comparison in the domain is preserved in the codomain.
    citations:
      - gierz-order
  - id: order_monotone_map_to_galois_connection
    source: monotone_map
    target: galois_connection
    type: add-data
    label: pair with an order adjoint
    detail: A Galois connection adds a second monotone map in the reverse direction and the adjoint equivalence $f(p)\le q\Leftrightarrow p\le g(q)$.
    citations:
      - gierz-order
      - riehl-category-context
  - id: topology_equivalence_relation_to_quotient_space
    source: equivalence_relation
    target: quotient_space
    type: mathematical-formulation
    label: specifies identified points
    detail: The equivalence relation determines the quotient-set representatives; the topology is then the finest topology making the quotient map continuous.
    citations:
      - topology-without-tears
  - id: e_rel_equiv
    source: binary_relation
    target: equivalence_relation
    type: impose-axiom
    label: + reflexive, symmetric, transitive
    detail: First specialize to an endorelation $X=Y$; restrict to equivalence relations.
    citations:
      - wp-equivalence
      - gierz-order
  - id: e_relation_function
    source: binary_relation
    target: function
    type: impose-axiom
    label: + total and single-valued
    detail: Specialize to a relation $R\subseteq X\times Y$ that is total and single-valued in $X$; this is exactly a function $X\to Y$.
    citations:
      - wp-function
      - nlab-function
      - openlogic-set-theory
  - id: relation_to_modal_kripke
    source: binary_relation
    target: modal_kripke_model
    type: add-data
    label: add propositional valuation
    detail: Specialize to an endorelation on worlds, treat it as accessibility, and assign atomic propositions to worlds.
    citations:
      - wp-kripke-semantics
      - openlogic-model-theory
  - id: e_rel_preorder
    source: binary_relation
    target: preorder
    type: impose-axiom
    label: + reflexive, transitive
    detail: First specialize to an endorelation $X=Y$; restrict to reflexive and transitive relations.
    citations:
      - wp-preorder
      - gierz-order
  - id: e_relation_well_founded
    source: binary_relation
    target: well_founded_relation
    type: impose-axiom
    label: + well-foundedness
    detail: First specialize to an endorelation $X=Y$; require every nonempty subset to have a minimal element.
    citations:
      - wp-well-founded
      - nlab-well-founded
      - openlogic-set-theory
  - id: boolean_to_complete_boolean
    source: boolean_algebra
    target: complete_boolean_algebra
    type: impose-axiom
    label: require completeness
    detail: Require arbitrary joins and meets.
    citations:
      - wp-complete-lattice
      - gierz-order
  - id: boolean_to_modal
    source: boolean_algebra
    target: modal_algebra
    type: add-data
    label: add modal operator
    detail: Add a normal unary operator interpreting necessity.
    citations:
      - wp-modal-algebra
      - openlogic-model-theory
  - id: bounded_distributive_to_boolean
    source: bounded_distributive_lattice
    target: boolean_algebra
    type: impose-axiom
    label: + complements exist
    detail: Require every element to have a complement; distributivity makes it unique.
    citations:
      - wp-boolean-algebra
      - gierz-order
  - id: bounded_distributive_to_heyting
    source: bounded_distributive_lattice
    target: heyting_algebra
    type: impose-axiom
    label: + relative pseudocomplements exist
    detail: Require every meet map $a\wedge -$ to have a right adjoint $a\to -$.
    citations:
      - wp-heyting-algebra
      - gierz-order
  - id: bounded_lattice_to_bounded_poset
    source: bounded_lattice
    target: bounded_poset
    type: induced-forgotten
    label: forget meet and join operations
    detail: Retain the partial order with its least and greatest elements.
    citations:
      - wp-bounded-lattice
      - wp-bounded-poset
      - gierz-order
  - id: bounded_to_j_bounded_distributive
    source: bounded_lattice
