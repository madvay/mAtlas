nodes:
  - id: self_map
    label: Self-map
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
      - set-theory
    level: 3
    kind: structure
    conceptType: Endofunction
    summary: A function $f:X\to X$ whose domain and codomain are the same set. Iterating a self-map supplies the standard deterministic discrete-time evolution.
    citations:
      - wp-function
      - wp-math-dynamical-system
      - mit-ocw-nonlinear-dynamics
  - id: dynamical_system
    label: Dynamical system
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 4
    kind: structure
    conceptType: Time-evolution structure
    summary: A state space equipped with deterministic time evolution satisfying identity and composition laws. The time parameter may be discrete or continuous, and the maps may additionally be measurable, continuous, or smooth.
    citations:
      - wp-math-dynamical-system
      - mit-ocw-nonlinear-dynamics
  - id: discrete_time_dynamical_system
    label: Discrete-time dynamical system
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 5
    kind: structure
    conceptType: Dynamical-system class
    summary: A dynamical system whose evolution is indexed by integer time steps. A single self-map generates forward evolution by iteration; a two-sided integer action requires invertibility.
    citations:
      - wp-math-dynamical-system
      - mit-ocw-nonlinear-dynamics
  - id: continuous_time_dynamical_system
    label: Continuous-time dynamical system
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 5
    kind: structure
    conceptType: Dynamical-system class
    summary: A dynamical system with a real or nonnegative-real time parameter, usually with continuous dependence on time and state. A two-sided flow uses an $\mathbb R$-action; a forward semiflow uses $\mathbb R_{\ge 0}$.
    citations:
      - wp-math-dynamical-system
      - wp-math-flow
      - mit-ocw-nonlinear-dynamics
      - mit-ocw-nonlinear-dynamics
  - id: orbit_dynamics
    label: Orbit / trajectory
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 6
    kind: structure
    conceptType: State-evolution description
    summary: The states reached from an initial state under the time-evolution maps. An orbit records the evolution generated by one initial condition, not the entire dynamical system.
    citations:
      - wp-math-orbit-dynamics
      - wp-math-dynamical-system
      - mit-ocw-nonlinear-dynamics
      - mit-ocw-nonlinear-dynamics
  - id: invariant_set
    label: Invariant set
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 6
    kind: structure
    conceptType: Dynamical property
    summary: A subset preserved by the evolution. Forward invariance requires future images to remain inside the set; full invariance for invertible dynamics ordinarily requires equality under the evolution.
    citations:
      - wp-math-invariant
      - wp-math-dynamical-system
      - mit-ocw-nonlinear-dynamics
      - mit-ocw-nonlinear-dynamics
  - id: parameterized_dynamical_system
    label: Parameterized dynamical system
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 6
    kind: structure
    conceptType: Family of dynamical systems
    summary: A family of evolution laws indexed by one or more control parameters, with a fixed or coherently varying state space. Parameter variation makes structural changes such as bifurcations meaningful.
    citations:
      - wp-math-bifurcation-theory
      - mit-ocw-nonlinear-dynamics
  - id: fixed_point_dynamics
    label: Fixed point of a dynamical system
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 7
    kind: structure
    conceptType: Invariant orbit
    summary: A state unchanged by every evolution map. For a discrete system generated by $f$, it is a point $x$ with $f(x)=x$; for a flow, it is an equilibrium trajectory.
    citations:
      - wp-math-fixed-point
      - wp-math-dynamical-system
      - mit-ocw-nonlinear-dynamics
  - id: periodic_orbit
    label: Periodic orbit
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 7
    kind: structure
    conceptType: Recurrent orbit
    summary: An orbit that returns exactly after a nonzero period. In discrete time a periodic point satisfies $f^n(x)=x$ for some positive integer $n$; a fixed point is the period-one case.
    citations:
      - wp-math-periodic-orbit
      - wp-math-orbit-dynamics
      - mit-ocw-nonlinear-dynamics
  - id: measure_preserving_dynamical_system
    label: Measure-preserving dynamical system
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
      - measure
      - probability
    level: 7
    kind: structure
    conceptType: Measurable dynamical system
    summary: A measurable dynamical system equipped with a measure invariant under time evolution. For a transformation $T$, invariance means $\mu(T^{-1}A)=\mu(A)$ for every measurable set $A$.
    citations:
      - wp-math-measure-preserving-system
      - nlab-invariant-measure
      - mit-ocw-ergodic-theory
  - id: stability_dynamics
    label: Dynamical stability
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 8
    kind: structure
    conceptType: Dynamical property family
    summary: A family of properties describing how trajectories near an invariant state or set behave under small perturbations. Lyapunov, asymptotic, orbital, and structural stability are distinct notions.
    citations:
      - wp-math-stability-theory
      - mit-ocw-nonlinear-dynamics
  - id: ergodic_dynamical_system
    label: Ergodic dynamical system
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
      - measure
      - probability
    level: 8
    kind: structure
    conceptType: Measure-preserving dynamical-system class
    summary: A measure-preserving system in which every invariant measurable set has measure zero or full measure. Ergodic theorems then relate long-time averages to conditional or space averages under their stated integrability assumptions.
    citations:
      - wp-math-ergodic-theory
      - wp-math-measure-preserving-system
      - nlab-invariant-measure
      - mit-ocw-ergodic-theory
  - id: lyapunov_stability
    label: Lyapunov stability
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 9
    kind: structure
    conceptType: Stability criterion
    summary: An invariant state or set is Lyapunov stable when trajectories starting sufficiently close remain close for all future time. This condition alone does not require convergence toward the invariant set.
    citations:
      - wp-math-stability-theory
      - mit-ocw-nonlinear-dynamics
  - id: attractor
    label: Attractor
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 9
    kind: structure
    conceptType: Attracting invariant set
    summary: An invariant set approached by trajectories from a surrounding basin. Precise definitions differ over compactness, invariance, minimality, and the mode of convergence, so attraction is not identified with stability without further hypotheses.
    citations:
      - wp-math-attractor
      - mit-ocw-nonlinear-dynamics
  - id: bifurcation
    label: Bifurcation
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 9
    kind: structure
    conceptType: Structural change in dynamics
    summary: A qualitative change in invariant behavior or stability as a control parameter crosses a critical value. A smooth numerical change with no alteration of the phase portrait is not a bifurcation.
    citations:
      - wp-math-bifurcation-theory
      - mit-ocw-nonlinear-dynamics
  - id: lyapunov_exponent
    label: Lyapunov exponent
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
      - analysis
    level: 9
    kind: structure
    conceptType: Asymptotic growth rate
    summary: An asymptotic exponential rate for growth or contraction of infinitesimal perturbations along an orbit. Existence and multiplicity of exponents require differentiability and limiting or ergodic hypotheses.
    citations:
      - wp-math-lyapunov-exponent
      - scholarpedia-lyapunov-exponent
      - mit-ocw-nonlinear-dynamics
  - id: chaotic_dynamics
    label: Chaotic dynamics
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
    level: 10
    kind: structure
    conceptType: Dynamical-system class
    summary: Deterministic dynamics with strong aperiodic complexity, often involving sensitivity to initial conditions together with mixing, transitivity, dense periodic orbits, or positive entropy. These criteria are not mutually equivalent in full generality.
    citations:
      - wp-math-chaos-theory
      - wp-math-lyapunov-exponent
      - scholarpedia-lyapunov-exponent
      - mit-ocw-nonlinear-dynamics
  - id: hamiltonian_dynamical_system
    label: Hamiltonian dynamical system
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
      - differential-geometry
    level: 13
    kind: structure
    conceptType: Symplectic dynamical system
    summary: A symplectic manifold equipped with a Hamiltonian function whose Hamiltonian vector field generates the evolution. An autonomous Hamiltonian is conserved along its own flow, subject to the chosen sign convention.
    citations:
      - wp-math-hamiltonian-system
      - cambridge-classical-dynamics
      - mit-ocw-nonlinear-dynamics
  - id: smooth_flow
    label: Smooth flow
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: dynamical-systems
    domains:
      - dynamical-systems
      - differential-geometry
      - analysis
    level: 19
    kind: structure
    conceptType: Smooth continuous-time dynamical system
    summary: A smooth one-parameter family of diffeomorphisms satisfying the flow law. Differentiating at time zero gives a smooth vector field; conversely, a smooth vector field generates a local flow and a global flow when it is complete.
    citations:
      - wp-math-flow
      - wp-math-dynamical-system
      - mit-ocw-nonlinear-dynamics

edges:
  - id: dyn_self_map_to_discrete_system
    source: self_map
    target: discrete_time_dynamical_system
    type: representation-equivalence
    label: iteration as discrete evolution
    detail: A self-map generates an $\mathbb N$-action by iteration, and specifying such a forward discrete action is equivalent to specifying its one-step map. A $\mathbb Z$-action additionally requires an invertible map.
    citations:
      - wp-math-dynamical-system
      - mit-ocw-nonlinear-dynamics
  - id: dyn_system_to_discrete_system
    source: dynamical_system
    target: discrete_time_dynamical_system
    type: framework-specialization
    label: integer-indexed evolution
    detail: Discrete-time systems specialize the general evolution law to time indexed by $\mathbb N$ or, for reversible dynamics, $\mathbb Z$.
    citations:
      - wp-math-dynamical-system
      - mit-ocw-nonlinear-dynamics
  - id: dyn_system_to_continuous_system
    source: dynamical_system
    target: continuous_time_dynamical_system
    type: framework-specialization
    label: real-parameter evolution
    detail: Continuous-time systems specialize the time parameter to $\mathbb R$ or $\mathbb R_{\ge 0}$ and impose continuity or greater regularity as appropriate.
    citations:
      - wp-math-dynamical-system
      - wp-math-flow
  - id: dyn_continuous_system_to_smooth_flow
    source: continuous_time_dynamical_system
    target: smooth_flow
    type: framework-specialization
    label: smooth invertible evolution
    detail: A smooth flow is a continuous-time system on a smooth manifold whose time maps form a smooth one-parameter group of diffeomorphisms.
    citations:
      - wp-math-flow
      - mit-ocw-nonlinear-dynamics
  - id: dyn_system_to_orbit
    source: dynamical_system
    target: orbit_dynamics
    type: state-description
    label: trajectory from an initial state
    detail: Choosing an initial state and applying all allowed evolution maps produces its orbit; the orbit is a state-dependent description of the system.
    citations:
      - wp-math-orbit-dynamics
      - wp-math-dynamical-system
  - id: dyn_system_to_invariant_set
    source: dynamical_system
    target: invariant_set
    type: state-description
    label: dynamically preserved subset
    detail: Invariant subsets describe regions or structures that the evolution preserves, with forward and full invariance distinguished according to reversibility.
    citations:
      - wp-math-invariant
      - wp-math-dynamical-system
  - id: dyn_orbit_to_fixed_point
    source: orbit_dynamics
    target: fixed_point_dynamics
    type: classification
    label: stationary orbit
    detail: A fixed point is the orbit consisting of a single state unchanged by the evolution.
    citations:
      - wp-math-fixed-point
      - wp-math-orbit-dynamics
      - mit-ocw-nonlinear-dynamics
  - id: dyn_orbit_to_periodic_orbit
    source: orbit_dynamics
    target: periodic_orbit
    type: classification
    label: exactly recurring orbit
    detail: A periodic orbit is an orbit that returns exactly after a nonzero period; not every recurrent orbit is periodic.
    citations:
      - wp-math-periodic-orbit
      - wp-math-orbit-dynamics
      - mit-ocw-nonlinear-dynamics
  - id: dyn_system_to_parameterized_system
    source: dynamical_system
    target: parameterized_dynamical_system
    type: framework-specialization
    label: parameter-dependent family
    detail: A parameterized dynamical system refines the framework to a coherent family of evolution laws so their qualitative behavior can be compared.
    citations:
      - wp-math-bifurcation-theory
      - mit-ocw-nonlinear-dynamics
  - id: dyn_system_to_stability
    source: dynamical_system
    target: stability_dynamics
    type: state-description
    label: response to perturbations
    detail: Stability notions describe how nearby trajectories or perturbed systems behave relative to an invariant state, orbit, or set.
    citations:
      - wp-math-stability-theory
      - mit-ocw-nonlinear-dynamics
  - id: dyn_stability_to_lyapunov_stability
    source: stability_dynamics
    target: lyapunov_stability
    type: classification
    label: remain-close criterion
    detail: Lyapunov stability is the stability notion requiring sufficiently nearby initial states to remain nearby for all future time, without requiring attraction.
    citations:
      - wp-math-stability-theory
      - mit-ocw-nonlinear-dynamics
  - id: dyn_fixed_point_to_stability
    source: fixed_point_dynamics
    target: stability_dynamics
    type: state-description
    label: equilibrium stability
    detail: Stability theory classifies how trajectories near a fixed point behave; the fixed-point condition alone does not determine stability.
    citations:
      - wp-math-fixed-point
      - wp-math-stability-theory
      - mit-ocw-nonlinear-dynamics
  - id: dyn_periodic_orbit_to_stability
    source: periodic_orbit
    target: stability_dynamics
    type: state-description
    label: orbital stability
    detail: Periodic orbits can be analyzed for orbital or transverse stability; periodicity alone does not imply attraction or stability.
    citations:
      - wp-math-periodic-orbit
      - wp-math-stability-theory
      - mit-ocw-nonlinear-dynamics
  - id: dyn_invariant_set_to_attractor
    source: invariant_set
    target: attractor
    type: classification
    label: attracting invariant set
    detail: An attractor is an invariant set with a basin whose trajectories approach it under the selected definition of attraction.
    citations:
      - wp-math-attractor
      - wp-math-invariant
      - mit-ocw-nonlinear-dynamics
  - id: dyn_parameterized_system_to_bifurcation
    source: parameterized_dynamical_system
    target: bifurcation
    type: state-description
    label: qualitative parameter-induced change
    detail: A bifurcation records a qualitative change in invariant sets, stability, or phase portrait at a critical parameter value.
    citations:
      - wp-math-bifurcation-theory
      - mit-ocw-nonlinear-dynamics
  - id: dyn_system_to_measure_preserving_system
    source: dynamical_system
    target: measure_preserving_dynamical_system
    type: add-data
    label: invariant measure
    detail: Equip a measurable dynamical system with a chosen measure that is preserved by every evolution map; not every system admits the desired finite invariant measure.
    citations:
      - wp-math-measure-preserving-system
      - nlab-invariant-measure
      - mit-ocw-ergodic-theory
  - id: dyn_measure_preserving_to_ergodic
    source: measure_preserving_dynamical_system
    target: ergodic_dynamical_system
    type: impose-axiom
    label: trivial invariant measurable sets
    detail: Ergodicity imposes that every invariant measurable set has measure zero or full measure; measure preservation by itself is weaker.
    citations:
      - wp-math-ergodic-theory
      - nlab-invariant-measure
      - mit-ocw-ergodic-theory
  - id: dyn_smooth_flow_to_lyapunov_exponent
    source: smooth_flow
    target: lyapunov_exponent
    type: state-description
    label: tangent-growth rates
    detail: Derivatives of a smooth flow along an orbit define finite-time growth factors and, when the relevant limits exist, Lyapunov exponents.
    citations:
      - wp-math-lyapunov-exponent
      - scholarpedia-lyapunov-exponent
  - id: dyn_system_to_chaotic_dynamics
    source: dynamical_system
    target: chaotic_dynamics
    type: classification
    label: deterministic complex dynamics
    detail: Chaotic systems form classes of dynamical systems satisfying specified complexity criteria; the graph does not identify any one criterion as universally defining chaos.
    citations:
      - wp-math-chaos-theory
      - scholarpedia-lyapunov-exponent
      - mit-ocw-nonlinear-dynamics
  - id: dyn_continuous_to_hamiltonian_system
    source: continuous_time_dynamical_system
    target: hamiltonian_dynamical_system
    type: framework-specialization
    label: symplectic Hamiltonian flow
    detail: Hamiltonian systems specialize continuous dynamics by adding a symplectic state space and a Hamiltonian whose vector field generates the flow.
    citations:
      - wp-math-hamiltonian-system
      - cambridge-classical-dynamics
  - id: dyn_hamiltonian_system_to_hamiltonian_mechanics
    source: hamiltonian_dynamical_system
    target: hamiltonian_mechanics
    type: mathematical-formulation
    label: symplectic evolution formalism
    detail: Hamiltonian dynamical systems provide the mathematical phase-flow structure used by Hamiltonian mechanics; the physical interpretation and Hamiltonian are additional physical input.
    citations:
      - wp-math-hamiltonian-system
      - cambridge-classical-dynamics
  - id: dyn_continuous_system_to_unitary_evolution
    source: continuous_time_dynamical_system
    target: unitary_time_evolution
    type: mathematical-formulation
    label: one-parameter quantum evolution
    detail: Unitary quantum evolution is a special continuous-time action on quantum states, normally generated by a self-adjoint Hamiltonian; generic continuous dynamical systems need not be unitary or linear.
    citations:
      - wp-math-dynamical-system
      - tong-quantum
  - id: dyn_system_to_renormalization_group
    source: dynamical_system
    target: renormalization_group
    type: mathematical-formulation
    label: flow on theory or coupling space
    detail: Renormalization-group evolution is formulated as a scale-parameter flow of couplings or effective actions. This is a dynamical system in theory space, not ordinary time evolution of a material system.
    citations:
      - wp-math-dynamical-system
      - wp-physics-renormalization_group
      - tong-qft
  - id: dyn_ergodic_system_to_ergodic_hypothesis
    source: ergodic_dynamical_system
    target: ergodic_hypothesis
    type: mathematical-formulation
    label: measure-theoretic ergodicity
    detail: Measure-theoretic ergodicity supplies the precise invariant-set condition invoked by the physical ergodic hypothesis; actual equilibrium statistical mechanics does not require every microscopic system to be strictly ergodic.
    citations:
      - wp-math-ergodic-theory
      - wp-physics-ergodic-hypothesis
      - mit-ocw-ergodic-theory
      - tong-statistical-physics
  - id: dyn_hamiltonian_system_to_classical_statistical_mechanics
    source: hamiltonian_dynamical_system
    target: classical_statistical_mechanics
    type: mathematical-formulation
    label: microscopic phase-space dynamics
    detail: Hamiltonian flows supply the microscopic phase-space evolution used in classical statistical mechanics, including invariant Liouville measure; ensemble reasoning adds probabilistic and macroscopic structure.
    citations:
      - wp-math-hamiltonian-system
      - mit-ocw-ergodic-theory
      - tong-statistical-physics
  - id: dyn_continuous_system_to_nonequilibrium_statistical_mechanics
    source: continuous_time_dynamical_system
    target: nonequilibrium_statistical_mechanics
    type: mathematical-formulation
    label: time-dependent state evolution
    detail: Continuous dynamical evolution provides one mathematical language for nonequilibrium processes; stochastic processes and kinetic equations supply additional, non-equivalent formulations.
    citations:
      - wp-math-dynamical-system
      - wp-physics-nonequilibrium-thermodynamics
      - tong-statistical-physics
  - id: dynamical_system_to_biochemical_pathway
    source: dynamical_system
    target: biochemical_pathway
    type: mathematical-formulation
    label: formulates regulated pathway dynamics
    detail: Nonlinear dynamical systems formulate pathway models with conservation constraints, regulation, transport, and parameter uncertainty; stochastic and spatial descriptions are needed outside the deterministic well-mixed regime.
    citations:
      - wp-math-dynamical-system
      - wp-chem-biochemistry
      - ncbi-molecular-biology-cell
      - pubchem-docs
  - id: dynamical_system_to_chemical_reactor
    source: dynamical_system
    target: chemical_reactor
    type: mathematical-formulation
    label: formulates transient reactor behavior
    detail: Controlled nonlinear dynamical systems formulate reactor states, inputs, feedback, constraints, multiplicity, and instability once kinetic, flow, heat-transfer, and mass-transfer assumptions are specified.
    citations:
      - wp-math-dynamical-system
      - wp-chem-chemical-industry
      - doe-new-chemistry-roadmap
      - doe-catalysts
