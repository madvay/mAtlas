    label: category + simplicial diagram data
    primaryDomain: category-theory
    domains:
      - category-theory
      - homological-algebra
      - algebraic-topology
    level: 5
    kind: junction
    summary: Combine an ambient category with a degree-indexed family and compatible face/degeneracy morphisms.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: All incoming branches are jointly required.
    citations:
      - wp-cosimplicial-object
      - nlab-simplicial-object
      - stacks-simplicial-objects
      - riehl-category-context
    combination:
      inputs:
        - category
        - indexed_family
      compatibility: Every $X_{n}$ is an object of the same category $C$; add face and degeneracy morphisms in $C$ satisfying the simplicial identities.
      output: simplicial_object
