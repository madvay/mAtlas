    label: Simplicial object
    primaryDomain: category-theory
    domains:
      - category-theory
      - homological-algebra
      - algebraic-topology
    level: 6
    kind: structure
    summary: A contravariant functor from the simplex category $\Delta$ to a category.
    carriers:
      - category $C$
      - objects $X_{n}$ of $C$ for $n\ge 0$
    data:
      - face and degeneracy morphisms
    axioms:
      - simplicial identities
    induces: []
    notes: Equivalently, a functor $\Delta^{\mathrm{op}}\to C$. The ambient category is part of the specification.
