    primaryDomain: category-theory
    domains:
      - category-theory
      - algebra
      - homological-algebra
    level: 6
    kind: structure
    summary: An additive category with kernels and cokernels in which monomorphisms and epimorphisms are normal.
    carriers:
      - additive category $C$
    data:
      - kernels
      - cokernels
    axioms:
      - every monomorphism is a kernel
      - every epimorphism is a cokernel
    induces: []
    notes: ''
    citations:
