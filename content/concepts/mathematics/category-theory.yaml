  - id: j_cosimplicial_object
    label: category + cosimplicial diagram data
    primaryDomain: category-theory
    domains:
      - category-theory
      - homological-algebra
    level: 5
    kind: junction
    summary: Combine an ambient category with a degree-indexed family and compatible coface/codegeneracy morphisms.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: All incoming branches are jointly required.
    citations:
      - stacks-simplicial-objects
      - nlab-simplicial-object
      - wp-cosimplicial-object
      - riehl-category-context
    combination:
      inputs:
        - category
        - indexed_family
