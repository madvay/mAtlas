  - id: cosimplicial_object
    label: Cosimplicial object
    primaryDomain: category-theory
    domains:
      - category-theory
      - homological-algebra
    level: 6
    kind: structure
    summary: A covariant functor from the simplex category $\Delta$ to a category.
    carriers:
      - category $C$
      - objects $X^{n}$ of $C$ for $n\ge 0$
    data:
      - coface and codegeneracy morphisms
    axioms:
      - cosimplicial identities
    induces: []
    notes: Equivalently, a functor $\Delta\to C$. The ambient category is part of the specification.
    citations:
      - stacks-simplicial-objects
      - nlab-simplicial-object
      - wp-cosimplicial-object
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: enriched_category
    label: Enriched category
    primaryDomain: category-theory
    domains:
      - category-theory
    level: 6
    kind: structure
    summary: A collection of objects whose homs are objects of a monoidal category, with enriched composition and units.
    carriers:
      - object collection
      - monoidal base $V$
    data:
      - hom-objects in $V$
      - enriched composition
      - enriched units
    axioms:
      - enriched associativity and unit laws
    induces: []
    notes: An underlying ordinary category exists only when the enriching base supplies an appropriate way to extract hom-sets.
    citations:
      - wp-enriched-category
      - nlab-enriched-category
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_elementary_topos
    label: finite limits + exponentials
    primaryDomain: category-theory
    domains:
      - category-theory
      - logic
    level: 6
    kind: junction
    summary: Combine finite-limit and cartesian-closed structure, then add a subobject classifier.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'Construction junction: it is a visual device, not a separate standard mathematical structure.'
    citations:
      - wp-groth-topos
      - nlab-topos
      - riehl-category-context
    combination:
      inputs:
        - finitely_complete_category
        - cartesian_closed_category
      compatibility: The finite products used by the closed structure agree with those from finite limits; a subobject classifier is also supplied.
      output: elementary_topos
    primaryField: mathematics
    fields:
      - mathematics
