    label: Closed monoidal category
    primaryDomain: category-theory
    domains:
      - category-theory
      - logic
    level: 6
    kind: structure
    summary: A monoidal category in which tensoring has internal-hom right adjoints.
    carriers:
      - monoidal category $C$
    data:
      - internal $\operatorname{hom}$ objects
    axioms:
      - tensor–hom adjunction
    induces: []
    notes: ''
    citations:
      - wp-closed-monoidal
      - nlab-closed-monoidal
