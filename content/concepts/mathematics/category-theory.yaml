    fields:
      - mathematics
  - id: symmetric_monoidal_category
    label: Symmetric monoidal category
    primaryDomain: category-theory
    domains:
      - category-theory
      - algebra
    level: 6
    kind: structure
    summary: A braided monoidal category whose braiding is its own inverse.
    carriers:
      - braided monoidal category $C$
    data:
      - braiding
    axioms:
      - symmetry condition
    induces: []
    notes: ''
    citations:
      - wp-symmetric-category
      - nlab-symmetric-monoidal-category
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: elementary_topos
    label: Elementary topos
    primaryDomain: category-theory
    domains:
      - category-theory
      - logic
    level: 7
    kind: structure
    summary: A finitely complete cartesian closed category with a subobject classifier.
    carriers:
      - category $E$
    data:
      - finite limits
      - exponentials
      - subobject classifier
    axioms:
      - the defining universal properties
    induces:
      - An internal higher-order intuitionistic logic
    notes: ''
    citations:
      - wp-groth-topos
      - nlab-topos
      - stacks-topos
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: compact_closed_category
    label: Compact closed category
    primaryDomain: category-theory
    domains:
      - category-theory
      - logic
    level: 8
    kind: structure
    summary: A symmetric monoidal category in which every object is equipped with a dual and evaluation/coevaluation satisfying the snake identities.
    carriers:
      - symmetric monoidal category $C$
    data:
      - duals, evaluation, coevaluation
    axioms:
      - snake identities
    induces: []
    notes: Compact closure canonically determines duals and internal homs; for example, $[A,B]=A^*\otimes B$.
    citations:
      - wp-compact-closed
      - nlab-compact-closed
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: grothendieck_topos
    label: Grothendieck topos
    primaryDomain: category-theory
    domains:
      - category-theory
      - algebraic-geometry
      - logic
    level: 8
    kind: structure
    summary: A category equivalent to the category of sheaves on a site.
    carriers:
      - category $E$
    data: []
    axioms:
      - $E$ is equivalent to $\operatorname{Sh}(C,J)$ for some small site $(C,J)$
    induces: []
    notes: A site presents a Grothendieck topos, but is not itself the carrier of the topos; different sites can present equivalent topoi.
    citations:
      - stacks-topos
      - wp-groth-topos
      - nlab-topos
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: functor
    label: Functor
    primaryDomain: category-theory
    domains:
      - category-theory
    level: 4
    kind: structure
    summary: A mapping between categories that sends objects to objects and morphisms to morphisms while preserving identities and composition.
    carriers:
      - categories $\mathcal C,\mathcal D$
    data:
      - object assignment
      - morphism assignment
    axioms:
      - preserves identities
      - preserves composition
    induces:
      - Images of diagrams and morphisms
    notes: ''
    citations:
      - wp-functor
      - nlab-functor
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: natural_transformation
    label: Natural transformation
    primaryDomain: category-theory
    domains:
      - category-theory
    level: 5
    kind: structure
    summary: A morphism between functors whose components commute naturally with every morphism of the source category.
    carriers:
      - functors $F,G:\mathcal C\to\mathcal D$
    data:
      - component $\eta_X:F(X)\to G(X)$ for each object $X$
    axioms:
      - naturality squares commute
    induces:
      - Vertical and horizontal composition
    notes: ''
    citations:
      - wp-natural-transformation
      - nlab-natural-transformation
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: adjunction
    label: Adjunction
    primaryDomain: category-theory
    domains:
      - category-theory
    level: 6
    kind: structure
    summary: A pair of functors $F:\mathcal C\rightleftarrows\mathcal D:G$ equipped with natural bijections $\operatorname{Hom}(F X,Y)\cong\operatorname{Hom}(X,GY)$.
    carriers:
      - categories and two functors
    data:
      - unit and counit, or natural hom-set bijection
    axioms:
      - triangle identities
    induces:
      - Monads, universal constructions, and preservation theorems
    notes: ''
    citations:
      - wp-adjunction
      - nlab-adjunction
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: categorical_limit
    label: Categorical limit
    primaryDomain: category-theory
    domains:
      - category-theory
    level: 5
    kind: structure
    summary: A universal cone to a diagram, simultaneously generalizing products, equalizers, pullbacks, and inverse limits.
    carriers:
      - diagram $D:J\to\mathcal C$
    data:
      - cone with vertex $L$
    axioms:
      - terminal among cones
    induces:
      - Products, equalizers, and pullbacks
    notes: ''
    citations:
      - wp-finitely-complete-category
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: categorical_colimit
    label: Categorical colimit
    primaryDomain: category-theory
    domains:
      - category-theory
    level: 5
    kind: structure
    summary: A universal cocone from a diagram, simultaneously generalizing coproducts, coequalizers, pushouts, and direct limits.
    carriers:
      - diagram $D:J\to\mathcal C$
    data:
      - cocone with vertex $C$
    axioms:
      - initial among cocones
    induces:
      - Coproducts, coequalizers, and pushouts
    notes: ''
    citations:
      - wp-finitely-complete-category
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: representable_presheaf
    label: Representable presheaf
    primaryField: mathematics
    fields:
      - mathematics
    primaryDomain: category-theory
    domains:
      - category-theory
    level: 6
    kind: structure
    conceptType: Functorial representation
    summary: A presheaf naturally isomorphic to $\operatorname{Hom}_{\mathcal C}(-,c)$ for an object $c$ of a locally small category $\mathcal C$.
    citations:
      - riehl-category-context
      - stacks-categories
edges:
  - id: category_presheaf_to_representable_presheaf
    source: presheaf
    target: representable_presheaf
    type: classification
    label: represented by an object
    detail: Representable presheaves are the subclass of presheaves whose values and restriction maps are naturally isomorphic to hom-sets into one fixed representing object.
    citations:
      - riehl-category-context
  - id: category_small_category_to_representable_presheaf
    source: small_category
    target: representable_presheaf
    type: canonical-construction
    label: form a hom presheaf
    detail: Fixing an object $c$ of a small category canonically gives the contravariant hom-functor $\operatorname{Hom}_{\mathcal C}(-,c):\mathcal C^{\mathrm{op}}\to\mathbf{Set}$.
    citations:
      - riehl-category-context
  - id: abelian_category_to_derived_category
    source: abelian_category
    target: derived_category
    type: canonical-construction
    label: form $D(A)$
    detail: Form complexes in $A$, pass to the homotopy category $K(A)$, and localize at quasi-isomorphisms. The result is a new category, not an equivalent presentation of $A$.
    citations:
      - stacks-derived-category
      - stacks-derived-modules
      - wp-derived-category
      - nlab-derived-category
      - stacks-derived-text
  - id: abelian_to_exact_category
    source: abelian_category
    target: exact_category
    type: induced-forgotten
    label: take all short exact sequences
    detail: Every abelian category has a canonical Quillen exact structure consisting of all short exact sequences.
    citations:
      - nlab-abelian-category
      - stacks-abelian-category
      - wp-exact-category
      - nlab-exact-category
      - stacks-derived-text
  - id: e_abelian_groth
    source: abelian_category
    target: grothendieck_abelian_category
    type: impose-axiom
    label: + AB5 and generator
    detail: Require exact filtered colimits, small coproducts, and a generator.
    citations:
      - wp-grothendieck-category
      - nlab-grothendieck-category
      - stacks-derived-text
  - id: additive_to_abelian
    source: additive_category
    target: abelian_category
    type: impose-axiom
    label: require exact kernel/cokernel behavior
    detail: Require kernels and cokernels and normality of monomorphisms and epimorphisms.
    citations:
      - nlab-abelian-category
      - stacks-abelian-category
      - riehl-category-context
  - id: e_additive_exact
    source: additive_category
    target: exact_category
    type: add-data
    label: + conflations
    detail: Choose a class of kernel–cokernel pairs satisfying exact-category axioms.
    citations:
      - wp-exact-category
      - nlab-exact-category
      - stacks-derived-text
  - id: e_additive_triang
    source: additive_category
    target: triangulated_category
    type: add-data
    label: + shift and distinguished triangles
    detail: Add triangulated structure satisfying TR1–TR4.
    citations:
      - stacks-triangulated
      - wp-triangulated
      - nlab-triangulated
      - stacks-derived-text
  - id: braided_to_symmetric
    source: braided_monoidal_category
    target: symmetric_monoidal_category
    type: impose-axiom
    label: impose symmetry
    detail: Require double braiding to be the identity.
