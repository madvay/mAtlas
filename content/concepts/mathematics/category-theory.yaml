  - id: dagger_category
    label: Dagger category
    primaryDomain: category-theory
    domains:
      - category-theory
      - logic
    level: 5
    kind: structure
    summary: A category with an identity-on-objects involutive contravariant endofunctor.
    carriers:
      - category $C$
    data:
      - dagger $f\mapsto f^\dagger$
    axioms:
      - $(f^\dagger)^\dagger=f$
      - $(g\circ f)^\dagger=f^\dagger\circ g^\dagger$
    induces: []
    notes: ''
    citations:
      - wp-dagger-category
      - nlab-dagger-category
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: j_enriched_category
    label: objects + monoidal base
    primaryDomain: category-theory
    domains:
      - category-theory
    level: 5
    kind: junction
    summary: Supply an object collection and a monoidal category in which hom-objects, composition, and units will live.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: 'Construction junction: an enriched category is not generally an ordinary category with extra data.'
    citations:
      - wp-enriched-category
      - nlab-enriched-category
      - riehl-category-context
    combination:
      inputs:
        - set
        - monoidal_category
      compatibility: Choose a hom-object in the monoidal base for each ordered object pair, together with enriched composition and units satisfying enriched associativity and unit laws.
      output: enriched_category
    primaryField: mathematics
    fields:
      - mathematics
  - id: presheaf
    label: Presheaf
    primaryDomain: category-theory
    domains:
      - category-theory
      - algebraic-geometry
      - topology
    level: 5
    kind: structure
    summary: A Set-valued contravariant functor on a small category.
    carriers:
      - small category $C$
    data:
      - functor $F\colon C^{\mathrm{op}}\to\mathbf{Set}$
    axioms: []
    induces: []
    notes: This atlas uses the standard $\mathbf{Set}$-valued meaning so that the sheaf and sheaf-of-algebraic-objects branches are type-correct. Functors $C^{\mathrm{op}}\to D$ for a general category $D$ are $D$-valued presheaves.
    citations:
      - stacks-presheaf
      - wp-presheaf
      - nlab-presheaf
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
  - id: site
    label: Site
    primaryDomain: category-theory
    domains:
      - category-theory
      - algebraic-geometry
      - logic
    level: 5
    kind: structure
    summary: A category equipped with a Grothendieck topology or a pretopology of covering families.
    carriers:
      - small category $C$
    data:
      - covering sieves or covering families
    axioms:
      - identity/maximal coverings
      - pullback stability
      - transitivity or local character
    induces:
      - category of sheaves
    notes: This atlas uses sites small relative to the ambient universe. Large-site conventions require explicit universe management.
    citations:
      - stacks-sites
      - stacks-groth-topology
      - wp-site
      - nlab-site
      - riehl-category-context
    primaryField: mathematics
    fields:
