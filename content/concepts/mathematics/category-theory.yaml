nodes:
  - id: category
    label: Category
    primaryDomain: category-theory
    domains:
      - category-theory
    level: 3
    kind: structure
    summary: A collection of objects and morphisms with identities and associative composition; size is controlled by an ambient set-theoretic convention.
    carriers:
      - collection or class of objects
      - collection or class of morphisms
    data:
      - source and target
      - identity morphisms
      - composition of composable morphisms
    axioms:
      - associativity
      - left and right identity laws
    induces:
      - underlying directed graph or class-graph
    notes: “Category” does not by itself mean small. A separate Small category node records the set-sized case.
    citations:
      - wp-category
      - nlab-category
      - stacks-categories
      - riehl-category-context
    primaryField: mathematics
    fields:
      - mathematics
