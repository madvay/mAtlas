meta:
  title: Atlas of Fundamental Concepts
  # Content version must be updated on each change, fix for fixes, minor for content additions,
  # major for breaking schema change (i.e. content major == schema major version).
  version: 2.1.2
  description: A source-backed visual atlas connecting mathematics, physics, and fundamental chemistry from formal structures and physical law through chemical composition, bonding, reactivity, measurement, and radiochemical processes.
  direction: Smaller levels generally indicate less structure or composition; larger values generally indicate specialization, composition, effective description, collective organization, or emergence. Mathematics occupies the upper formal band. Physics and Chemistry share the lower scientific band. The order is ontological and structural, not pedagogical difficulty.
  scope: Mathematics; physics from classical and relativistic foundations through quantum, particle, nuclear, atomic, statistical, and condensed-matter organization; and chemistry from composition, atomic periodicity, molecular structure, thermodynamics, kinetics, measurement, inorganic and organic reactivity, electrochemistry, radiochemistry, and experimental evidence.
  license: Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)
  licenseUrl: https://creativecommons.org/licenses/by-sa/4.0/
  attribution: mAtlas - Copyright (c) 2026 Advay Mengle - https://atlas.madvay.com/
  sourceFormat: Split canonical YAML compiled deterministically to JSON for the browser bundle and published data assets.
  defaultField: mathematics
