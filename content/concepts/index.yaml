    description: Empirical theories and models of matter, energy, spacetime, interactions, and physical systems.
  - id: chemistry
    label: Chemistry
    shortLabel: Chemistry
    color: "#9a3412"
    order: 2
    path: chemistry
    description: Composition, structure, properties, measurement, and transformations of substances across molecular, material, biological, environmental, and industrial scales.
