layout: ../layout.yaml
removedDomains:
  - id: foundation
    path: math/foundation
    redirectTo: /math/
edgeTypes:
  - id: add-data
    label: Add data
    short: + data
    description: Equip an existing carrier or structured object with additional chosen data, when such compatible data exists. Use a construction junction when several independently meaningful inputs must coexist on the same carrier or interact compatibly.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: incoming
    color: "#2563eb"
    endpointLabels:
      source: Builds toward
      target: Built from
    lineStyle: solid
    defaultVisible: true
  - id: impose-axiom
    label: Impose axiom
    short: + axiom
    description: Keep the existing data and select the subclass satisfying an additional law, existence condition, finiteness condition, or other property.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: incoming
    color: "#7c3aed"
    endpointLabels:
      source: Builds toward
      target: Built from
    lineStyle: solid
    defaultVisible: true
  - id: induced-forgotten
    label: Induced / forgotten
    short: induce / forget
    description: Pass canonically from a stronger object to structure it determines, or forget part of the data while retaining a valid weaker structure. The carrier may change under a canonical induced construction.
    prerequisiteTraversal: outgoing
    enforcePredecessorLevel: none
    color: "#0f766e"
    endpointLabels:
      source: Yields by induction / forgetting
      target: Obtained by induction / forgetting from
    lineStyle: dashed
    defaultVisible: true
  - id: canonical-construction
    label: Canonical construction
    short: construct
    description: Apply a standard functorial or canonical construction whose output is not merely a reduct of the input and is not generally an equivalent presentation of the same object.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: none
    color: "#0369a1"
    endpointLabels:
      source: Canonically constructs
      target: Canonically constructed from
    lineStyle: dashed
    activeInDataset: true
    defaultVisible: true
  - id: quotient-construction
    label: Quotient construction
    short: quotient
    description: Identify elements by a stated equivalence relation and equip the quotient with the induced structure. The edge detail must state the representatives and equivalence relation.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: none
    color: "#0e7490"
    endpointLabels:
      source: Quotients to
      target: Obtained as quotient of
    lineStyle: dashed
    activeInDataset: true
    defaultVisible: true
  - id: canonical-embedding
    label: Canonical embedding
    short: embeds
    description: Map one structure injectively into another by the standard structure-preserving inclusion or representation. This records a canonical copy, not necessarily literal set containment.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: none
    color: "#1d4ed8"
    endpointLabels:
      source: Embeds canonically into
      target: Contains a canonical copy of
    lineStyle: solid
    activeInDataset: true
    defaultVisible: true
  - id: combine-compatible
    label: Combine compatible structures
    short: combine
    description: Feed several structures into a construction junction and impose compatibility between them.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: incoming
    color: "#b45309"
    endpointLabels:
      source: Builds toward
      target: Built from
    lineStyle: solid
    defaultVisible: true
  - id: representation-equivalence
    label: Representation / equivalence
    short: represent
    description: Reinterpret an object, pass to an equivalent presentation, or relate canonically corresponding structures; the carrier may change.
    prerequisiteTraversal: both
    enforcePredecessorLevel: none
    color: "#475569"
    endpointLabels:
      source: Representation / equivalence with
      target: Representation / equivalence with
    lineStyle: dotted
    activeInDataset: true
    defaultVisible: false
  - id: theorem-implication
    label: Theorem implication
    short: theorem
    description: Record a genuine theorem implication that is not part of the target definition; these edges may point toward a weaker structure.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: none
    color: "#be123c"
    endpointLabels:
      source: Implies by theorem
      target: Follows by theorem from
    lineStyle: dotted
    activeInDataset: true
    defaultVisible: false
  - id: mathematical-formulation
    label: Mathematical formulation
    short: formulates
    description: A mathematical structure supplies part of the formal language or state space used by a physical theory or model. This does not claim that the physical content follows from mathematics alone.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: none
    color: "#0e7490"
    endpointLabels:
      source: Mathematically formulates
      target: Mathematically formulated using
    lineStyle: dashed
    activeInDataset: true
    defaultVisible: true
  - id: framework-specialization
    label: Framework specialization
    short: specializes
    description: A more specific theory, model, entity class, or regime is obtained by restricting or extending the scope of a broader framework.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: incoming
    color: "#7c3aed"
    endpointLabels:
      source: Specializes to
      target: Special case or refinement of
    lineStyle: solid
    activeInDataset: true
    defaultVisible: true
  - id: quantization
    label: Quantization
    short: quantizes
    description: A classical system or field theory is used to construct a quantum theory through a stated quantization procedure. Quantization need not be unique and is not guaranteed to preserve every classical structure.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: incoming
    color: "#6d28d9"
    endpointLabels:
      source: Quantizes to
      target: Obtained by quantizing
    lineStyle: dashed
    activeInDataset: true
    defaultVisible: true
  - id: theory-component
    label: Theory component
    short: component
    description: The source supplies a substantive formal ingredient, dynamical sector, law, field content, or mechanism of the target theoretical framework.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: none
    color: "#475569"
    endpointLabels:
      source: Contributes to
      target: Contains theory component
    lineStyle: solid
    activeInDataset: true
    defaultVisible: true
  - id: describes-governs
    label: Describes / governs
    short: describes
    description: A theory, law, or interaction describes the behavior of the target within a stated regime. The edge detail must state important limits or qualifications.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: none
    color: "#2563eb"
    endpointLabels:
      source: Describes / governs
      target: Described / governed by
    lineStyle: solid
    activeInDataset: true
    defaultVisible: true
  - id: composition
    label: Physical constitution / realization
    short: constitutes
    description: The source is a material constituent, structural component, or underlying quantum field whose excitation realizes the target physical system or particle. The edge label and detail must distinguish composition from field excitation; neither implies a simple classical sum of parts.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: incoming
    color: "#b45309"
    endpointLabels:
      source: Constitutes / realizes
      target: Constituted / realized by
    lineStyle: solid
    activeInDataset: true
    defaultVisible: true
  - id: classification
    label: Classification
    short: classifies
    description: The target is a member or subtype of the broader source class.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: incoming
    color: "#64748b"
    endpointLabels:
      source: Has subtype
      target: Classified as
    lineStyle: dotted
    activeInDataset: true
    defaultVisible: true
  - id: couples-interacts
    label: Physical interaction / binding
    short: interacts
    description: The source field, particle, charge, current, or interaction couples to, acts on, binds, forms, or stabilizes the target in the stated regime. The edge label and detail must identify the exact coupling, interaction, or binding claim and its qualifications.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: none
    color: "#dc2626"
    endpointLabels:
      source: Interacts with / binds
      target: Interacts with / bound by
    lineStyle: solid
    activeInDataset: true
    defaultVisible: true
  - id: mathematical-limit
    label: Limit / controlled approximation
    short: limit / approx
    description: The target is recovered from the source either in a stated mathematical or asymptotic limit, or through a quantitatively controlled approximation with identified small parameters or omitted terms. The edge label and detail must state which case applies and its regime of validity.
    prerequisiteTraversal: outgoing
    enforcePredecessorLevel: incoming
    color: "#0f766e"
    endpointLabels:
      source: Has limiting / approximate regime
      target: Recovered by limit / approximation
    lineStyle: dotted
    activeInDataset: true
    defaultVisible: true
  - id: effective-theory
    label: Effective theory / model
    short: effective
    description: The target retains the degrees of freedom and interactions relevant below a stated scale or within a stated regime, while higher-energy or unresolved degrees of freedom from the source are integrated out, coarse-grained, or encoded in effective couplings.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: incoming
    color: "#047857"
    endpointLabels:
      source: Has effective description
      target: Effective description of
    lineStyle: dashed
    activeInDataset: true
    defaultVisible: true
  - id: model-realization
    label: Model / approximation method
    short: model / method
    description: The target is a model, idealization, restricted ansatz, approximation scheme, phenomenological fit, or historical representation used for the source system or theory. It need not have a universal small error parameter and is not thereby a controlled limit or effective theory. The edge label and detail must identify the precise status.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: incoming
    color: "#4f46e5"
    endpointLabels:
      source: Has model / approximation
      target: Model / approximation of
    lineStyle: dashed
    activeInDataset: true
    defaultVisible: true
  - id: emergence
    label: Emergent / collective behavior
    short: emerges
    description: The target is a collective, organizational, or scale-dependent phenomenon of the source constituents and interactions; it is not a mere list or classical sum of constituents.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: incoming
    color: "#15803d"
    endpointLabels:
      source: Gives rise collectively to
      target: Emerges from
    lineStyle: dashed
    activeInDataset: true
    defaultVisible: true
  - id: state-description
    label: State / property description
    short: state
    description: The target represents a state, property, observable, or state-dependent description associated with the source system or theory.
    prerequisiteTraversal: outgoing
    enforcePredecessorLevel: none
    color: "#9333ea"
    endpointLabels:
      source: Has state / property description
      target: State / property description of
    lineStyle: dotted
    activeInDataset: true
    defaultVisible: true
  - id: transformation-process
    label: Transformation / process
    short: transforms
    description: A physical process transforms the source into, or produces, the target under the conditions stated in the edge detail.
    prerequisiteTraversal: incoming
    enforcePredecessorLevel: none
    color: "#0891b2"
    endpointLabels:
      source: Can transform into / produce
      target: Produced or reached from
    lineStyle: dashed
    activeInDataset: true
    defaultVisible: true
  - id: historically-motivated
    label: Historically motivated
    short: motivated
    description: The source experiment, observation, anomaly, or problem materially motivated the development, revision, or acceptance of the target concept. Historical influence is not logical derivation; the edge detail states the documented role and avoids retrospective origin myths.
    prerequisiteTraversal: both
    enforcePredecessorLevel: incoming
    color: "#be123c"
    endpointLabels:
      source: Historically motivated
      target: Historically motivated by
    lineStyle: dashed
    activeInDataset: true
    defaultVisible: true
  - id: experimentally-verified-by
    label: Experimentally tested / supported by
    short: tested by
    description: The source theory, law, entity, prediction, or structural claim is directly tested, supported, constrained, or established by the target experiment or observation. Experimental support is not final logical proof; the edge detail states exactly what was measured.
    prerequisiteTraversal: both
    enforcePredecessorLevel: incoming
    color: "#7e22ce"
    endpointLabels:
      source: Experimentally tested / supported by
      target: Tests / supports
    lineStyle: solid
    activeInDataset: true
    defaultVisible: true
sources: sources.yaml
