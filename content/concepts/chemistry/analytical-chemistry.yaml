edges:
- id: chem_analytical_chemistry_to_qualitative_chemical_analysis_classification
  source: analytical_chemistry
  target: qualitative_chemical_analysis
  type: classification
  label: includes identification
  detail: Qualitative analysis identifies chemical presence or structure under stated specificity and detection limits.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_analytical_chemistry_to_quantitative_chemical_analysis_classification
  source: analytical_chemistry
  target: quantitative_chemical_analysis
  type: classification
  label: includes amount estimation
  detail: Quantitative analysis estimates an amount or composition and its uncertainty.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_chemical_measurement_to_quantitative_chemical_analysis_theory_component
  source: chemical_measurement
  target: quantitative_chemical_analysis
  type: theory-component
  label: supplies calibrated observations
  detail: Quantitative analysis combines a measurement model, calibration, sample preparation, and uncertainty evaluation.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_chemical_sampling_to_quantitative_chemical_analysis_theory_component
  source: chemical_sampling
  target: quantitative_chemical_analysis
  type: theory-component
  label: controls representativeness
  detail: Sampling variance and bias can dominate instrumental precision when the sampled material is heterogeneous.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_chemical_reference_material_to_metrological_traceability_chemistry_theory_component
  source: chemical_reference_material
  target: metrological_traceability_chemistry
  type: theory-component
  label: provides characterized reference
  detail: Certified or otherwise characterized reference materials can anchor calibration and validation chains.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_analytical_chemistry_to_separation_science_classification
  source: analytical_chemistry
  target: separation_science
  type: classification
  label: includes separative analysis
  detail: Separation can isolate analytes, remove interference, or provide time-resolved identification.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_separation_science_to_chromatography_classification
  source: separation_science
  target: chromatography
  type: classification
  label: includes phase-distribution methods
  detail: Chromatography is a central separation-science family based on differential migration.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_chromatography_to_gas_chromatography_classification
  source: chromatography
  target: gas_chromatography
  type: classification
  label: gas mobile phase
  detail: Gas chromatography specializes chromatography to gaseous transport and volatile analytes.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_chromatography_to_liquid_chromatography_classification
  source: chromatography
  target: liquid_chromatography
  type: classification
  label: liquid mobile phase
  detail: Liquid chromatography covers modes differentiated by stationary phase and retention mechanism.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_analytical_chemistry_to_mass_spectrometry_classification
  source: analytical_chemistry
  target: mass_spectrometry
  type: classification
  label: includes mass-to-charge analysis
  detail: Mass spectrometry supports elemental, molecular, isotopic, and structural analysis through ion measurements.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_analytical_chemistry_to_spectrophotometry_classification
  source: analytical_chemistry
  target: spectrophotometry
  type: classification
  label: includes optical quantitation
  detail: Spectrophotometry converts calibrated wavelength-dependent optical responses into chemical information.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_analytical_chemistry_to_titration_classification
  source: analytical_chemistry
  target: titration
  type: classification
  label: includes stoichiometric volumetry
  detail: Titrations infer analyte amount from reagent amount at a modeled equivalence condition.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_analytical_chemistry_to_x_ray_crystallography_classification
  source: analytical_chemistry
  target: x_ray_crystallography
  type: classification
  label: includes diffraction structure analysis
  detail: Crystallography infers atomic arrangements from reciprocal-space intensities and a constrained structural model.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_tsvet_chromatography_experiments_to_chromatography_historically_motivated
  source: tsvet_chromatography_experiments
  target: chromatography
  type: historically-motivated
  label: separated pigment bands
  detail: Tsvet’s column separations supplied the named prototype for chromatography and demonstrated differential adsorption and migration.
  citations:
  - wp-chem-tsvet
  - acs-chromatography-landmark
- id: chem_bragg_xray_diffraction_experiments_to_x_ray_crystallography_historically_motivated
  source: bragg_xray_diffraction_experiments
  target: x_ray_crystallography
  type: historically-motivated
  label: diffraction converted to structure
  detail: Bragg’s relation and early structure solutions made crystal diffraction an operational atomic-structure method.
  citations:
  - wp-chem-bragg-law
  - nobel-bragg-1915
- id: chem_mass_spectrometry_to_aston_mass_spectrograph_measurements_experimentally_verified_by
  source: mass_spectrometry
  target: aston_mass_spectrograph_measurements
  type: experimentally-verified-by
  label: mass-resolved isotope beams
  detail: Aston’s positive-ray mass spectrograph demonstrated chemically consequential isotopic mass patterns and the analytical power of mass-to-charge
    separation.
  citations:
  - wp-chem-mass-spectrometry
  - nobel-aston
- id: chem_mass_spectrometry_to_ion_transformation_process
  source: mass_spectrometry
  target: ion
  type: transformation-process
  label: creates gas-phase ions for analysis
  detail: A mass-spectrometric workflow ionizes analyte species before separating and detecting the resulting gas-phase ions; the ionization method can fragment, adduct, or otherwise alter what is observed.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_analytical_chemistry_to_cyclic_voltammetry_classification
  source: analytical_chemistry
  target: cyclic_voltammetry
  type: classification
  label: includes potential-sweep electroanalysis
  detail: Cyclic voltammetry is an electroanalytical method within analytical chemistry, combining controlled potential
    scans with current measurement and transport-aware interpretation.
  citations:
  - wp-chem-electrochemistry
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_quantitative_chemical_analysis_to_calibration_curve_model_realization
  source: quantitative_chemical_analysis
  target: calibration_curve
  type: model-realization
  label: modeled by a validated response relation
  detail: A calibration curve is a response-to-quantity model used in quantitative analysis; its form, range, standards,
    residuals, uncertainty, matrix effects, and drift must be validated.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_quantitative_chemical_analysis_to_concentration_state_description
  source: quantitative_chemical_analysis
  target: concentration
  type: state-description
  label: reports concentration as a measurand
  detail: Quantitative analysis can report concentration only with the measurand, amount basis, sample preparation,
    calibration, matrix, uncertainty, and traceability stated explicitly.
  citations:
  - wp-chem-solution
  - openstax-chemistry-2e
  - iupac-solubility-data
  - iupac-gold-book
- id: chem_quantitative_chemical_analysis_to_measurement_uncertainty_chemistry_state_description
  source: quantitative_chemical_analysis
  target: measurement_uncertainty_chemistry
  type: state-description
  label: qualified by a measurement-uncertainty model
  detail: A quantitative result is qualified by uncertainty for a defined measurand and coverage statement, incorporating
    identified calibration, sampling, preparation, model, repeatability, and other contributions.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
- id: chem_qualitative_chemical_analysis_to_detection_limit_state_description
  source: qualitative_chemical_analysis
  target: detection_limit
  type: state-description
  label: assigned a procedure-specific detection capability
  detail: A qualitative procedure has a detection capability defined through an explicit decision rule, error rates,
    blank distribution, matrix, method, and operating conditions rather than one universal instrument number.
  citations:
  - wp-chem-analytical-chemistry
  - iupac-orange-book
  - nist-chemistry-webbook
