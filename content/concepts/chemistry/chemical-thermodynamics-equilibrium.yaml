  source: standard_state_chemistry
  target: chemical_potential
  type: state-description
  label: sets reference chemical potential
  detail: Standard chemical potentials and activities require an explicit standard-state convention.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
- id: chem_enthalpy_to_reaction_enthalpy_state_description
  source: enthalpy
  target: reaction_enthalpy
  type: state-description
  label: reaction-state difference
  detail: Reaction enthalpy is a stoichiometric difference of state enthalpies at specified conditions.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
- id: chem_hess_law_to_reaction_enthalpy_describes_governs
  source: hess_law
  target: reaction_enthalpy
  type: describes-governs
  label: makes thermochemical sums path independent
  detail: Hess cycles compute a reaction enthalpy by adding measured or tabulated state-function changes.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
- id: chem_law_mass_action_to_chemical_equilibrium_describes_governs
  source: law_mass_action
  target: chemical_equilibrium
  type: describes-governs
  label: activity condition for equilibrium
  detail: Thermodynamic mass action expresses equilibrium through activities; kinetic mass action is exact for elementary steps and model-dependent
    for overall reactions.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
- id: chem_chemical_equilibrium_to_equilibrium_constant_state_description
  source: chemical_equilibrium
  target: equilibrium_constant
  type: state-description
  label: has activity-ratio constant
  detail: At fixed temperature, the equilibrium activity quotient for a specified reaction equals its equilibrium constant.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
- id: chem_gibbs_energy_to_chemical_equilibrium_describes_governs
  source: gibbs_energy
  target: chemical_equilibrium
  type: describes-governs
  label: minimum under constraints
  detail: Stable equilibrium minimizes the appropriate Gibbs energy subject to material, charge, and phase constraints at fixed temperature and
    pressure.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
- id: chem_le_chatelier_principle_to_chemical_equilibrium_describes_governs
  source: le_chatelier_principle
  target: chemical_equilibrium
  type: describes-governs
  label: qualitative perturbation response
  detail: The principle summarizes the direction of many stable-equilibrium responses but can mislead when constraints or coupled reactions are
    left unstated.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
- id: chem_gibbs_phase_rule_to_chemical_phase_diagram_describes_governs
  source: gibbs_phase_rule
  target: chemical_phase_diagram
  type: describes-governs
  label: constrains coexistence dimensions
  detail: The phase rule predicts the dimensionality of single- and multiphase regions after components and constraints are counted.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
- id: chem_guldberg_waage_reaction_studies_to_law_mass_action_historically_motivated
  source: guldberg_waage_reaction_studies
  target: law_mass_action
  type: historically-motivated
  label: quantitative reversible-reaction patterns
  detail: Their analysis of reaction data helped move chemical affinity toward a mathematical concentration-dependent law, before modern activity
    thermodynamics.
  citations:
  - wp-chem-mass-action
  - iupac-gold-book
- id: chem_hess_law_to_hess_thermochemical_measurements_experimentally_verified_by
  source: hess_law
  target: hess_thermochemical_measurements
  type: experimentally-verified-by
  label: path-independent heat sums
  detail: Agreement of direct and staged thermochemical measurements supported the state-function relation now called Hess’s law.
  citations:
  - wp-chem-hess-law
  - openstax-chemistry-2e
- id: chem_standard_state_chemistry_to_equilibrium_constant_theory_component
  source: standard_state_chemistry
  target: equilibrium_constant
  type: theory-component
  label: defines dimensionless reference
  detail: A thermodynamic equilibrium constant uses activities relative to specified standard states and is dimensionless under the adopted convention.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
