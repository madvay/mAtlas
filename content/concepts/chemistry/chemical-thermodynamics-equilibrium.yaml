  source: chemical_potential
  target: chemical_activity
  type: mathematical-formulation
  label: defines effective composition
  detail: Activity expresses chemical potential relative to a standard state through a logarithmic relation at specified temperature and pressure.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
