- id: chem_enthalpy_to_chemical_thermodynamics_theory_component
  source: enthalpy
  target: chemical_thermodynamics
  type: theory-component
  label: supplies a pressure-adapted state function
  detail: Enthalpy supplies chemical thermodynamics with a state function useful for constant-pressure heat effects and flowing material, without identifying heat itself as a state function.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
- id: chem_chemical_potential_to_chemical_thermodynamics_theory_component
  source: chemical_potential
  target: chemical_thermodynamics
  type: theory-component
  label: supplies component-wise thermodynamic driving forces
  detail: Chemical potentials supply chemical thermodynamics with component-wise driving forces for diffusion, phase transfer, and reaction in multicomponent systems.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
- id: chem_gibbs_energy_to_chemical_thermodynamics_theory_component
  source: gibbs_energy
  target: chemical_thermodynamics
  type: theory-component
  label: supplies the fixed-$T,p$ potential
  detail: Gibbs energy supplies chemical thermodynamics with a natural potential for many closed-system laboratory processes at controlled temperature and pressure, subject to the stated constraints.
  citations:
  - wp-chem-chemical-thermodynamics
  - openstax-chemistry-2e
  - iupac-green-book
  - nist-chemistry-webbook
