  source: electrolytic_cell
  target: electrolysis
  type: theory-component
  label: supplies driven electrode and electrolyte interfaces
  detail: An electrolytic cell supplies electrodes, electrolyte, separators, geometry, and an external potential
    for electrolysis; current efficiency, mass transport, overpotential, and side reactions control conversion.
  citations:
  - wp-chem-electrochemistry
  - openstax-chemistry-2e
  - iupac-gold-book
