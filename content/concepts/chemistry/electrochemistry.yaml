  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_electrode_to_electrochemical_double_layer_state_description
  source: electrode
  target: electrochemical_double_layer
  type: state-description
  label: develops interfacial charge organization
  detail: An electrode in contact with an electrolyte develops a potential- and composition-dependent double layer
    involving electronic charge, solvent orientation, diffuse ions, and possible specific adsorption.
  citations:
  - wp-chem-electrochemistry
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_electrode_to_overpotential_state_description
  source: electrode
  target: overpotential
  type: state-description
  label: assigned a departure from equilibrium potential
  detail: An operating electrode has an overpotential relative to a defined equilibrium potential; charge transfer,
    mass transport, resistance, bubbles, area, and reference placement can all contribute.
  citations:
  - wp-chem-electrochemistry
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_electrode_potential_to_electrochemistry_theory_component
  source: electrode_potential
  target: electrochemistry
  type: theory-component
  label: supplies an interfacial thermodynamic coordinate
  detail: Electrode-potential conventions supply a central coordinate for electrochemistry, but only potential differences
    relative to a reference are measured and kinetics or transport require additional variables.
  citations:
  - wp-chem-electrochemistry
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_electrochemical_cell_to_gibbs_energy_state_description
  source: electrochemical_cell
  target: gibbs_energy
  type: state-description
  label: assigned a reaction Gibbs-energy change
  detail: An electrochemical cell reaction has a Gibbs-energy change related reversibly to cell potential under
    stated temperature, pressure, activities, electron count, and sign conventions; losses reduce operating voltage.
  citations:
  - wp-chem-electrochemistry
  - openstax-chemistry-2e
  - iupac-gold-book
