  target: adsorption
  type: couples-interacts
  label: couples charge with specific ion uptake
  detail: Double-layer structure can include specifically adsorbed ions and molecules beyond diffuse electrostatic screening.
  citations:
  - wp-chem-electrochemistry
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_redox_reaction_to_cyclic_voltammetry_experimentally_verified_by
  source: redox_reaction
  target: cyclic_voltammetry
