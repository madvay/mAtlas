edges:
- id: chem_radiochemistry_to_radionuclide_chemistry_describes_governs
  source: radiochemistry
  target: radionuclide_chemistry
  type: describes-governs
  label: describes radioactive nuclides through chemical identity
  detail: Radiochemistry follows chemical identity and speciation while nuclear state and decay determine radioactive behavior.
  citations:
  - wp-chem-radiochemistry
  - iaea-neutron-activation-analysis
  - iupac-gold-book
- id: chem_radionuclide_chemistry_to_radioactive_decay_state_description
  source: radionuclide_chemistry
  target: radioactive_decay
  type: state-description
  label: has characteristic decay modes
  detail: A radionuclide is characterized in part by its decay modes, half-life, nuclear state, and daughter products.
  citations:
  - wp-chem-radiochemistry
  - iaea-neutron-activation-analysis
  - iupac-gold-book
- id: chem_radiochemistry_to_radiation_chemistry_classification
  source: radiochemistry
  target: radiation_chemistry
  type: classification
  label: includes radiation-induced reactions
  detail: Radiation chemistry examines chemical change caused by energy deposited by ionizing radiation.
  citations:
  - wp-chem-radiochemistry
  - iaea-neutron-activation-analysis
  - iupac-gold-book
- id: chem_radiochemistry_to_neutron_activation_analysis_classification
  source: radiochemistry
  target: neutron_activation_analysis
  type: classification
  label: includes activation measurement
  detail: Activation analysis combines nuclear production of radionuclides with radiochemical or instrumental measurement.
  citations:
  - wp-chem-radiochemistry
  - iaea-neutron-activation-analysis
  - iupac-gold-book
- id: chem_radionuclide_chemistry_to_radiometric_dating_theory_component
  source: radionuclide_chemistry
  target: radiometric_dating
  type: theory-component
  label: supplies nuclidic decay clock
  detail: Radiometric dating applies a decay and material-history model to radionuclide measurements; radioactivity alone does not guarantee a
    valid date.
  citations:
  - wp-chem-radiochemistry
  - iaea-neutron-activation-analysis
  - iupac-gold-book
- id: chem_radiometric_dating_to_radiocarbon_dating_classification
  source: radiometric_dating
  target: radiocarbon_dating
  type: classification
  label: includes carbon-14 chronometry
  detail: Radiocarbon dating is a specialized radiometric method for carbon-exchanging materials over its finite age range.
  citations:
  - wp-chem-radiochemistry
  - iaea-neutron-activation-analysis
  - iupac-gold-book
- id: chem_actinide_separation_to_nuclear_fuel_cycle_chemistry_theory_component
  source: actinide_separation
  target: nuclear_fuel_cycle_chemistry
  type: theory-component
  label: controls actinide streams
  detail: Fuel-cycle options use selective actinide and fission-product chemistry under radiation, criticality, waste, and safeguards constraints.
  citations:
  - wp-chem-radiochemistry
  - iaea-neutron-activation-analysis
  - iupac-gold-book
- id: chem_curie_radium_separation_measurements_to_radiochemistry_historically_motivated
  source: curie_radium_separation_measurements
  target: radiochemistry
  type: historically-motivated
  label: activity-guided chemical fractionation
  detail: The Curies’ use of radioactivity to guide chemical separation demonstrated that nuclear signatures could reveal trace chemical species
    and helped establish radiochemistry.
  citations:
  - wp-chem-curie-radium
  - nobel-curie-1911
- id: chem_soddy_isotope_displacement_evidence_to_radionuclide_chemistry_historically_motivated
  source: soddy_isotope_displacement_evidence
  target: radionuclide_chemistry
  type: historically-motivated
  label: chemically identical radioactive forms
  detail: Decay-series evidence required nuclides with different masses and radioactivities to occupy the same chemical element position.
  citations:
  - wp-chem-soddy
  - nobel-soddy-1921
- id: chem_radiocarbon_dating_to_libby_radiocarbon_validation_experimentally_verified_by
  source: radiocarbon_dating
  target: libby_radiocarbon_validation
  type: experimentally-verified-by
  label: known-age samples and modern carbon
  detail: Agreement with independently dated samples established practical radiocarbon chronometry while later work supplied calibration curves
    and reservoir corrections.
  citations:
  - wp-chem-radiocarbon-dating
  - nobel-libby-1960
- id: chem_isotope_dilution_analysis_to_mass_spectrometry_experimentally_verified_by
  source: isotope_dilution_analysis
  target: mass_spectrometry
  type: experimentally-verified-by
  label: quantified through calibrated isotope ratios
  detail: Mass spectrometry tests an isotope-dilution amount estimate through measured isotope ratios after spike
    equilibration, blank correction, fractionation control, and a stated measurement equation.
  citations:
  - wp-chem-radiochemistry
  - iaea-neutron-activation-analysis
  - iupac-gold-book
- id: chem_isotope_tracer_to_isotope_dilution_analysis_theory_component
  source: isotope_tracer
  target: isotope_dilution_analysis
  type: theory-component
  label: supplies the equilibrated spike
  detail: An isotopically enriched tracer supplies the spike in isotope-dilution analysis; accurate inference requires
    known spike composition, equilibration, ratio measurement, blank correction, and a stated measurement equation.
  citations:
  - wp-chem-radiochemistry
  - iaea-neutron-activation-analysis
  - iupac-gold-book
- id: chem_radionuclide_chemistry_to_radiopharmaceutical_composition
  source: radionuclide_chemistry
  target: radiopharmaceutical
  type: composition
  label: supplies a radioactive signaling or therapy component
  detail: A selected radionuclide is a material component of a radiopharmaceutical, joined to formulation and often
    a targeting vector; decay properties, dosimetry, purity, stability, and biology govern use.
  citations:
  - wp-chem-radiochemistry
  - iaea-neutron-activation-analysis
  - iupac-gold-book
