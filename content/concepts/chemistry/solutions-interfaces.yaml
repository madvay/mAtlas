  source: ideal_solution
  target: raoult_law
  type: describes-governs
  label: ideal vapor-pressure relation
  detail: Raoult behavior follows from ideal liquid chemical potentials with an appropriate vapor model.
  citations:
  - wp-chem-solution
  - openstax-chemistry-2e
  - iupac-solubility-data
  - iupac-gold-book
- id: chem_solution_to_henry_law_mathematical_limit
  source: solution
  target: henry_law
  type: mathematical-limit
  label: infinite-dilution relation
  detail: Henry’s law is the limiting linear relation for a specified solute as its concentration approaches zero.
  citations:
  - wp-chem-solution
  - openstax-chemistry-2e
  - iupac-solubility-data
  - iupac-gold-book
- id: chem_solution_to_colligative_property_state_description
  source: solution
  target: colligative_property
  type: state-description
  label: has particle-count-dependent shifts
  detail: Ideal-dilute vapor-pressure lowering, boiling-point elevation, freezing-point depression, and osmotic pressure depend on solute particle
    amount.
  citations:
  - wp-chem-solution
  - openstax-chemistry-2e
  - iupac-solubility-data
  - iupac-gold-book
- id: chem_osmosis_to_osmotic_pressure_state_description
  source: osmosis
  target: osmotic_pressure
  type: state-description
  label: opposed by pressure difference
  detail: Osmotic pressure is defined by the external pressure needed to bring solvent chemical potentials into balance across a selective membrane.
  citations:
  - wp-chem-solution
  - openstax-chemistry-2e
  - iupac-solubility-data
  - iupac-gold-book
- id: chem_solution_to_electrolyte_solution_classification
  source: solution
  target: electrolyte_solution
  type: classification
  label: includes ionic solutions
  detail: Electrolyte solutions contain mobile ions and require charge-neutral, electrostatic, and speciation constraints.
  citations:
  - wp-chem-solution
  - openstax-chemistry-2e
  - iupac-solubility-data
  - iupac-gold-book
- id: chem_electrolytic_dissociation_to_ion_transformation_process
  source: electrolytic_dissociation
  target: ion
  type: transformation-process
  label: forms solvated mobile ions
  detail: Electrolytic dissociation or ionization forms solvated ionic species whose equilibrium populations, mobilities, pairing, and reactions determine electrolyte behavior.
  citations:
  - wp-chem-solution
  - openstax-chemistry-2e
  - iupac-solubility-data
  - iupac-gold-book
