  source: bronsted_lowry_acid_base
  target: ph
  type: state-description
  label: quantified by hydrogen-ion activity
  detail: $pH$ summarizes one thermodynamic coordinate of acid–base state and does not alone specify total acidity or buffering capacity.
  citations:
  - wp-chem-solution
  - openstax-chemistry-2e
  - iupac-solubility-data
  - iupac-gold-book
- id: chem_chemical_activity_to_solubility_equilibrium_describes_governs
  source: chemical_activity
  target: solubility_equilibrium
  type: describes-governs
  label: sets saturation condition
  detail: Solubility products and more general phase-equilibrium expressions are written in activities rather than raw concentrations.
  citations:
  - wp-chem-solution
  - openstax-chemistry-2e
  - iupac-solubility-data
  - iupac-gold-book
- id: chem_acid_base_equilibrium_to_ph_describes_governs
  source: acid_base_equilibrium
  target: ph
  type: describes-governs
  label: sets hydrogen-ion activity
  detail: Mass balance, charge balance, equilibrium constants, and activities jointly determine $pH$; a concentration alone is not generally sufficient.
  citations:
  - wp-chem-solution
  - openstax-chemistry-2e
  - iupac-solubility-data
  - iupac-gold-book
- id: chem_lewis_acid_base_to_coordination_complex_describes_governs
  source: lewis_acid_base
  target: coordination_complex
  type: describes-governs
  label: forms donor–acceptor adducts
  detail: Metal–ligand coordination can be described as Lewis-acid acceptance of ligand electron-pair density, while full bonding may include
    covalency and back-donation.
  citations:
  - wp-chem-solution
  - openstax-chemistry-2e
  - iupac-solubility-data
  - iupac-gold-book
