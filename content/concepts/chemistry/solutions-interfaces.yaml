  source: arrhenius_electrolyte_conductivity
  target: electrolytic_dissociation
  type: historically-motivated
  label: dilution-dependent ionic conduction
  detail: Conductivity and colligative anomalies helped motivate the proposal that dissolved electrolytes contain ions before electrolysis, though
    the early degree-of-dissociation model was later revised for strong electrolytes.
  citations:
  - wp-chem-arrhenius
  - nobel-arrhenius-1903
- id: chem_osmotic_pressure_to_vanthoff_osmotic_pressure_measurements_experimentally_verified_by
  source: osmotic_pressure
  target: vanthoff_osmotic_pressure_measurements
  type: experimentally-verified-by
  label: dilute ideal relation
  detail: Dilute nonelectrolyte data supported the proportionality of osmotic pressure to temperature and particle concentration within its ideal
    regime.
  citations:
  - wp-chem-osmotic-pressure
  - nobel-vanthoff-1901
- id: chem_chemical_activity_to_equilibrium_constant_theory_component
  source: chemical_activity
  target: equilibrium_constant
