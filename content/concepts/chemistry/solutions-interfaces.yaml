  - iupac-solubility-data
  - iupac-gold-book
- id: chem_langmuir_adsorption_model_to_langmuir_adsorption_experiments_experimentally_verified_by
  source: langmuir_adsorption_model
  target: langmuir_adsorption_experiments
  type: experimentally-verified-by
  label: tested through saturating monolayer uptake
  detail: Langmuir’s measurements supported a finite-site monolayer description for selected systems while later work documented surface heterogeneity,
    interactions, and multilayer regimes.
  citations:
  - wp-chem-langmuir-adsorption
  - nobel-langmuir-1932
