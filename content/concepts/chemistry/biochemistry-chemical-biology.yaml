- id: miller_urey_experiment
  label: Miller–Urey synthesis experiment
  primaryField: chemistry
  fields:
  - chemistry
  primaryDomain: biochemistry-chemical-biology
  domains:
  - biochemistry-chemical-biology
  - chemistry-experiments-evidence
  level: 44
  kind: structure
  conceptType: Canonical constrained-support experiment
  summary: Electrical discharges through a chosen reducing gas mixture and circulating water produced amino acids and other organics, demonstrating
    one abiotic synthesis route under the apparatus conditions.
  citations:
  - wp-chem-miller-urey
  - miller-1953
  sections:
  - title: Scope
    body: The experiment supported abiotic organic synthesis under one modeled atmosphere. It neither reproduced a settled early-Earth atmosphere
      nor created life, and later prebiotic chemistry evaluates many environments and pathways.
