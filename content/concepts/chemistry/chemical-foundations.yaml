- id: conservation_mass_chemical_reaction
  label: Mass conservation in chemical reactions
  primaryField: chemistry
  fields:
  - chemistry
  primaryDomain: chemical-foundations
  domains:
  - chemical-foundations
  level: 23
  kind: structure
  conceptType: Empirical conservation principle
  summary: For a closed reacting system treated at chemical energies, total mass is conserved to the accuracy at which relativistic mass–energy
    changes are negligible.
  citations:
  - wp-chem-stoichiometry
  - openstax-chemistry-2e
  - iupac-gold-book
