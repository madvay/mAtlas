  domains:
  - quantum-chemistry-spectroscopy
  level: 40
  kind: structure
  conceptType: Attenuation relation
  summary: In a homogeneous dilute regime, absorbance is proportional to optical path length and concentration, with deviations from interactions,
    scattering, instrumental limits, or changing speciation.
