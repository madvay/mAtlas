edges:
- id: chem_molecular_structure_to_lewis_structure_model_realization
  source: molecular_structure
  target: lewis_structure
  type: model-realization
  label: two-dimensional valence model
  detail: A Lewis structure records selected connectivity and valence bookkeeping but does not uniquely determine a three-dimensional or quantum
    structure.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_structure_to_molecular_graph_model_realization
  source: molecular_structure
  target: molecular_graph
  type: model-realization
  label: connectivity graph
  detail: A molecular graph retains constitution while abstracting away coordinates, vibrations, and most electronic structure.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_structure_to_molecular_geometry_state_description
  source: molecular_structure
  target: molecular_geometry
  type: state-description
  label: nuclear arrangement
  detail: Geometry is the spatial component of a molecular structure at a specified state or level of averaging.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_structure_to_molecular_conformation_state_description
  source: molecular_structure
  target: molecular_conformation
  type: state-description
  label: accessible conformers
  detail: A flexible molecular structure can occupy distinct conformations separated by energetic barriers.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_valence_bond_theory_to_chemical_bond_describes_governs
  source: valence_bond_theory
  target: chemical_bond
  type: describes-governs
  label: localized bonding description
  detail: Valence-bond theory describes bonds through spin-coupled localized configurations and resonance, with quantitative accuracy depending
    on the wavefunction expansion.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_orbital_theory_to_chemical_bond_describes_governs
  source: molecular_orbital_theory
  target: chemical_bond
  type: describes-governs
  label: delocalized orbital description
  detail: Molecular-orbital theory describes bonding through occupations of orbitals extending over the molecular framework.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_orbital_hybridization_to_valence_bond_theory_theory_component
  source: orbital_hybridization
  target: valence_bond_theory
  type: theory-component
  label: localized orbital basis
  detail: Hybrid orbitals are a convenient localized basis within many valence-bond and qualitative bonding models.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_lewis_structure_to_formal_charge_state_description
  source: lewis_structure
  target: formal_charge
  type: state-description
  label: assigns formal charges
  detail: Formal charge is computed from a specified Lewis electron allocation and need not equal a measured partial charge.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_lewis_structure_to_resonance_chemistry_state_description
  source: lewis_structure
  target: resonance_chemistry
  type: state-description
  label: requires multiple contributors
  detail: When no one Lewis formula captures the valence distribution, several contributors represent one delocalized state.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_vsepr_theory_to_molecular_geometry_describes_governs
  source: vsepr_theory
  target: molecular_geometry
  type: describes-governs
  label: qualitative shape prediction
  detail: VSEPR predicts many main-group shapes from electron-domain arrangements but is not a universal electronic-structure theory.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_covalent_bond_to_molecule_couples_interacts
  source: covalent_bond
  target: molecule
  type: couples-interacts
  label: stabilizes molecular connectivity
  detail: Shared electron density can stabilize nuclei in a molecular entity; many bonds have mixed covalent, ionic, and multicenter character.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_ionic_bonding_to_crystalline_solid_couples_interacts
  source: ionic_bonding
  target: crystalline_solid
  type: couples-interacts
  label: stabilizes ionic lattices
  detail: Long-range Coulomb attraction plus repulsion and polarization can stabilize ionic crystals; the bonding is collective rather than a
    set of isolated pair bonds.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_intermolecular_force_to_hydrogen_bond_classification
  source: intermolecular_force
  target: hydrogen_bond
  type: classification
  label: includes hydrogen bonding
  detail: Hydrogen bonds form a directional subclass of noncovalent molecular interactions.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_intermolecular_force_to_molecular_conformation_couples_interacts
  source: intermolecular_force
  target: molecular_conformation
  type: couples-interacts
  label: biases conformational populations
  detail: Intramolecular and solvent-mediated noncovalent interactions reshape conformational free-energy landscapes.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_dipole_moment_to_intermolecular_force_theory_component
  source: molecular_dipole_moment
  target: intermolecular_force
  type: theory-component
  label: contributes electrostatic coupling
  detail: Permanent dipoles contribute orientation-dependent electrostatic interactions, alongside induction, dispersion, and exchange.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_structure_to_stereochemistry_framework_specialization
  source: molecular_structure
  target: stereochemistry
  type: framework-specialization
  label: specialized to spatial identity
  detail: Stereochemistry studies distinctions arising from three-dimensional arrangement within a fixed or explicitly related connectivity.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_orbital_theory_to_quantum_chemistry_theory_component
  source: molecular_orbital_theory
  target: quantum_chemistry
  type: theory-component
  label: supplies delocalized orbital framework
  detail: Molecular-orbital theory is one central approximation framework within quantum chemistry, not an observable decomposition of an exact
    many-electron state.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_intermolecular_force_to_solution_describes_governs
  source: intermolecular_force
  target: solution
  type: describes-governs
  label: controls mixing nonideality
  detail: Solute–solute, solvent–solvent, and solute–solvent interactions determine deviations from ideal mixing and influence phase behavior.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_symmetry_to_molecular_spectroscopy_describes_governs
  source: molecular_symmetry
  target: molecular_spectroscopy
  type: describes-governs
  label: sets spectroscopic selection patterns
  detail: Molecular symmetry classifies states and normal modes and constrains which transitions can carry intensity.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_dipole_moment_to_infrared_spectroscopy_theory_component
  source: molecular_dipole_moment
  target: infrared_spectroscopy
  type: theory-component
  label: enables dipole-active vibrations
  detail: An infrared-active normal mode changes the molecular dipole moment; a permanent dipole is not required for every vibrational transition.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_structure_to_molecular_spectroscopy_experimentally_verified_by
  source: molecular_structure
  target: molecular_spectroscopy
  type: experimentally-verified-by
  label: constrained by molecular spectra
  detail: Resolved transition frequencies, intensities, splittings, and selection patterns test structural assignments,
    but extracting geometry or dynamics requires an explicit spectroscopic model and uncertainty analysis.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_geometry_to_orbital_hybridization_model_realization
  source: molecular_geometry
  target: orbital_hybridization
  type: model-realization
  label: represented by directional hybrid orbitals
  detail: Hybridization is a localized orbital model used to rationalize selected molecular geometries and bonding
    patterns; it is not a unique observable decomposition of an exact wavefunction.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_covalent_bond_to_valence_bond_theory_model_realization
  source: covalent_bond
  target: valence_bond_theory
  type: model-realization
  label: represented by localized electron pairing
  detail: Valence-bond theory models a covalent bond with localized spin-coupled structures and resonance; quantitative
    accuracy depends on the chosen orbital and configuration space.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
- id: chem_molecular_geometry_to_molecular_symmetry_state_description
  source: molecular_geometry
  target: molecular_symmetry
  type: state-description
  label: classified by invariant symmetry operations
  detail: A molecular geometry is classified by symmetry operations that leave the idealized nuclear arrangement
    invariant; conformational motion, isotopic substitution, and environment can lower the effective symmetry.
  citations:
  - wp-physics-chemical-bond
  - openstax-chemistry-2e
  - iupac-gold-book
