  - wp-physics-chemical-bond
  - iupac-chemical-bond
  - openstax-chemistry-2e
- id: chemical_bond_to_ionic_bonding
  source: chemical_bond
  target: ionic_bonding
  type: classification
  label: includes ionic bonding descriptions
  detail: Ionic bonding describes electrostatic stabilization in charge-separated structures, with polarization, covalency, lattice geometry,
