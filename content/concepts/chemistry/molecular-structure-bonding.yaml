- id: chemical_bond_to_covalent_bond
  source: chemical_bond
  target: covalent_bond
  type: classification
  label: includes covalent bonding descriptions
  detail: Covalent bonding is a major chemical-bond regime characterized by shared and delocalized electron density; real bonds can mix covalent,
