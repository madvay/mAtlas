  primaryDomain: organic-chemistry
  domains:
  - organic-chemistry
  - chemistry-experiments-evidence
  level: 35
  kind: structure
  conceptType: Historical motivating experiment
  summary: Pasteur manually separated mirror-related sodium ammonium tartrate crystals and connected their opposite optical rotations to molecular
    dissymmetry.
  citations:
  - wp-chem-pasteur-chirality
  - pasteur-chirality-review
