- id: wohler_urea_synthesis
  label: Wöhler’s urea synthesis
  primaryField: chemistry
  fields:
  - chemistry
  primaryDomain: organic-chemistry
  domains:
  - organic-chemistry
  - chemistry-experiments-evidence
  level: 32
  kind: structure
  conceptType: Historical motivating synthesis
  summary: Wöhler obtained urea from cyanate-derived starting materials in 1828, demonstrating laboratory interconversion between substances then
    assigned to inorganic and organic domains.
  citations:
  - wp-chem-wohler-synthesis
  - wohler-1828-urea
  sections:
  - title: Historical qualification
    body: The synthesis did not instantly refute vitalism or single-handedly found organic chemistry. Its later symbolic role exceeded its immediate
      reception, while its actual chemical result remained decisive evidence that urea required no organism for its preparation.
- id: pasteur_tartrate_resolution
  label: Pasteur’s tartrate resolution
  primaryField: chemistry
  fields:
