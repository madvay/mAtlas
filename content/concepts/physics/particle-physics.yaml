  - id: standard_model
    label: Standard Model of particle physics
    primaryField: physics
    fields:
      - physics
    primaryDomain: particle-physics
    domains:
      - particle-physics
    level: 10
    kind: structure
    conceptType: Theory or framework
    summary: The renormalizable gauge quantum field theory with gauge group $SU(3)_C\times SU(2)_L\times U(1)_Y$, three observed fermion generations, one Higgs doublet, and the strong and electroweak interactions; gravity is not included.
    citations:
      - wp-physics-standard_model
      - nlab-physics-standard_model
      - cern-standard-model
      - pdg-standard-model
      - tong-particle
    status: Established theory within tested domain
    sections:
      - title: Field content
        body: Gauge fields for $SU(3)_C\times SU(2)_L\times U(1)_Y$, three generations of chiral quark and lepton multiplets, and one complex Higgs doublet.
      - title: Interaction terms
        items:
          - Quark–gluon and gluon self-interactions from $SU(3)_C$.
          - Charged-current, neutral-current, and electroweak gauge-boson self-interactions.
          - Photon couplings to electric current.
          - Higgs self-coupling, Higgs–gauge couplings, and Yukawa couplings to fermions.
      - title: Minimal-model qualification
        body: The minimal renormalizable Standard Model has no neutrino-mass term. Observed neutrino oscillations therefore require an extension, such as additional fields or higher-dimension operators.
      - title: Known limitations
        items:
          - No quantum theory of gravity.
          - No established particle explanation of dark matter or dark energy.
          - Does not explain the number of generations, flavor parameters, baryon asymmetry, or the origin and nature of neutrino masses.
