    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 5
    kind: structure
    conceptType: Source tensor
    summary: The tensor encoding local energy density, momentum density, stresses, and fluxes that sources spacetime curvature.
