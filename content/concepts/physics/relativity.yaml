      - einstein-general-relativity
      - tong-gr
  - id: causal_structure
    label: Causal structure
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 5
    kind: structure
    conceptType: Spacetime structure
    summary: The chronological and causal reachability relations determined by a spacetime metric. Causal reachability is a partial order only under suitable causality conditions, such as the absence of closed causal curves.
    citations:
      - wp-physics-causal_structure
      - nlab-physics-causal_structure
      - einstein-spacetime
      - tong-relativity
  - id: four_velocity
