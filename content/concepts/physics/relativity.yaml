    primaryDomain: relativity
    domains:
      - relativity
      - experiments-observations
    level: 7
    kind: structure
    conceptType: Canonical experimental test
    summary: The 1959–1960 Mössbauer experiment measured the gravitational frequency shift of gamma rays over a vertical height in Earth’s field.
