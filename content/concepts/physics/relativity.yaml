    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - experiments-observations
    level: 5
    kind: structure
    conceptType: Canonical observational test
    summary: Eclipse expeditions in 1919 measured the apparent displacement of stars near the Sun and were interpreted as supporting Einstein’s predicted gravitational deflection of light.
    citations:
      - wp-physics-eddington_eclipse_observations
      - einstein-online-classical-tests
    status: Observed / performed
    sections:
      - title: Qualification
        body: The 1919 data were historically influential but less precise than later radio and optical measurements of light deflection.
  - id: kennedy_thorndike_experiment
    label: Kennedy–Thorndike experiment
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - experiments-observations
    level: 6
    kind: structure
    conceptType: Canonical experimental test
    summary: The 1932 unequal-arm interferometer test constrained changes in light speed associated with Earth’s changing velocity and, together with Michelson–Morley, tested Lorentz transformations.
    citations:
      - wp-physics-kennedy_thorndike_experiment
      - aps-kennedy-thorndike
    status: Observed / performed
  - id: ives_stilwell_experiment
