    primaryDomain: relativity
    domains:
      - relativity
    level: 8
    kind: structure
    conceptType: Theory formulation
    summary: Classical particle mechanics constrained by Minkowski spacetime and Lorentz invariance.
    citations:
      - wp-physics-relativistic_particle_mechanics
      - tong-relativity
  - id: weak_field_gravity
