      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - experiments-observations
    level: 6
    kind: structure
    conceptType: Canonical experimental test
    summary: Ives and Stilwell measured the transverse Doppler effect using moving ions, providing an early quantitative test of relativistic time dilation.
    citations:
      - wp-physics-ives_stilwell_experiment
      - aps-ives-stilwell
    status: Observed / performed
  - id: pound_rebka_experiment
