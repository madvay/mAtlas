    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - experiments-observations
    level: 10
    kind: structure
    conceptType: Canonical observational test
    summary: LIGO observed a transient waveform from a binary-black-hole merger in 2015, the first direct detection of gravitational waves and a strong-field test of general relativity.
    citations:
