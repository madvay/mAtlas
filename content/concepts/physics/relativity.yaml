    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - cosmology
    level: 7
    kind: structure
    conceptType: Dynamical process
    summary: Contraction driven by self-gravity; sufficiently compact collapse can form trapped regions and a black hole, depending on matter and global conditions.
