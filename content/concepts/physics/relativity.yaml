    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 6
    kind: structure
    conceptType: Relativistic kinematic quantity
    summary: The tangent vector $u^\mu=dx^\mu/d\tau$ to a timelike worldline, normalized by the spacetime metric according to convention.
    citations:
      - wp-physics-four_velocity
      - nlab-physics-velocity
      - tong-relativity
