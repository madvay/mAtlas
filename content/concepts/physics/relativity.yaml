    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - experiments-observations
    level: 9
    kind: structure
    conceptType: Canonical observational test
    summary: Long-term timing of PSR B1913+16 revealed orbital decay agreeing with general-relativistic energy loss by gravitational radiation.
    citations:
