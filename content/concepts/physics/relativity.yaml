      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - cosmology
    level: 9
    kind: structure
    conceptType: Astrophysical system
    summary: Two black holes in mutual orbit whose inspiral and merger can radiate strong gravitational waves.
    citations:
      - wp-physics-binary-black-hole
      - ligo-gravitational-wave-science
      - nasa-black-holes
  - id: j_hawking_radiation
    label: black-hole background + quantum fields
    primaryDomain: relativity
    domains:
      - relativity
      - quantum-field-theory
      - cosmology
    level: 11
    kind: junction
    summary: Compatibility construction for the semiclassical prediction of Hawking radiation.
    carriers: []
    data: []
    axioms: []
    induces: []
    notes: The result uses quantum fields on a classical black-hole background; backreaction and full quantum gravity are additional problems.
    citations:
      - einstein-online-black-holes
      - wp-physics-hawking-radiation
      - tong-qft
    combination:
      inputs:
        - black_hole
        - quantum_field_theory
      compatibility: Place quantum fields in an appropriate state on a stationary or slowly varying classical black-hole spacetime and compare suitable asymptotic particle notions.
      output: hawking_radiation
    primaryField: physics
    fields:
      - physics
  - id: hawking_radiation
    label: Hawking radiation
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - quantum-field-theory
      - cosmology
    level: 12
    kind: structure
    conceptType: Semiclassical prediction
    summary: Quantum fields on a black-hole background predict approximately thermal radiation at infinity, with temperature set by surface gravity in the stationary case.
    citations:
      - wp-physics-hawking-radiation
      - nlab-hawking-radiation
      - nasa-black-holes
      - tong-qft
  - id: gravitational_wave
    label: Gravitational wave
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - experiments-observations
    level: 8
    kind: structure
    conceptType: Propagating spacetime disturbance
    summary: A propagating disturbance of spacetime curvature generated by time-varying nonspherical mass-energy distributions and traveling at the speed of light in general relativity.
    citations:
      - wp-physics-gravitational-wave
      - nlab-gravitational-wave
      - ligo-gravitational-wave-science
      - tong-gr
    status: Predicted by general relativity; directly observed
    sections:
      - title: Regime
        body: Far from a source and in the weak-field limit, gravitational waves are described by transverse radiative metric perturbations; strong-field sources require the full nonlinear Einstein equations.
