      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - experiments-observations
    level: 7
    kind: structure
    conceptType: Canonical observational test
    summary: Radar ranging to planets measured the extra propagation time of signals passing near the Sun, testing the relativistic gravitational time delay.
    citations:
