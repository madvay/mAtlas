nodes:
  - id: spacetime
    label: Spacetime
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 3
    kind: structure
    conceptType: Geometric physical framework
    summary: The four-dimensional collection of physical events in which temporal and spatial relations are represented together.
    citations:
      - wp-physics-spacetime
      - nlab-physics-spacetime
      - einstein-spacetime
      - tong-relativity
    scale: All relativistic scales
    sections:
      - title: Relativity
        body: Special relativity uses flat spacetime; general relativity permits curved Lorentzian spacetime whose geometry is dynamical.
  - id: special_relativity
    label: Special relativity
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 3
    kind: structure
    conceptType: Theory or framework
    summary: The relativistic framework for nongravitational physics in inertial frames, with invariant light speed and Lorentz symmetry.
    citations:
      - wp-physics-special_relativity
      - nlab-physics-special_relativity
      - einstein-special-relativity
      - tong-relativity
    sections:
      - title: Scope
        body: It neglects dynamical gravitation but constrains every relativistic local field theory, including the Standard Model.
  - id: general_relativity
    label: General relativity
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 4
    kind: structure
    conceptType: Theory or framework
    summary: Einstein’s classical theory of gravitation, in which gravity is represented by dynamical Lorentzian spacetime geometry.
    citations:
      - wp-physics-general_relativity
      - nlab-physics-general_relativity
      - einstein-general-relativity
      - tong-gr
    sections:
      - title: Core content
        body: Matter and non-gravitational fields source curvature; freely falling bodies follow the geometry rather than experiencing gravity as an ordinary force.
      - title: Limits
        body: It is classical and is not a complete quantum theory of gravity.
  - id: minkowski_spacetime
    label: Minkowski spacetime
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 4
    kind: structure
    conceptType: Geometric model
    summary: Flat four-dimensional spacetime equipped with the Lorentzian metric used by special relativity.
    citations:
      - wp-physics-minkowski_spacetime
      - nlab-physics-minkowski_spacetime
      - einstein-spacetime
      - tong-relativity
    sections:
      - title: Structure
        body: Its invariant interval and light-cone causal structure are preserved by Poincaré transformations.
  - id: equivalence_principle
    label: Equivalence principle
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 4
    kind: structure
    conceptType: Foundational principle
    summary: The local universality of free fall and local equivalence between gravitation and acceleration, in formulations appropriate to general relativity.
    citations:
      - wp-physics-equivalence_principle
      - einstein-general-relativity
      - tong-gr
  - id: gravitation
    label: Gravitation
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 4
    kind: structure
    conceptType: Fundamental interaction
    summary: The interaction described classically by general relativity as spacetime curvature.
    citations:
      - wp-physics-gravitation
      - nlab-gravitation
      - einstein-general-relativity
      - tong-gr
    status: Observed; classical theory well tested
    sections:
      - title: Standard Model boundary
        body: Gravitation is not included in the Standard Model of particle physics.
  - id: lorentz_symmetry
