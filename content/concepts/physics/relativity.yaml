      - wp-physics-stress_energy_tensor
      - nlab-physics-stress_energy_tensor
      - einstein-equation
      - tong-gr
  - id: einstein_field_equation
    label: Einstein field equation
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 6
    kind: structure
    conceptType: Physical law
    summary: The field equation relating spacetime curvature to the stress–energy content of matter and non-gravitational fields.
    citations:
      - wp-physics-einstein_field_equation
      - nlab-physics-einstein_field_equation
      - einstein-equation
      - tong-gr
    sections:
      - title: Schematic form
        body: The geometric tensor $G_{\mu\nu}$, optionally with a cosmological term, is proportional to the stress–energy tensor $T_{\mu\nu}$.
  - id: energy_momentum_four_vector
    label: Energy–momentum four-vector
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 6
    kind: structure
    conceptType: Relativistic quantity
    summary: The four-vector $p^\mu=(E/c,\mathbf p)$ satisfying the mass-shell relation for a free particle.
    citations:
      - wp-physics-energy_momentum_four_vector
      - tong-relativity
      - pdg-rpp
  - id: geodesic_motion
    label: Geodesic motion
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 7
    kind: structure
    conceptType: Dynamical law
    summary: Ideal freely falling test bodies follow timelike geodesics, while light rays follow null geodesics in the geometric-optics limit, when nongravitational forces, finite-wavelength effects, and self-force are neglected.
    citations:
      - wp-physics-geodesic_motion
      - einstein-general-relativity
      - tong-gr
  - id: relativistic_particle_mechanics
