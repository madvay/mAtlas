      - wp-physics-worldline
      - nlab-physics-worldline
      - einstein-spacetime
      - tong-relativity
  - id: mass_energy_equivalence
    label: Mass–energy equivalence
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 6
    kind: structure
    conceptType: Relativistic relation
    summary: The invariant mass of an isolated system equals its total rest-frame energy divided by $c^2$; binding, kinetic, field, and internal energies therefore contribute to composite mass.
    citations:
      - wp-physics-mass_energy_equivalence
      - nlab-physics-special_relativity
      - einstein-mass-energy
      - einstein-binding-energy
  - id: cavendish_torsion_balance_experiment
    label: Cavendish torsion-balance experiment
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - experiments-observations
    level: 13
    kind: structure
    conceptType: Canonical experiment
    summary: Cavendish’s 1798 torsion-balance measurements detected gravitational attraction between laboratory masses and determined the mean density of Earth.
    citations:
      - wp-physics-cavendish_torsion_balance_experiment
      - aps-cavendish
    status: Observed / performed
    sections:
      - title: Result
        body: The experiment supplied a terrestrial quantitative test of universal Newtonian gravitation; the modern value of $G$ is inferred when the result is expressed in later notation.
  - id: fizeau_moving_water_experiment
    label: Fizeau moving-water experiment
    primaryField: physics
    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - experiments-observations
    level: 2
    kind: structure
    conceptType: Canonical experiment
    summary: Fizeau measured the speed of light in moving water in 1851, obtaining partial ether-drag behavior later explained by relativistic velocity addition.
    citations:
      - wp-physics-fizeau_moving_water_experiment
      - einstein-special-relativity
      - tong-relativity
    status: Observed / performed
  - id: mercury_perihelion_anomaly
