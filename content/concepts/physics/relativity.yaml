    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
    level: 5
    kind: structure
    conceptType: Spacetime history
    summary: A timelike or null curve representing the spacetime history of an idealized particle or light signal; extended bodies require worldtubes or field descriptions.
