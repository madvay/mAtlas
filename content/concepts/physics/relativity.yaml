    fields:
      - physics
    primaryDomain: relativity
    domains:
      - relativity
      - experiments-observations
    level: 2
    kind: structure
    conceptType: Canonical experiment
    summary: The 1887 interferometer experiment found no ether-wind fringe shift of the expected magnitude, sharply constraining stationary luminiferous-ether models.
    citations:
      - wp-physics-michelson_morley_experiment
      - nlab-michelson-morley-experiment
