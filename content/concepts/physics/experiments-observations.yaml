      - wp-physics-measurement
      - bipm-gum-1
  - id: measurement_uncertainty
    label: Measurement uncertainty
    primaryField: physics
    fields:
      - physics
    primaryDomain: experiments-observations
    domains:
      - experiments-observations
    level: 5
    kind: structure
