    citations:
      - wp-physics-newtonian_mechanics
      - cambridge-classical-dynamics
      - wp-physics-classical_mechanics
      - nlab-physics-classical_mechanics
  - id: configuration_to_phase
    source: configuration_space
    target: phase_space
    type: canonical-construction
    label: form the cotangent phase space
    detail: For a smooth configuration manifold $Q$, the standard phase space is the new manifold $T^*Q$ with its canonical symplectic form; it is not the same carrier with extra data.
    citations:
      - wp-physics-phase_space
      - nlab-physics-phase_space
      - wp-physics-configuration_space
      - nlab-physics-configuration_space
  - id: hamiltonian_mechanics_uses_hamiltonian
    source: hamiltonian
    target: hamiltonian_mechanics
    type: theory-component
    label: Hamiltonian generator
    detail: Hamiltonian mechanics formulates dynamics using a Hamiltonian on phase space.
    citations:
      - wp-physics-hamiltonian_mechanics
      - nlab-physics-hamiltonian_mechanics
      - nlab-physics-hamiltonian
  - id: hamiltonian_to_qevolution
    source: hamiltonian
    target: unitary_time_evolution
    type: describes-governs
    label: generator of time translation
    detail: A self-adjoint Hamiltonian generates unitary time evolution.
    citations:
      - wp-physics-unitary_time_evolution
      - nlab-physics-quantum_mechanics
      - wp-physics-hamiltonian_mechanics
      - nlab-physics-hamiltonian
  - id: lagrangian_to_action
    source: lagrangian
    target: action_functional
    type: canonical-construction
    label: time integral
    detail: For particle mechanics, $S=\int L\,dt$.
    citations:
      - wp-physics-lagrangian_mechanics
      - nlab-physics-lagrangian
      - wp-physics-action_functional
      - nlab-physics-action_functional
  - id: lagrangian_to_canonical_momentum
    source: lagrangian
    target: canonical_momentum
    type: canonical-construction
    label: Legendre momentum
    detail: Canonical momentum is obtained by differentiating the Lagrangian with respect to generalized velocity.
    citations:
      - wp-physics-lagrangian_mechanics
      - nlab-physics-lagrangian
      - cambridge-classical-dynamics
      - wp-physics-canonical_momentum
  - id: lagrangian_mechanics_uses_lagrangian
    source: lagrangian
    target: lagrangian_mechanics
    type: theory-component
    label: Lagrangian formulation
    detail: Lagrangian mechanics formulates dynamics using $L$ and stationary action.
    citations:
      - wp-physics-lagrangian_mechanics
      - nlab-physics-lagrangian_mechanics
      - nlab-physics-lagrangian
  - id: lagrangian_density_to_action
    source: lagrangian_density
    target: action_functional
    type: canonical-construction
    label: spacetime integral
    detail: For a local field theory, $S=\int d^dx\,\mathcal L$.
    citations:
      - wp-physics-lagrangian_density
      - nlab-physics-lagrangian_density
      - wp-physics-action_functional
      - nlab-physics-action_functional
  - id: lagrangian_to_classical_field
    source: lagrangian_density
    target: classical_field_theory
    type: mathematical-formulation
    label: Lagrangian field formulation
    detail: A classical field theory admitting a local Lagrangian formulation uses a Lagrangian density whose spacetime action yields field Euler–Lagrange equations.
    citations:
      - cambridge-classical-dynamics
      - cern-qft-intro
      - wp-physics-classical_field_theory
      - nlab-physics-classical_field_theory
      - wp-physics-lagrangian_mechanics
  - id: phase_to_poisson
    source: phase_space
    target: poisson_bracket
    type: canonical-construction
    label: Poisson algebra of observables
    detail: A symplectic or Poisson phase space supplies a Poisson bracket on observables.
    citations:
      - wp-physics-phase_space
      - nlab-physics-phase_space
      - cambridge-classical-dynamics
      - wp-physics-poisson_bracket
      - nlab-physics-poisson_bracket
  - id: poisson_to_hamiltonian_phys
    source: poisson_bracket
    target: hamiltonian_mechanics
    type: theory-component
    label: Hamiltonian evolution bracket
    detail: Hamiltonian time evolution is generated by the Poisson bracket with the Hamiltonian.
    citations:
      - wp-physics-poisson_bracket
      - nlab-physics-poisson_bracket
      - cambridge-classical-dynamics
      - wp-physics-hamiltonian_mechanics
      - nlab-physics-hamiltonian_mechanics
      - tong-quantum
  - id: stationary_to_eom
    source: stationary_action_principle
    target: equation_of_motion
    type: theorem-implication
    label: Euler–Lagrange equations
    detail: Variation of the action yields equations of motion under appropriate boundary conditions.
    citations:
      - wp-physics-stationary_action_principle
      - nlab-physics-stationary_action_principle
      - wp-physics-equation_of_motion
      - nlab-physics-equation_of_motion
  - id: stationary_to_euler
    source: stationary_action_principle
    target: euler_lagrange_equation
    type: theorem-implication
    label: Euler–Lagrange equation
    detail: Stationarity of the action under admissible variations yields the Euler–Lagrange equations.
    citations:
      - wp-physics-stationary_action_principle
      - nlab-physics-stationary_action_principle
      - cambridge-classical-dynamics
      - wp-physics-euler_lagrange_equation
      - nlab-physics-euler_lagrange_equation
      - tong-qft
  - id: force_to_newtonlaws
    source: force
    target: newton_laws
    type: theory-component
    label: net force
    detail: The second law relates net force to momentum change, reducing to $\mathbf F=m\mathbf a$ at constant mass.
    citations:
      - wp-physics-force
      - nlab-physics-force
      - cambridge-classical-dynamics
      - wp-physics-newton_laws
      - tong-relativity
  - id: momentum_to_force
    source: linear_momentum
    target: force
    type: canonical-construction
    label: momentum-change rate
    detail: In Newtonian mechanics force is $d\mathbf p/dt$; this definition does not make force fundamental in every formulation.
    citations:
      - wp-physics-linear_momentum
      - nlab-physics-linear_momentum
      - cambridge-classical-dynamics
      - tong-relativity
      - wp-physics-force
      - nlab-physics-force
  - id: momentum_to_fourmomentum
    source: linear_momentum
    target: energy_momentum_four_vector
    type: theory-component
    label: spatial components
    detail: Linear momentum supplies the spatial components of relativistic four-momentum.
    citations:
      - wp-physics-linear_momentum
      - nlab-physics-linear_momentum
      - cambridge-classical-dynamics
      - tong-relativity
      - wp-physics-energy_momentum_four_vector
      - pdg-rpp
  - id: momentum_to_newtonlaws
    source: linear_momentum
    target: newton_laws
    type: theory-component
    label: momentum dynamics
    detail: Newton’s second law is most generally written as a momentum-balance equation.
    citations:
      - wp-physics-linear_momentum
      - nlab-physics-linear_momentum
      - cambridge-classical-dynamics
      - tong-relativity
      - wp-physics-newton_laws
  - id: newtonian_to_newtonlaws
    source: newton_laws
    target: newtonian_mechanics
    type: theory-component
    label: Newtonian equations of motion
    detail: Newton’s laws supply the standard particle-law formulation of Newtonian mechanics.
    citations:
      - wp-physics-newtonian_mechanics
      - cambridge-classical-dynamics
      - tong-relativity
      - wp-physics-newton_laws
  - id: hist_galileo_inclined_plane_experiments_to_newtonian_mechanics
    source: galileo_inclined_plane_experiments
    target: newtonian_mechanics
    type: historically-motivated
    label: quantitative accelerated motion
    detail: Galileo’s measured laws of falling and inertial motion formed part of the empirical and mathematical background from which Newtonian mechanics was constructed.
    citations:
      - wp-physics-galileo_inclined_plane_experiments
      - museo-galileo-inclined-plane
  - id: story_action_functional_to_path_integral_quantization_quantization
    source: action_functional
    target: path_integral_quantization
    type: quantization
    label: weight histories by the action
    detail: Path-integral quantization uses the classical action in a formal or regulated sum over histories, typically with phase $e^{iS/\hbar}$; making the construction rigorous depends on the theory and signature.
    citations:
      - wp-physics-path_integral_quantization
      - nlab-physics-path_integral_quantization
  - id: story_hamiltonian_mechanics_to_canonical_quantization_quantization
    source: hamiltonian_mechanics
    target: canonical_quantization
    type: quantization
    label: promote canonical variables to operators
    detail: Canonical quantization begins from Hamiltonian phase-space variables and replaces suitable Poisson brackets by operator commutators, subject to ordering, domain, and constraint ambiguities.
    citations:
      - wp-physics-canonical_quantization
      - nlab-physics-canonical_quantization
