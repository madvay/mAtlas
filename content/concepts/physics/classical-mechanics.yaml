nodes:
  - id: classical_field_theory
    label: Classical field theory
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
      - relativity
    level: 9
    kind: structure
    conceptType: Classical effective-theory family
    summary: A theory in which continuously distributed fields obey classical equations of motion. A classical field theory may be formulated independently or arise as an effective, mean-field, or semiclassical description in an appropriate regime.
    citations:
      - wp-physics-classical_field_theory
      - nlab-physics-classical_field_theory
      - tong-qft
    sections:
      - title: Examples
        items:
          - Classical electromagnetism.
          - Classical scalar and gauge fields.
          - The metric field in general relativity.
      - title: Relation to QFT
        body: Quantizing an appropriate classical field theory is a principal route to a quantum field theory, while classical field equations can reappear as semiclassical or low-fluctuation limits.
  - id: action_functional
    label: Action functional
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 10
    kind: structure
    conceptType: Dynamical functional
    summary: A functional $S$ of a history or field configuration whose stationary points satisfy equations of motion.
    citations:
      - wp-physics-action_functional
      - nlab-physics-action_functional
      - cambridge-classical-dynamics
      - tong-qft
  - id: classical_mechanics
    label: Classical mechanics
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 10
    kind: structure
    conceptType: Effective theory family
    summary: The classical theory family for motion and fields when quantum coherence, particle creation, relativistic effects, and strong-gravity effects are negligible at the required precision.
    citations:
      - wp-physics-classical_mechanics
      - nlab-physics-classical_mechanics
      - cambridge-classical-dynamics
    sections:
      - title: Regime
        body: Accurate when relativistic and quantum corrections are negligible at the required precision.
  - id: configuration_space
    label: Configuration space
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 10
    kind: structure
    conceptType: State-space structure
    summary: The space of possible instantaneous configurations of a system before momenta are added.
    citations:
      - wp-physics-configuration_space
      - nlab-physics-configuration_space
      - cambridge-classical-dynamics
  - id: hamiltonian
    label: Hamiltonian
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 10
    kind: structure
    conceptType: Dynamical generator
    summary: A function on phase space that generates Hamiltonian time evolution; in quantum theory the Hamiltonian is normally a self-adjoint operator.
    citations:
      - wp-physics-hamiltonian_mechanics
      - nlab-physics-hamiltonian
      - cambridge-classical-dynamics
      - tong-quantum
  - id: lagrangian
    label: Lagrangian
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 10
    kind: structure
    conceptType: Dynamical function
    summary: A function $L(q,\dot q,t)$ whose Euler–Lagrange equations determine classical trajectories.
    citations:
      - wp-physics-lagrangian_mechanics
      - nlab-physics-lagrangian
      - cambridge-classical-dynamics
  - id: lagrangian_density
    label: Lagrangian density
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 10
    kind: structure
    conceptType: Field-theory functional density
    summary: A local density whose spacetime integral gives the action for a classical or quantum field theory.
    citations:
      - wp-physics-lagrangian_density
      - nlab-physics-lagrangian_density
      - tong-qft
  - id: canonical_momentum
    label: Canonical momentum
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 11
    kind: structure
    conceptType: Dynamical quantity
    summary: The momentum $p_i=\partial L/\partial\dot q_i$ conjugate to a generalized coordinate.
    citations:
      - wp-physics-canonical_momentum
      - nlab-canonical-momentum
      - cambridge-classical-dynamics
  - id: hamiltonian_mechanics
    label: Hamiltonian mechanics
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 11
    kind: structure
    conceptType: Theory formulation
    summary: A phase-space formulation of classical mechanics in which observables evolve under a Hamiltonian through Poisson brackets.
    citations:
      - wp-physics-hamiltonian_mechanics
      - nlab-physics-hamiltonian_mechanics
      - cambridge-classical-dynamics
      - tong-quantum
    sections:
      - title: Core structure
        body: States are points of phase space, commonly a symplectic manifold, and the Hamiltonian generates time evolution.
  - id: lagrangian_mechanics
    label: Lagrangian mechanics
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 11
    kind: structure
    conceptType: Theory formulation
    summary: A formulation of classical mechanics based on an action functional and the Euler–Lagrange equations.
    citations:
      - wp-physics-lagrangian_mechanics
      - nlab-physics-lagrangian_mechanics
      - cambridge-classical-dynamics
      - tong-qft
    sections:
      - title: Core structure
        body: A Lagrangian encodes dynamics; stationary action yields the equations of motion. The formalism extends naturally to fields.
  - id: phase_space
    label: Phase space
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 11
    kind: structure
    conceptType: State-space structure
    summary: A state space carrying positions and conjugate momenta, ordinarily a symplectic manifold in Hamiltonian mechanics.
    citations:
      - wp-physics-phase_space
      - nlab-physics-phase_space
      - cambridge-classical-dynamics
  - id: poisson_bracket
    label: Poisson bracket
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 11
    kind: structure
    conceptType: Algebraic dynamical operation
    summary: The antisymmetric bracket on classical observables that generates Hamiltonian evolution and satisfies the Jacobi and Leibniz identities.
    citations:
      - wp-physics-poisson_bracket
      - nlab-physics-poisson_bracket
      - cambridge-classical-dynamics
  - id: stationary_action_principle
    label: Stationary-action principle
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 11
    kind: structure
    conceptType: Variational principle
    summary: The physical history is a stationary point of the action under allowed variations; “stationary” need not mean globally least.
    citations:
      - wp-physics-stationary_action_principle
      - nlab-physics-stationary_action_principle
      - cambridge-classical-dynamics
  - id: euler_lagrange_equation
    label: Euler–Lagrange equation
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 12
    kind: structure
    conceptType: Equation of motion
    summary: The differential equation obtained by setting the first variation of an action to zero under fixed-boundary variations.
    citations:
      - wp-physics-euler_lagrange_equation
      - nlab-physics-euler_lagrange_equation
      - cambridge-classical-dynamics
      - tong-qft
  - id: newtonian_mechanics
    label: Newtonian mechanics
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 12
    kind: structure
    conceptType: Effective theory
    summary: The nonrelativistic classical mechanics of particles and forces in Euclidean space with absolute time.
    citations:
      - wp-physics-newtonian_mechanics
      - cambridge-classical-dynamics
      - tong-relativity
  - id: classical_point_particle
    label: Classical point particle
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 13
    kind: structure
    conceptType: Idealized system
    summary: An idealized object with finitely many degrees of freedom and no resolved internal spatial structure.
    citations:
      - wp-physics-classical_point_particle
      - cambridge-classical-dynamics
  - id: force
    label: Force
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 6
    kind: structure
    conceptType: Dynamical quantity
    summary: In Newtonian mechanics, the rate of change of momentum; in more general formulations interactions need not be represented by a fundamental force vector.
    citations:
      - wp-physics-force
      - nlab-physics-force
      - cambridge-classical-dynamics
  - id: linear_momentum
    label: Linear momentum
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 5
    kind: structure
    conceptType: Physical quantity
    summary: The conserved generator associated with spatial translations in translation-invariant systems; in Newtonian particle mechanics it is $\mathbf p=m\mathbf v$.
    citations:
      - wp-physics-linear_momentum
      - nlab-physics-linear_momentum
      - cambridge-classical-dynamics
      - tong-relativity
  - id: newton_laws
    label: Newton’s laws of motion
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
    level: 13
    kind: structure
    conceptType: Physical laws
    summary: The inertial, dynamical, and action–reaction laws of Newtonian particle mechanics, valid in inertial frames within its nonrelativistic classical regime.
    citations:
      - wp-physics-newton_laws
      - nlab-newton-laws
      - cambridge-classical-dynamics
      - tong-relativity
    sections:
      - title: Scope
        body: 'These laws are not fundamental across all regimes: relativistic, quantum, field-theoretic, dissipative, and constrained systems require more general formulations.'
  - id: galileo_inclined_plane_experiments
    label: Galileo’s inclined-plane experiments
    primaryField: physics
    fields:
      - physics
    primaryDomain: classical-mechanics
    domains:
      - classical-mechanics
      - experiments-observations
    level: 10
    kind: structure
    conceptType: Canonical experiment
    summary: Galileo used inclined planes to slow free fall enough to measure approximately uniform acceleration and to replace Aristotelian motion with quantitative kinematics.
    citations:
      - wp-physics-galileo_inclined_plane_experiments
      - museo-galileo-inclined-plane
    status: Observed / performed
    sections:
      - title: Historical role
        body: The experiments helped establish mathematical laws of accelerated motion that became inputs to Newtonian mechanics; they did not by themselves contain Newton’s later dynamical laws.
edges:
  - id: action_to_stationary
    source: action_functional
    target: stationary_action_principle
    type: theory-component
    label: stationary-action rule
    detail: Stationarity of the action supplies the variational dynamical principle.
    citations:
      - wp-physics-stationary_action_principle
      - nlab-physics-stationary_action_principle
      - wp-physics-action_functional
      - nlab-physics-action_functional
  - id: classical_field_to_canonical_quant
    source: classical_field_theory
    target: canonical_quantization
    type: quantization
    label: canonical field quantization
    detail: Canonical quantization promotes field variables and momenta to operators, when the constraint and gauge structure can be handled.
    citations:
      - wp-physics-canonical_quantization
      - nlab-physics-canonical_quantization
      - wp-physics-classical_field_theory
      - nlab-physics-classical_field_theory
  - id: classical_field_to_em
    source: classical_field_theory
    target: classical_electromagnetism
    type: framework-specialization
    label: electromagnetic field theory
    detail: Classical electromagnetism is a relativistic classical field theory.
    citations:
      - wp-physics-classical_electromagnetism
      - nlab-physics-classical_electromagnetism
      - wp-physics-classical_field_theory
      - nlab-physics-classical_field_theory
  - id: classical_field_to_path_quant
    source: classical_field_theory
    target: path_integral_quantization
    type: quantization
    label: functional-integral quantization
    detail: Path-integral methods construct quantum amplitudes from the classical action after gauge fixing and regularization as needed.
    citations:
      - wp-physics-path_integral_quantization
      - nlab-physics-path_integral_quantization
      - wp-physics-classical_field_theory
      - nlab-physics-classical_field_theory
  - id: classical_field_to_qft
    source: classical_field_theory
    target: quantum_field_theory
    type: quantization
    label: field quantization
    detail: Canonical or path-integral quantization of a classical field theory is a standard route to a QFT, although quantum consistency and renormalization can alter the admissible theory.
    citations:
      - cern-qft-intro
      - wp-physics-quantum_field_theory
      - nlab-physics-quantum_field_theory
      - wp-physics-classical_field_theory
      - nlab-physics-classical_field_theory
  - id: classical_mechanics_to_point
    source: classical_mechanics
    target: classical_point_particle
    type: describes-governs
    label: point-particle dynamics
    detail: Classical mechanics describes ideal point particles and finite-dimensional systems.
    citations:
      - wp-physics-classical_point_particle
      - wp-physics-classical_mechanics
      - nlab-physics-classical_mechanics
  - id: classical_to_hamiltonian
    source: classical_mechanics
    target: hamiltonian_mechanics
    type: framework-specialization
    label: phase-space formulation
