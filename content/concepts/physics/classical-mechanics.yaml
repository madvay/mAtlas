      - nlab-physics-hamiltonian_mechanics
      - wp-physics-classical_mechanics
  - id: classical_to_lagrangian
    source: classical_mechanics
    target: lagrangian_mechanics
    type: framework-specialization
    label: action formulation
    detail: Lagrangian mechanics reformulates classical dynamics using an action principle.
    citations:
      - cambridge-classical-dynamics
      - cern-qft-intro
      - wp-physics-lagrangian_mechanics
      - nlab-physics-lagrangian_mechanics
      - wp-physics-classical_mechanics
  - id: classical_to_newtonian
    source: classical_mechanics
    target: newtonian_mechanics
    type: framework-specialization
    label: Newtonian formulation
