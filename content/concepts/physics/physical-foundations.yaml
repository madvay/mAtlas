nodes:
  - id: physical_system
    label: Physical system
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 0
    kind: structure
    conceptType: Entity or system
    summary: A delimited portion or idealized part of the physical world selected for description by a physical theory or model.
    citations:
      - wp-physics-physical_system
      - nlab-physics-physical_system
      - nist-quantum-theory
    status: General modeling concept
    sections:
      - title: Scope
        body: The boundary and degrees of freedom are chosen for the problem; the same physical situation can support several valid system decompositions.
    root: true
  - id: physical_theory
    label: Physical theory
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 0
    kind: structure
    conceptType: Theory or framework
    summary: A mathematically expressed, empirically constrained framework that represents classes of physical systems and predicts relations among measurable quantities.
    citations:
      - wp-physics-physical_theory
      - nlab-physics-physical_theory
      - cern-standard-model
      - einstein-general-relativity
    status: General scientific concept
    sections:
      - title: Epistemic status
        body: Theories supply models and predictions within tested regimes; they are not logical consequences of their mathematical formalism alone.
    root: true
  - id: physical_law
    label: Physical law
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 1
    kind: structure
    conceptType: Law or relation
    summary: A compact relation or rule describing a stable regularity of physical systems within a stated domain of validity.
    citations:
      - wp-physics-physical_law
      - nlab-physical-law
      - nist-codata
  - id: physical_quantity
    label: Physical quantity
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 1
    kind: structure
    conceptType: Physical quantity
    summary: A measurable or theoretically defined property represented by a value, unit, tensor, operator, field, or distribution.
    citations:
      - wp-physics-physical_quantity
      - nist-codata
  - id: degree_of_freedom
    label: Degree of freedom
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 2
    kind: structure
    conceptType: Model component
    summary: An independent variable or mode needed to specify a state within a chosen description.
    citations:
      - wp-physics-degree_of_freedom
      - nlab-degree-of-freedom
      - cambridge-classical-dynamics
  - id: observable
    label: Observable
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 2
    kind: structure
    conceptType: Physical quantity
    summary: A quantity represented by a theory and connected to a possible measurement outcome or statistical distribution.
    citations:
      - wp-physics-observable
      - nlab-physics-observable
      - nist-quantum-theory
    sections:
      - title: Caution
        body: 'The mathematical representation of an observable depends on the theory: functions on phase space in classical mechanics and self-adjoint operators or POVMs in quantum theory.'
  - id: physical_scale
    label: Physical scale
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 2
    kind: structure
    conceptType: Regime parameter
    summary: A characteristic length, time, energy, momentum, or mass used to separate relevant from unresolved degrees of freedom.
    citations:
      - wp-physics-physical_scale
      - penco-eft
  - id: physical_state
    label: Physical state
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 2
    kind: structure
    conceptType: State description
    summary: A specification, relative to a theory, sufficient to determine probabilities or allowed future behavior for the observables represented by that theory.
    citations:
      - wp-physics-physical_state
      - nlab-physics-state
      - nist-quantum-theory
    sections:
      - title: Theory dependence
        body: Classical states are commonly points in phase space; quantum states are rays or density operators on a Hilbert space.
  - id: physical_symmetry
    label: Physical symmetry
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 2
    kind: structure
    conceptType: Structural principle
    summary: A transformation that leaves specified physical structure, laws, or observables invariant; exact, approximate, local, global, continuous, or discrete symmetries must be distinguished.
    citations:
      - wp-physics-physical_symmetry
      - nlab-physics-symmetry
      - tong-qft
  - id: fundamental_interaction
    label: Fundamental interaction
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 3
    kind: structure
    conceptType: Interaction class
    summary: An interaction currently treated as irreducible within established theory. The conventional list is gravitational, electromagnetic, strong, and weak; the Standard Model describes the latter three, with electromagnetic and weak interactions unified electroweakly and QCD forming a separate gauge factor.
    citations:
      - wp-physics-fundamental_interaction
      - cern-standard-model
    sections:
      - title: Current classification
        body: Electromagnetic, weak, strong, and gravitational interactions are conventionally treated as fundamental. The Standard Model contains the electroweak and strong gauge sectors but not gravitation.
    root: true
  - id: physical_model
    label: Physical model
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 3
    kind: structure
    conceptType: Model
    summary: A representation of a selected physical system that specifies retained degrees of freedom, laws, parameters, and idealizations; a model can instantiate a theory without being either exact or a controlled approximation.
    citations:
      - wp-physics-physical_model
      - cambridge-classical-dynamics
  - id: conservation_law
    label: Conservation law
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 4
    kind: structure
    conceptType: Physical law
    summary: A statement that a physical quantity is constant under evolution or obeys a local continuity equation, often but not always associated with a symmetry.
    citations:
      - wp-physics-conservation_law
      - nlab-physics-conservation_law
      - tong-qft
  - id: coupling_constant
    label: Coupling constant
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 4
    kind: structure
    conceptType: Theory parameter
    summary: A parameter controlling the strength of an interaction term; in QFT its renormalized value may depend on scale.
    citations:
      - wp-physics-coupling_constant
      - nlab-coupling-constant
      - tong-qft
  - id: equation_of_motion
    label: Equation of motion
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 4
    kind: structure
    conceptType: Physical law
    summary: An equation determining allowed histories or evolution from the dynamical variables and initial or boundary data.
    citations:
      - wp-physics-equation_of_motion
      - nlab-physics-equation_of_motion
      - cambridge-classical-dynamics
  - id: effective_description
    label: Effective description
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 8
    kind: structure
    conceptType: Approximate framework
    summary: A description valid in a limited regime that suppresses, averages, or integrates out inaccessible degrees of freedom and encodes their effects in parameters or operators.
    citations:
      - wp-physics-effective_description
      - burgess-eft
      - penco-eft
  - id: energy
    label: Energy
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 5
    kind: structure
    conceptType: Physical quantity
    summary: A conserved generator associated with time-translation symmetry in closed time-independent systems; its concrete representation and localization depend on the theory.
    citations:
      - wp-physics-energy
      - nlab-physics-energy
      - cambridge-classical-dynamics
      - tong-relativity
  - id: continuity_equation
    label: Continuity equation
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 5
    kind: structure
    conceptType: Conservation law
    summary: A local conservation equation of the form $\partial_t\rho+\nabla\cdot\mathbf j=0$; in flat relativistic spacetime it is $\partial_\mu j^\mu=0$, while on curved spacetime the corresponding form is $\nabla_\mu j^\mu=0$.
    citations:
      - wp-physics-continuity_equation
      - nlab-physics-conservation_law
      - tong-em
      - tong-qft
  - id: binding_energy
    label: Binding energy
    primaryField: physics
    fields:
      - physics
    primaryDomain: physical-foundations
    domains:
      - physical-foundations
    level: 7
    kind: structure
    conceptType: Energy difference
    summary: The energy required to separate a bound system into specified free constituents; equivalently, the bound state lies below that breakup threshold and has a corresponding mass deficit in its rest frame.
    citations:
      - wp-physics-binding_energy
      - nlab-binding-energy
      - einstein-binding-energy
