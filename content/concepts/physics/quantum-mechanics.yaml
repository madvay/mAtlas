    primaryDomain: quantum-mechanics
    domains:
      - quantum-mechanics
      - quantum-chemistry-spectroscopy
    level: 2
    kind: structure
    conceptType: Theory or framework
    summary: The framework governing physical systems whose states exhibit superposition, probabilistic measurement outcomes, and noncommuting observables.
    citations:
      - wp-physics-quantum_mechanics
      - nlab-physics-quantum_mechanics
      - nist-quantum-theory
      - tong-quantum
    sections:
      - title: Mathematical core
        body: States are represented in a complex Hilbert space, observables by operators, and isolated-system evolution by unitary dynamics.
      - title: Scope
        body: Nonrelativistic quantum mechanics is an effective framework; relativistic particle creation and annihilation require quantum field theory.
