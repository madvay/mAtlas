  - id: yang_mills_mass_gap
    label: Yang–Mills mass gap
    primaryField: physics
    fields:
      - physics
    primaryDomain: quantum-field-theory
    domains:
      - quantum-field-theory
    level: 14
    kind: structure
    conceptType: Expected nonperturbative property / open mathematical problem
    summary: Pure four-dimensional confining quantum Yang–Mills theory is expected to have a positive energy gap above its vacuum. Constructing the continuum theory rigorously and proving the gap remains an open Clay Millennium problem. This must not be conflated with exact chiral-limit QCD, whose spontaneously broken chiral symmetry gives massless Nambu–Goldstone modes.
    citations:
      - wp-physics-yang_mills_mass_gap
      - nlab-physics-yang_mills_mass_gap
      - clay-yang-mills-mass-gap
      - tong-gauge
    sections:
      - title: Distinction from QCD
        body: Physical QCD with nonzero light-quark masses has a gapped hadron spectrum. In the exact massless-light-quark limit, however, spontaneous chiral-symmetry breaking produces massless pions, so the full theory does not have a positive spectral gap. The Clay problem concerns pure Yang–Mills theory.
      - title: Mathematical status
        body: A satisfactory solution must construct a nontrivial four-dimensional quantum Yang–Mills theory with appropriate axiomatic properties and prove a strictly positive mass gap.
