    fields:
      - physics
    primaryDomain: quantum-field-theory
    domains:
      - quantum-field-theory
    level: 4
    kind: structure
    conceptType: Symmetry
    summary: A symmetry whose transformation parameters are not arbitrary functions of spacetime. Internal global symmetries act on fields at fixed spacetime points; spacetime symmetries are also global but act on spacetime itself.
