      - tong-qft
  - id: quantum_field
    label: Quantum field
    primaryField: physics
    fields:
      - physics
    primaryDomain: quantum-field-theory
    domains:
      - quantum-field-theory
    level: 4
    kind: structure
    conceptType: Field
    summary: A field degree of freedom in a quantum field theory; in common formulations fields are operator-valued distributions, while particle states arise from the theory’s excitations and asymptotic sectors.
    citations:
      - wp-physics-quantum_field_theory
      - nlab-physics-quantum_field
      - cern-qft-intro
      - tong-qft
    sections:
      - title: Particle relation
        body: In regimes with a useful particle interpretation, particle states are excitations of quantum fields; that interpretation can be observer- and background-dependent.
