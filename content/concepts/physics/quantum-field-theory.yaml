nodes:
  - id: quantum_field_theory
    label: Quantum field theory
    primaryField: physics
    fields:
      - physics
    primaryDomain: quantum-field-theory
    domains:
      - quantum-field-theory
    level: 10
    kind: structure
    conceptType: Theory or framework
    summary: A framework in which fields are quantum degrees of freedom, supporting many-body and variable-particle-number descriptions. Relativistic QFT additionally imposes relativistic symmetry and causal locality and naturally accommodates antiparticles and scattering.
    citations:
      - wp-physics-quantum_field_theory
      - nlab-physics-quantum_field_theory
      - cern-qft-intro
      - tong-qft
    sections:
      - title: Core ingredients
        items:
          - Quantum fields or local observables and a quantum state space.
          - Dynamics encoded by a Hamiltonian, action, or algebraic evolution law.
          - In relativistic formulations, Lorentz or spacetime symmetry and causal locality.
          - Correlation functions, response functions, or scattering observables, with renormalization where required.
      - title: Scope
        body: Relativistic QFT underlies the Standard Model; nonrelativistic quantum field theories also provide effective descriptions of many-body and condensed-matter systems.
  - id: gauge_field_theory
    label: Gauge field theory
    primaryField: physics
    fields:
      - physics
    primaryDomain: quantum-field-theory
    domains:
      - quantum-field-theory
    level: 11
    kind: structure
    conceptType: Theory class
    summary: A field theory with local gauge redundancy, whose gauge structure constrains interactions and introduces gauge fields.
    citations:
      - wp-physics-gauge_field_theory
      - nlab-physics-gauge_field_theory
      - tong-gauge
      - pdg-standard-model
    sections:
      - title: Mathematical structure
        body: Gauge theories are formulated using Lie groups and Lie algebras; globally, connections on principal bundles provide the geometric language.
  - id: gauge_symmetry
