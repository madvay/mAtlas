    primaryField: physics
    fields:
      - physics
    primaryDomain: quantum-field-theory
    domains:
      - quantum-field-theory
    level: 4
    kind: structure
    conceptType: Descriptive redundancy
    summary: 'A local redundancy in field variables: gauge-related configurations represent the same physical state, while global and boundary gauge transformations may carry physical charges.'
