  - id: young_double_slit_experiment
    label: Young’s double-slit experiment
    primaryField: physics
    fields:
      - physics
    primaryDomain: electromagnetism
    domains:
      - electromagnetism
      - experiments-observations
    level: 11
    kind: structure
    conceptType: Canonical experiment
    summary: Young’s early nineteenth-century interference experiment showed that light intensities form fringes when coherent paths overlap, providing strong evidence for a wave description of light.
    citations:
      - wp-physics-young_double_slit_experiment
      - young-original
    status: Observed / performed
    sections:
      - title: Scope
        body: This historical optical experiment is distinct from later single-particle double-slit experiments in quantum mechanics.
  - id: oersted_compass_experiment
    label: Ørsted’s compass experiment
    primaryField: physics
    fields:
      - physics
    primaryDomain: electromagnetism
    domains:
      - electromagnetism
      - experiments-observations
    level: 11
    kind: structure
    conceptType: Canonical experiment
    summary: Ørsted observed in 1820 that an electric current deflects a nearby compass needle, establishing an empirical link between electricity and magnetism.
    citations:
      - wp-physics-oersted_compass_experiment
      - aps-oersted
    status: Observed / performed
  - id: faraday_induction_experiments
