    primaryDomain: electromagnetism
    domains:
      - electromagnetism
      - experiments-observations
    level: 12
    kind: structure
    conceptType: Canonical experiment
    summary: Faraday’s 1831 experiments showed that changing magnetic flux induces an electromotive effect and introduced field-based patterns that Maxwell later mathematized.
    citations:
      - wp-physics-faraday_induction_experiments
      - royal-institution-faraday
    status: Observed / performed
  - id: hertz_electromagnetic_wave_experiments
