    fields:
      - physics
    primaryDomain: electromagnetism
    domains:
      - electromagnetism
      - experiments-observations
    level: 15
    kind: structure
    conceptType: Canonical experiment
    summary: Hertz generated and detected radio-frequency electromagnetic waves in the late 1880s, confirming central wave predictions of Maxwellian electrodynamics.
    citations:
      - wp-physics-hertz_electromagnetic_wave_experiments
      - aps-hertz
      - tong-em
    status: Observed / performed
